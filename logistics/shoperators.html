<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shoperators</title>
<link rel="preload" href="../assets/fonts/google-sans-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../assets/fonts/bebas-neue-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<link rel="stylesheet" href="../assets/x-bar.css"><!-- the handbook's scroll bar, as the X pages' (author, 2026-11-12: "needs ak style") -->
<script src="certs-data.js"></script>
<style>
/* SHOPERATORS: the certificate store page (name: author, 2026-10-19), as the author put it together ("here our page"): C6 mock 01's top (the
   store now, Kernel Locating, the limited banner box), then 03's leaving Standard / next new rows
   beside 03's next-in-store bars. Data: certs-data.js (python logistics/build_certs.py; no fetch, the page also
   opens from disk). Thai lines are the author's to write (dashed placeholders). Was logistics/proto/certs-page.html. */
:root {
  --bg: #121212; --panel: #121212; --line: rgba(255,255,255,.12); --line2: rgba(255,255,255,.28);
  --text: #e6e8f0; --grey: #8a8a8a; --gold: #ccba73; --gold-d: #8f8251; --gold-bg: #3a3527;
  --display: 'Bebas Neue', 'Oswald', sans-serif; --sans: 'Google Sans', 'Sarabun', sans-serif;
  --label: 'Oswald', 'Google Sans', sans-serif;
  /* rarity colour code (author, 2026-10-19): 6★ a slightly reddish orange, 5★ pure orange, limited 6★ FUTURE's soft
     rainbow (it was 6★ the sheet's yellow #fbbc04, 5★ silver #c9ccd4) */
  --r6: #f2763a; --r5: #ffc04d;   /* 5★: #ffa500 30% lighter (author) */
  --rainbow: linear-gradient(90deg, #d99aa6, #d9b98f, #c9cf96, #9cc9a6, #8fb6c9, #aa9dd2, #d3a3d5);
}
/* the rarity bar only under the big store pictures, not the small icons (author, 2026-10-19) */
.product .pick .av.r6 { border-bottom: 3px solid var(--r6); }
.product .pick .av.r5 { border-bottom: 3px solid var(--r5); }
.product .pick .av.rl { border-bottom: 3px solid; border-image: var(--rainbow) 1; }
.s6 { color: var(--r6); } .s5 { color: var(--r5); }
.p-std { color: #d9b866; } .p-ker { color: #66afca; }   /* the pools: BANNERS' Standard and Kernel hexes */
.sl { background: var(--rainbow); -webkit-background-clip: text; background-clip: text; color: transparent; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--sans); }
main { max-width: 1240px; margin: 0 auto; padding: 40px 16px 72px; }
.kicker { font: 600 12px/1 var(--label); letter-spacing: .18em; color: var(--grey); text-transform: uppercase; }
.kicker i { font-style: normal; color: var(--gold); }
.thai { color: var(--grey); font: 14px/1.6 'Sarabun', sans-serif; border-left: 2px dashed #54575d; padding-left: 10px; margin: 8px 0 0; }
.av { display: block; object-fit: cover; }   /* no grey box behind the portrait (author, 2026-10-30) */
.star { color: var(--gold); }
.plate { display: inline-flex; align-items: baseline; gap: 10px; background: #e8e8e8; color: #35342a; padding: 4px 14px 2px;
         font: 30px/1 var(--display); letter-spacing: .02em; }
.plate .to { color: var(--gold-d); font-size: 18px; position: relative; top: -.206em; }
.ar { position: relative; top: -.054em; }
/* arrows' ink centred on the dates' digits (author, 2026-10-19), measured from the drawn pixels at 10x: the plate's
   digits centre 10.05 px above the baseline, its 18 px arrows 6.35 px, so up 3.7 px = .206em; the card feet
   (12 px Oswald) digits 4.9 px, arrows 4.25 px, so up .65 px = .054em */

/* the store now (01) */
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap;
       border-bottom: 1px solid var(--line); padding-bottom: 14px; margin-bottom: 22px; }
.top h1 { margin: 4px 0 0; font: 76px/0.85 var(--display); font-weight: 400; }
/* the CN page's link under today's date (author, 2026-10-29: Shoperators CN, its own page) */
.top .right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.top .right a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--line2); }
.top .right a:hover { color: var(--text); }
.shelf { display: grid; grid-template-columns: 1fr 1fr 1.35fr; gap: 18px; }
.shelf.two { grid-template-columns: 1fr 1fr; }   /* no Locating running or coming: two cards share the row */
.product { background: var(--panel); position: relative; display: flex; flex-direction: column; }   /* no cut corner (author) */
.product .tag { display: flex; gap: 6px; padding: 12px 14px 0; }
.product .tag span { background: var(--gold-bg); color: var(--gold); font: 600 11px/1.6 var(--label); letter-spacing: .1em; padding: 0 7px; }
.product .tag span.g { background: #313236; color: var(--grey); }
.product .tag span.g b { font-weight: inherit; }   /* ×12 6★ · ×24 5★ in the rarity colours (author, 2026-11-13) */
.cd { font-variant-numeric: tabular-nums; }
.product .pick { display: flex; gap: 14px; align-items: flex-end; padding: 18px 14px 14px; margin-top: auto; }
/* no fixed card height and no empty band (author, 2026-10-19): the cards are as tall as the tallest content,
   each card's black foot sits on its bottom edge */
.product .pick .av { width: 132px; height: 132px; }
.product .pick .five .av { width: 76px; height: 76px; }
.product .nm { font: 26px/1 var(--display); margin-top: 8px; letter-spacing: .02em; }
.product .five .nm { font-size: 19px; }
/* the star and the name on one line (author, 2026-10-30); a name too long for the card is made smaller (fitNames) */
.product .pick > div { min-width: 0; }
.product .nm { white-space: nowrap; overflow: hidden; }
.product .foot { background: #000; padding: 8px 14px; margin-top: 0;   /* at the card's top (author, 2026-10-19) */ display: flex; justify-content: space-between;
                 align-items: baseline; font: 600 12px/1 var(--label); letter-spacing: .1em; color: var(--grey); }
.product .foot b { color: var(--text); font-weight: 600; }
/* each card's top bar and tag in its pool's colour, BANNERS' category hexes (banners/docs/PLAN.md; author,
   2026-10-19): Standard #d9b866, Kernel #66afca (Kernel Locating is Kernel) */
.product { --pool: #d9b866; --pool-bg: #3a3527; }
.product.ker, .product.kl { --pool: #66afca; --pool-bg: #1a2e38; }
.product .tag span:first-child { background: var(--pool); color: #121212; }
.product .foot { background: linear-gradient(90deg, var(--pool) 0%, var(--pool-bg) 100%); color: #121212; }
.product .foot b { color: #fff; }
/* a minimal frame in each banner type's accent (author, 2026-10-19), all four sides (the U frame, open at the top,
   is the commit before): 1 px, drawn inside, so nothing moves */
.product::after { content: ''; position: absolute; inset: 0; pointer-events: none;
                  border: .5px solid color-mix(in srgb, var(--pool) 45%, transparent); }   /* thinner, dimmer (author) */
/* drawn as a layer over the card: an inset shadow sits under the contents, and the top bar hid it there */
/* the limited box has no frame: its rate-up bars along the bottom are enough (author, 2026-10-19) */
/* the bar fades darker to the right, so the white dates stand out on the dark end (author, 2026-10-19); the label
   dark on the bright end */
.product.kl .grid6 { display: flex; flex-wrap: wrap; gap: 6px; padding: 14px 14px 0; }
.product.kl .grid6 .av { width: 46px; height: 46px; }
.product.kl .grid5 { display: flex; flex-wrap: wrap; gap: 3px; padding: 10px 14px 14px; }
.product.kl .grid5 .av { width: 23px; height: 23px; filter: grayscale(.4) brightness(.8); }   /* half the 6★' 46 px (author) */
.product.kl .soon { position: absolute; top: 40px; right: 14px; font: 600 12px/1.6 var(--label); letter-spacing: .1em;
                    color: #202124; background: var(--gold); padding: 0 8px; }
.also { margin-top: 18px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line); padding: 10px 0; font-size: 14px; }
.also .avs { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }   /* wraps on a phone: it ran 26 px off a 366 px screen (CN) */ .also .av { width: 34px; height: 34px; }
/* the swap bubble: the CN page at this same scroll place, in this tab (author, 2026-10-30) */
.swap { position: fixed; right: 24px; bottom: 24px; z-index: 50; width: 56px; height: 56px; border-radius: 50%;
        display: grid; place-items: center; background: var(--panel); border: 2px solid var(--gold); color: var(--text);
        font: 600 13px/1 var(--label); letter-spacing: .1em; text-decoration: none;
        /* a solid round ring, so it stands apart from the bars behind (author, 2026-10-30: "doesn't look round, and
           too hard to distinguish"; the outer dark halo taken off again, the same day) */
        box-shadow: 0 6px 18px rgba(0, 0, 0, .6); }
/* this page big in gold, the other small and dim under it (author, 2026-10-30: option B) */
.swap .st { display: flex; flex-direction: column; align-items: center; gap: 2px; pointer-events: none; }
.swap .cur { font-size: 19px; color: var(--gold); letter-spacing: .08em; }
.swap .oth { font-size: 11px; color: var(--grey); letter-spacing: .14em; }
.swap { touch-action: none; cursor: pointer; user-select: none; transition: left .3s, top .3s; }   /* the clicking hand; the grab hand only while dragging (author, 2026-10-30) */
.swap.drag { transition: none; cursor: grabbing; }

/* the limited banner: two rate-up 6★ fading into each other at the centre line (author's sketch) */
.lim { position: relative; height: 230px; margin-top: 18px; background: #121212; overflow: hidden; }
.lim .half { position: absolute; top: 0; bottom: 0; width: 54%; background: #121212; }
.lim .half img { width: 100%; height: 100%; object-fit: cover; display: block; }
.lim .half.a { left: 0; -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent 100%);
               mask-image: linear-gradient(90deg, #000 85%, transparent 100%); }
.lim .half.b { right: 0; -webkit-mask-image: linear-gradient(270deg, #000 85%, transparent 100%);
               mask-image: linear-gradient(270deg, #000 85%, transparent 100%); }
.lim .mid { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,.35); }
.lim .shade { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(0,0,0,.82) 0%, rgba(0,0,0,0) 46%),
              linear-gradient(180deg, rgba(0,0,0,.6) 0%, rgba(0,0,0,0) 30%); }
.lim .when { position: absolute; top: 12px; right: 16px; display: flex; flex-direction: column; align-items: flex-end; }
/* the LIMITED tag hangs under the date plate, its top 2 px over the plate's bottom edge (author, 2026-10-19) */
.lim .tag { position: relative; z-index: 1; margin-top: -2px; display: flex; gap: 6px; align-items: center; }
.lim .tag span { color: #202124; font: 600 11px/1.7 var(--label); letter-spacing: .1em; padding: 0 8px; }
.lim .tag span.lt { background: var(--rainbow); }
.lim .tag span.g { background: rgba(0,0,0,.6); color: var(--text); }
.lim .nm { position: absolute; bottom: 14px; font: 38px/0.9 var(--display); letter-spacing: .02em; text-shadow: 0 2px 8px #000; }
.lim .nm small { display: block; font: 600 11px/1.6 var(--label); letter-spacing: .14em; color: var(--gold); text-shadow: none; }
.lim .nm small.sl, .lim .nm small.s6 { display: inline-block; }
/* the rate-up labels as filled tags fitted to their text (author, 2026-10-19): 6★ yellow, limited 6★ rainbow */
.lim .nm small.s6, .lim .nm small.sl { padding: 1px 4px 0; line-height: 1.25; letter-spacing: .1em; margin-bottom: 4px; color: #202124; }
.lim .nm small.s6 { background: var(--r6); }
.lim .nm small.sl { background: var(--rainbow); -webkit-background-clip: border-box; background-clip: border-box; }
.lim .rbar { position: absolute; bottom: 0; height: 4px; width: 50%; }
.lim .rbar.a { left: 0; } .lim .rbar.b { right: 0; }
.lim .rbar.r6 { background: var(--r6); } .lim .rbar.rl { background: var(--rainbow); }
.lim .nm.a { left: 18px; } .lim .nm.b { right: 18px; text-align: right; }
.lim .title { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); text-align: center;
              font: 600 12px/1.4 var(--label); letter-spacing: .16em; white-space: nowrap; background: rgba(0,0,0,.55); padding: 2px 10px; }
.lim-foot { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 8px 0 10px; border-bottom: 1px solid var(--line);
            font-size: 13px; color: var(--grey); }
.lim-foot .av { width: 30px; height: 30px; }

/* the EN shop history under the rows, as the CN page's (author, 2026-10-30: "en shop history left bar pls") */
.cols > div > .kicker.big { font-size: 18px; letter-spacing: .06em; margin: 26px 0 10px; color: var(--text); }
.hist { display: grid; grid-template-columns: max-content max-content 1fr; column-gap: 10px; row-gap: 4px; align-items: center; }
.hist .row { display: contents; }
.hist .no { font: 600 11px/1.3 var(--label); letter-spacing: .08em; padding: 2px 6px; color: #121212; background: #d9b866;
            text-align: left; }
.hist .no.ker { background: #66afca; }
.hist .dt { font-size: 13px; color: var(--grey); white-space: nowrap; }
.hist .picks { display: flex; gap: 6px; align-items: center; min-width: 0; }
.hist .picks .av { width: 30px; height: 30px; flex: none; }
.hist .picks .av.r6 { box-shadow: 0 2px 0 var(--r6); }
.hist .picks .av.r5 { box-shadow: 0 2px 0 var(--r5); }
.hist .picks span { font-size: 11px; color: var(--grey); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hist .yr { grid-column: 1 / -1; font: 18px/1 var(--display); letter-spacing: .06em; color: var(--grey); padding: 12px 0 2px; }
.hist .yr:first-child { padding-top: 0; }
/* below: the rows (03) beside the bars (03) */
.cols { display: grid; grid-template-columns: 300px 1fr; gap: 32px; margin-top: 40px; }
.fact { display: grid; grid-template-columns: 56px 1fr; margin-bottom: 6px; min-height: 52px; }
.fact .k { background: #000; color: var(--grey); font: 600 16.5px/1.3 var(--label); letter-spacing: .08em; padding: 10px 4px;
           display: flex; align-items: center; justify-content: center; }   /* centred, 50% bigger (author) */
/* each label chip filled with its colour, dark text on it (author, 2026-10-19): 6★ / 5★ their rarity, NEXT the
   Kernel blue (it is about joining Kernel) */
.fact .k.f6, .fact.hl .k.f6 { background: var(--r6); color: #121212; }
.fact .k.f5, .fact.hl .k.f5 { background: var(--r5); color: #121212; }
.fact .k.fk, .fact.hl .k.fk { background: #66afca; color: #121212; }
.fact .v { background: #313236; display: flex; gap: 10px; align-items: center; padding: 6px 10px; font-size: 15px; }
.fact .v .av { width: 40px; height: 40px; }
.fact .v .big { font: 24px/1 var(--display); letter-spacing: .02em; white-space: nowrap; }
.fact .v .stack { display: flex; flex-direction: column; gap: 0; }
.fact .v .stack .big { line-height: .9; margin-top: 3px; }   /* the name sits down on its date (author) */
.fact .v .when-col { color: var(--grey); font-size: 13px; white-space: nowrap; }
.fact.hl .k { color: var(--gold); }
.fact .pics { display: flex; flex-wrap: wrap; gap: 3px; }
/* the name and number columns the same on every list and on the CN page, so EN and CN line up (author, 2026-10-30:
   "copy en's grid ratios"): 102px = the longest name in either page's lists (Sand Reckoner), 100px = EN's widest
   number with its % chip; a longer name or number still widens its own list */
.stat-rows { display: grid; grid-template-columns: 34px minmax(102px, max-content) 1fr minmax(100px, max-content);
             grid-auto-rows: 40px; column-gap: 10px; align-items: center; }
.stat { display: contents; }
.stat .av { width: 34px; height: 34px; }
.stat .nm { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stat .track { position: relative; height: 14px; background: #313236; }
.stat .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--gold-d); }
.stat .fill.top { background: var(--gold); }
/* Standard lists in BANNERS' Standard #d9b866, Kernel lists in its Kernel #66afca (author, 2026-10-19), as the
   cards; below the top 3 the same hue at 60% */
.statgroup.std .fill { background: #8a7637; }
.statgroup.std .fill.top { background: #d9b866; }
.statgroup.std .lk.Likely { background: #3a3221; color: #d9b866; }
.statgroup.std .lk.Lower { background: #202124; color: #cdbf93; }
.statgroup.ker .fill { background: #356c83; }
.statgroup.ker .fill.top { background: #66afca; }
.statgroup.ker .lk.Likely { background: #22303a; color: #66afca; }
.statgroup.ker .lk.Lower { background: #202124; color: #9cc6d8; }
.stat .num { position: relative; display: flex; gap: 6px; align-items: baseline; font: 20px/1 var(--display);
             font-variant-numeric: tabular-nums; cursor: help; outline: none; }
.stat .num b { font-weight: 400; min-width: 2.1em; text-align: right; }
.stat .num small { font: 11px var(--sans); color: var(--grey); }
.lk { display: inline-block; padding: 2px 7px; font: 600 11px/1.3 var(--label); letter-spacing: .08em; }
.lk.Likely { background: var(--gold-bg); color: var(--gold); }
.lk.Lower { background: #313236; color: #d3c8a9; }
.lk.No { background: transparent; color: var(--grey); }
.statgroup + .statgroup { margin-top: 30px; }
.statgroup > .kicker { font-size: 18px; letter-spacing: .06em; margin-bottom: 4px; }   /* 50% bigger, fitter (author) */
.statgroup.std > .kicker, .statgroup.std > .kicker i { color: #d9b866; }   /* the grey takes the pool colour (author) */
.statgroup.ker > .kicker, .statgroup.ker > .kicker i { color: #66afca; }
/* LOCATING PREDICTION (author, 2026-11-12): rows as the shop lists', the 5★ as one line of pictures */
.statgroup.loc .sub { font: 13px/1.5 var(--sans); color: var(--grey); margin: 2px 0 10px; }
.statgroup.loc .sub b { color: var(--text); font-weight: 600; }
.statgroup.loc .five { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 10px; }
.statgroup.loc .five .av { width: 30px; height: 30px; }
/* the coverage box, as the CN page's (2026-11-14): tiers, round icons, the picked marks */
.statgroup.loc .tier { font: 600 12px/1 var(--label); letter-spacing: .12em; color: var(--grey); margin: 14px 0 6px; }
.statgroup.loc .tier b { color: var(--text); font-weight: 600; }
.statgroup.loc .tier small { font: 12px/1 var(--sans); letter-spacing: 0; margin-left: 8px; }
.statgroup.loc .five.maybe .av { opacity: .5; }
.statgroup.loc .out .av { filter: grayscale(1); opacity: .45; }
.statgroup.loc .pop { top: auto; bottom: calc(100% + 8px); }   /* a small pop-up opens up, never down (#28) */
.statgroup.loc .stat .num { gap: 2px; }                        /* 58%, not 58 % */
.statgroup.loc .nw { white-space: nowrap; }                    /* a range of rounds stays on one line */
/* the round icons: one per round, the shown one filled in the Kernel accent; a round with nothing before it is dim */
.statgroup.loc .rnos { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; margin-top: 8px;
  touch-action: pan-y; user-select: none; -webkit-user-select: none; }   /* a sideways drag turns rounds; up and down still moves the page */
.statgroup.loc .rnos em { font: 600 10px/1 var(--label); font-style: normal; letter-spacing: .12em; margin-right: 5px; }
.statgroup.loc .rno { min-width: 22px; height: 22px; box-sizing: border-box; padding: 0 4px; border: 0; background: #313236; color: var(--text);
  font: 600 12px/22px var(--label); text-align: center; cursor: pointer; }
.statgroup.loc .rno:hover, .statgroup.loc .rno:focus-visible { background: var(--text); color: #121212; outline: 0; }
.statgroup.loc .rno.on { background: #66afca; color: #121212; } .statgroup.loc .rno.off { opacity: .35; cursor: default; }
/* really picked (a past round): the name in a filled box snug to it, the picture in full colour with a line under it */
.statgroup.loc .stat .nm mark { background: #66afca; color: #121212; padding: 1px 4px; }
.statgroup.loc .five { row-gap: 6px; } .statgroup.loc .five .av.real { box-shadow: 0 3px 0 #66afca; opacity: 1; filter: none; }
/* a finished round: how much of its 12 the box covered, LIKELY + POSSIBLE; a pick from LESS LIKELY lowers it (author,
   2026-11-14: "percentage of each KL successfully predicted (likely possible)") */
.statgroup.loc .kicker .cov { color: var(--text); }
/* REPLAY: a history tag shows the bars as they stood 7 days before that banner (author, 2026-11-12) */
.hist .no.rp { cursor: pointer; }
.hist .no.on { outline: 2px solid #fff; outline-offset: 1px; }
/* the popups count from today: hidden in a replay, but kept in place, as the page's height counts them too */
#bars.replay .pop { visibility: hidden !important; opacity: 0 !important; }
#bars.replay .statgroup:not(.loc) .fill { background: #54575d; }
#bars.replay .stat .av.hit { outline: 2px solid #d9b866; outline-offset: 1px; }   /* the banner type's colour (author) */
#bars.replay .statgroup.ker .stat .av.hit { outline-color: #66afca; }
#bars.replay .statgroup.ker .stat .nm.hit { text-decoration-color: #66afca; }
#bars.replay .stat .nm.hit { color: #fff; text-decoration: underline; text-decoration-color: var(--gold); text-underline-offset: 3px; }
#bars.replay .fill.hit { background: var(--gold) !important; }
#rp { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 40; display: none; align-items: center; gap: 14px;
      background: #202124; border: 1px solid var(--line2); padding: 10px 14px; font: 13px/1.4 var(--sans); color: var(--text);
      box-shadow: 0 8px 24px rgba(0,0,0,.55); width: max-content; max-width: calc(100vw - 32px); box-sizing: border-box; }
#rp.on { display: flex; }
/* the history as a floating window while replaying, locked on the chosen banner (author, 2026-11-12) */
#rpwin { position: fixed; z-index: 39; display: none; background: #202124; border: 1px solid var(--line2);
         box-shadow: 0 8px 24px rgba(0,0,0,.55); padding: 8px 10px; box-sizing: border-box; }
#rpwin.on { display: block; }
/* the EN/CN bubble steps out of the replay window's and line's way (author, 2026-11-12: "auto move it outside the
   panel, if the panel blocks it"): a transform, so its own (dragged) place is kept; back with NOW */
.swap.dodge { transition: left .3s, top .3s, transform .3s ease; }

<body>
<main>
  <div class="top">
    <div><div class="kicker">// LOGISTICS <i>·</i> DISTINCTION CERTIFICATE</div><h1>THE STORE NOW</h1></div>
    <div class="right"><div class="kicker" id="today"></div><a class="kicker" href="shoperators-cn.html" target="_blank" rel="noopener">CN SHOP ↗</a></div>
  </div>
  <div class="shelf" id="shelf"></div>
  <div id="banners"></div>
  <div class="cols">
    <div><div id="facts"></div><div class="kicker big">EN SHOP HISTORY</div><div class="hist" id="hist"></div></div>
    <div id="stats"><div class="find"><input id="find" placeholder="Find an operator: where they stand for the shop" autocomplete="off" aria-label="Find an operator"><div class="res" id="find-res" role="status"></div></div><div id="bars"></div></div>
  </div>
</main>
<div id="rpwin" aria-label="Shop history, replay"><div class="kicker">EN SHOP HISTORY <i>·</i> REPLAY</div><div class="hist"></div></div>
<div id="rp" role="status"><b>REPLAY</b><span id="rp-t"></span><button id="rp-now" type="button">NOW ✕</button></div>
<a class="swap" id="swap" href="shoperators-cn.html"><span class="st"><span class="cur">EN</span><span class="oth">CN</span></span></a>
<script>
const D = window.CERTS;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const day = s => new Date(s + 'T00:00:00Z');
const diff = (a, b) => Math.round((day(b) - day(a)) / 864e5);
const MONTH = s => `${MON[+s.slice(5, 7) - 1]} ${s.slice(0, 4)}`;
const plus = (s, n) => new Date(day(s).getTime() + n * 864e5).toISOString().slice(0, 10);
const days = n => n + (n === 1 ? ' DAY' : ' DAYS');
// dates as day + three-letter month (numbered months confuse Thai readers); the year only when not this year
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const md = s => `${+s.slice(8, 10)} ${MON[+s.slice(5, 7) - 1]}` + (s.slice(0, 4) !== D.as_of.slice(0, 4) ? ' ' + s.slice(0, 4) : '');
const AV = id => `https://lemonwait.github.io/operator/avatars/${id}.png`;
const rc = o => !o ? '' : o.limited ? 'rl' : o.stars === 6 ? 'r6' : o.stars === 5 ? 'r5' : '';
const sc = o => !o ? '' : o.limited ? 'sl' : o.stars === 6 ? 's6' : o.stars === 5 ? 's5' : '';
const img = (o, style = '') => o && o.avatar ? `<img class="av ${rc(o)}" src="${esc(o.avatar)}" alt="" title="${esc(o.en || o.name)}"${style ? ` style="${style}"` : ''}>` : '<span class="av"></span>';
const plate = (a, b) => `<span class="plate">${md(a)} <span class="to">▶▶</span> ${md(b)}</span>`;
const S = D.store_now.standard, K = D.store_now.kernel;
// live countdowns (author, 2026-10-19): days and hours from the reader's clock to the banner's exact wiki time (EN server, UTC-7)
const startAt = b => Date.parse(b.start_at || b.start + 'T04:00:00-07:00'), endAt = b => Date.parse(b.end_at || b.end + 'T03:59:59-07:00');
// "7d 4h" (author, 2026-10-30: "7D O4H? the format is failing me"): small units, no leading zero
const dh = ms => { const h = Math.floor(ms / 36e5); return `${Math.floor(h / 24)}d ${h % 24}h`; };
const clockAt = (s, e, t = Date.now()) => t < s ? `Starts in ${dh(s - t)}` : t <= e ? `${dh(e - t)} left` : 'Ended';
const clock = b => clockAt(startAt(b), endAt(b));
const cd = b => `class="g cd" data-s="${startAt(b)}" data-e="${endAt(b)}"`;
// an ended Locating goes (author, 2026-10-30): the build drops it, and the page drops it the minute it ends
let L = D.kernel_locating && Date.now() <= endAt(D.kernel_locating) ? D.kernel_locating : null;
// the reader's today; the day counts were baked on D.as_of, so they move on by the days since then
const TODAY = () => { const n = new Date(); return `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, '0')}-${String(n.getDate()).padStart(2, '0')}`; };
const LATE = Math.max(0, diff(D.as_of, TODAY()));
if (LATE) for (const k of ['standard6', 'kernel6', 'standard5', 'kernel5']) for (const x of ['', '_all', '_held'])
  for (const r of D.candidates[k + x] || []) { r.days_since_store += LATE; if (r.days_since_banner != null) r.days_since_banner += LATE; }
const pick = (b, s) => b.store.find(o => o.stars === s);
const kl6 = L ? L.operators.filter(o => o.stars === 6) : [], kl5 = L ? L.operators.filter(o => o.stars !== 6) : [];
const showToday = () => { const t = TODAY(); document.getElementById('today').textContent = `TODAY ${md(t)}${t.slice(0, 4) === D.as_of.slice(0, 4) ? ' ' + t.slice(0, 4) : ''}`; };
showToday();

/* the store now */
const product = (b, label) => { const p6 = pick(b, 6), p5 = pick(b, 5);
  return `<div class="product ${label === 'KERNEL' ? 'ker' : 'std'}">
  <div class="foot"><span>IN THE STORE</span><b>${md(b.start)} <span class="ar">▶▶</span> ${md(b.end)}</b></div><div class="tag"><span>${label} #${b.no}</span><span ${cd(b)}>${clock(b)}</span></div>
  <div class="pick"><div>${img(p6, 'width:132px;height:132px')}<div class="nm"><span class="${sc(p6)}">6★</span> ${esc(p6?.name)}</div></div>
  <div class="five">${img(p5, 'width:76px;height:76px')}<div class="nm"><span class="${sc(p5)}">5★</span> ${esc(p5?.name)}</div></div></div></div>`; };
document.getElementById('shelf').classList.toggle('two', !L);
document.getElementById('shelf').innerHTML = product(S, 'STANDARD') + product(K, 'KERNEL') + (!L ? '' :
  `<div class="product kl"><div class="foot"><span>LOCATING</span><b>${md(L.start)} <span class="ar">▶▶</span> ${md(L.end)}</b></div><div class="tag"><span>KERNEL LOCATING #${L.no}</span><span class="g"><b class="s6">×${kl6.length} 6★</b> · <b class="s5">×${kl5.length} 5★</b></span></div>
   <span class="soon cd" data-s="${startAt(L)}" data-e="${endAt(L)}">${clock(L)}</span>
   <div class="grid6">${kl6.map(o => img(o)).join('')}</div><div class="grid5">${kl5.map(o => img(o)).join('')}</div></div>`);
const purgeLocating = () => { if (L && Date.now() > endAt(L)) {
  L = null; document.querySelector('.product.kl')?.remove(); document.getElementById('shelf').classList.add('two'); } };

/* other banners now: a limited one as the two-halves box, the rest as one line */
const src = a => a.local ? '../' + a.src : a.src;
// where the left face goes: the same distance from the centre line as the right face (both crops have the eyes ~41%
// across). Pure maths from the box size and the crops' baked pixel sizes, so it is known before anything paints.
const EYE_X = .41, HALF = .54;
const leftPos = (boxW, boxH, la, ra) => {
  if (!la || !ra || !la.w || !ra.w) return 50;
  const halfW = boxW * HALF, mid = boxW / 2;
  const rdw = ra.w * boxH / ra.h, rover = Math.max(0, rdw - halfW);       // the right picture, centred in its half
  const rface = (boxW - halfW) - rover * .5 + (ra.ex || EYE_X) * rdw;
  const want = mid - (rface - mid);                                       // the mirror point for the left face
  const ldw = la.w * boxH / la.h, lover = Math.max(0, ldw - halfW);
  return lover ? Math.min(100, Math.max(0, ((la.ex || EYE_X) * ldw - want) / lover * 100)) : 50; };
const limH = () => matchMedia('(max-width: 900px)').matches ? 190 : 230;   // the box's height (CSS)
// a phone's own layout (author, 2026-11-12: "mobile should have its own char faces locations"): the box is too narrow
// to mirror the faces about the middle (both crowd the seam), so each face sits in the middle of its own half
const PHONE = () => matchMedia('(max-width: 900px)').matches;
const centred = (boxW, boxH, o) => { if (!o || !o.w) return 50;
  const halfW = boxW * HALF, dw = o.w * boxH / o.h, over = Math.max(0, dw - halfW);
  return over ? Math.min(100, Math.max(0, ((o.ex || EYE_X) * dw - halfW / 2) / over * 100)) : 50; };
const facePos = (boxW, boxH, la, ra) => PHONE() ? [centred(boxW, boxH, la), centred(boxW, boxH, ra)] : [leftPos(boxW, boxH, la, ra), 50];
const limBox = b => { const [a, c] = b.featured;
  const boxW = document.getElementById('banners').clientWidth, [pos, posB] = facePos(boxW, limH(), a.art, c.art);
  const half = (o, side) => `<div class="half ${side}">${o.art ? `<img src="${esc(src(o.art))}" alt="" data-w="${o.art.w || ''}" data-h="${o.art.h || ''}" data-ex="${o.art.ex || ''}"` +
    ` style="object-position:${(side === 'a' ? pos : posB).toFixed(1)}% 50%">` : img(o)}</div>`;
  const five = b.operators.filter(o => o.stars === 5);
  return `<div class="lim" title="${esc(b.name)}">${half(a, 'a')}${half(c, 'b')}<div class="shade"></div><div class="mid"></div>
    <div class="when">${plate(b.start, b.end)}<div class="tag"><span class="lt">LIMITED</span><span ${cd(b)}>${clock(b)}</span></div></div>
    <div class="nm a"><small class="${sc(a)}">${a.limited ? 'LIMITED ' : ''}RATE-UP 6★</small><br>${esc(a.name)}</div>
    <div class="nm b"><small class="${sc(c)}">${c.limited ? 'LIMITED ' : ''}RATE-UP 6★</small><br>${esc(c.name)}</div>
    <div class="rbar a ${rc(a)}"></div><div class="rbar b ${rc(c)}"></div>
    <div class="title">${esc((b.name || '').toUpperCase())}</div></div>
    ${blocks(b, a, c, five)}`; };
// spark shop, welfare and off-rate x5 come from FUTURE's shared banner facts (data/banners/banners.json, written by
// future/tools/export_banners.py), baked into each banner's `facts` by logistics/build_certs.py
const opRow = (o, note, cls = '') => `<div class="op${cls}">${img({...o, avatar: o.avatar || AV(o.id)})}<span>${esc(o.name)}${note ? `<small>${note}</small>` : ''}</span></div>`;
// the header's × and ★ are drawn, as tall as the capitals and centred on them (author, 2026-11-02: Oswald's sit low and its × is faint)
const SYM = {'×': '<path d="M1.5 1.5l7 7m0-7l-7 7" fill="none" stroke="currentColor" stroke-width="2.2"/>',
  '★': '<path d="M5 0l1.47 3.28 3.53.4-2.62 2.42.72 3.5L5 7.83 1.9 9.6l.72-3.5L0 3.68l3.53-.4z" fill="currentColor"/>'};
const sym = t => t.replace(/[×★]/g, c => `<svg class="sym" viewBox="0 0 10 10" aria-label="${c}">${SYM[c]}</svg>`);

  // ↑ ↓ step to the banner above / below in the window
  win.addEventListener('keydown', e => { const i = chips.findIndex(x => x.classList.contains('on')); const j = e.key === 'ArrowUp' ? i - 1 : e.key === 'ArrowDown' ? i + 1 : -1;
    if (i < 0 || !chips[j]) { if (e.key === 'Enter' && e.target.closest('.no.rp')) { e.target.classList.contains('on') ? end() : go(e.target.textContent.trim(), true); } return; }
    e.preventDefault(); go(chips[j].textContent.trim(), true); chips[j].focus({ preventScroll: true }); });
  addEventListener('resize', () => { if (win.classList.contains('on')) place(); });
  const end = () => { bars.classList.remove('replay'); bars.innerHTML = now; document.body.style.minHeight = '';
    rp.classList.remove('on'); win.classList.remove('on'); document.body.classList.remove('replaying'); hist.style.visibility = ''; sw.style.transform = '';
    document.querySelectorAll('.hist .no.on').forEach(x => x.classList.remove('on')); };
  document.getElementById('rp-now').addEventListener('click', end);
})();
</script>
</body>
</html>
