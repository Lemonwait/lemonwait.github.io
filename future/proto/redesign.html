<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FUTURE redesign (mock)</title>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<script src="redesign-data.js"></script>
<style>
/* MOCK for the FUTURE redesign (future/docs/PLAN.md, "Redesign"). The sheet is the content, the look is ours
   (docs/THEME.md; tokens shared with info/docs/DESIGN.md so the handbook reads as one site). Every text, name and
   picture comes from design/grid/FUTURE.json at load time; nothing is retyped. Three directions for the same
   two sections, switched in the top bar. Serve from the repo root (preview "future", port 8761):
   http://localhost:8761/future/proto/redesign.html
   The roadmap is a machine (function machine() below): ?now=YYYY-MM shows it on another month, ?skeleton its empty slots. */
:root {
  --bg: #121212; --panel: #202124; --panel-head: #121212; --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.18);
  --ink: #e6e8f0; --muted: #b7b7b7; --faint: #6a6d74; --ghost: #1b1c21; --accent: #ffe100; --accent-ink: #ffe100;
  --f-display: 'Oswald', sans-serif; --f-label: 'Bai Jamjuree', 'Sarabun', sans-serif;
  --f-thai: 'Sarabun', sans-serif; --f-name: 'Google Sans', 'Sarabun', sans-serif; --f-num: 'Bebas Neue', sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-thai); }
img { display: block; }
#bar { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center;
  padding: 8px 16px; background: #121212; border-bottom: 1px solid var(--line-2); font: 13px/1.3 'Google Sans', sans-serif; }
#bar b { color: var(--accent); }
#bar label { cursor: pointer; white-space: nowrap; }
#bar .note { color: var(--faint); font-size: 12px; }
main { max-width: 1440px; margin: 0 auto; padding: 0 16px 120px; }

/* ---------- section header (THEME: index + tag + big title + Thai line + ghost word) ---------- */
.sh { position: relative; padding: 64px 0 22px; margin-bottom: 28px; border-bottom: 1px solid var(--line); overflow: hidden; }
.sh .idx { font: 600 13px/1 var(--f-label); letter-spacing: .14em; color: var(--accent-ink); }
.sh .idx span { color: var(--ink); }
.sh h2 { margin: 10px 0 0; font: 600 clamp(40px, 5vw, 68px)/.95 var(--f-display); letter-spacing: -.02em; text-transform: uppercase; }
.sh .th { margin-top: 8px; color: var(--muted); font-size: clamp(15px, 1.4vw, 18px); max-width: 1000px; }
.sh .bar { width: 56px; height: 3px; background: var(--accent); margin-top: 14px; }
.sh .ghost { position: absolute; right: -8px; bottom: -28px; font: 600 160px/1 var(--f-display); color: var(--ghost);
  text-transform: uppercase; letter-spacing: -.04em; z-index: -1; white-space: nowrap; pointer-events: none; }
.sh { isolation: isolate; }
.ph { }   /* placeholder title (wording still the author's call); the pink dashed marker is off for the public page (author, 2026-10-12) */

/* ---------- shared pieces ---------- */
.yr { font: 600 13px/1 var(--f-label); letter-spacing: .2em; color: var(--muted); }
.pic { background: #202124; aspect-ratio: 1; width: 100%; object-fit: cover; }
.pic.missing { display: grid; place-items: center; color: var(--faint); font: 11px/1.2 var(--f-label); text-align: center; padding: 6px; }
.name { font: 500 13px/1.25 var(--f-name); margin-top: 6px; overflow-wrap: anywhere; }
.notes p { margin: 0; }
.verdict { display: inline-block; font: 700 14px/1 var(--f-thai); padding: 6px 10px; background: var(--tag, var(--acc)); color: var(--on); }
.tba { font: 600 40px/1 var(--f-display); color: var(--faint); letter-spacing: .02em; }
.lede { font-size: 14px; color: var(--muted); }

/* ================= A · CALENDAR RAIL ================= */
body.a .tl { display: grid; grid-template-columns: var(--cols); gap: 0 2px; position: relative; }
body.a .yrblock + .yrblock { margin-top: 18px; }
body.a .yrblock > .yr { border-top: 1px solid var(--line-2); padding: 6px 4px 8px; }
body.a .yrblock:first-of-type > .yr { border-color: var(--accent); color: var(--accent-ink); }
body.a .tl-years { display: grid; grid-template-columns: var(--cols); gap: 0 2px; margin-bottom: 6px; }
body.a .tl-years div { border-top: 1px solid var(--line-2); padding-top: 6px; }
body.a .tl-years div.y26 { border-color: var(--accent); }
body.a .mo { margin: 0 4px; border-top: 2px solid var(--line-2); padding-top: 8px; font: 700 28px/1 var(--f-num); color: var(--faint); letter-spacing: .04em; }
body.a .mo.has { color: var(--ink); border-color: var(--acc); }
body.a .mo small { font: 600 10px/1 var(--f-label); letter-spacing: .16em; color: var(--faint); margin-left: 6px; }
body.a .unit { grid-row: 2; margin: 14px 4px 0; background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--acc); display: flex; flex-direction: column; }
body.a .unit .when { display: none; }
body.a .unit .ops { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; padding: 10px 10px 0; }
body.a .unit .ttl { padding: 8px 10px 0; font: 600 12px/1.3 var(--f-label); letter-spacing: .06em; color: var(--acc-ink); text-transform: uppercase; }
body.a .unit .notes { padding: 8px 10px; font-size: 13px; color: var(--ink); flex: 1; }
body.a .unit .notes p + p { margin-top: 2px; }
body.a .unit .foot { padding: 0 10px 10px; }
body.a .unit.empty { background: transparent; border: 1px dashed var(--line-2); border-top: 3px solid var(--acc); align-items: center; justify-content: center; min-height: 160px; }
body.a .unit.empty .ttl { text-align: center; }

/* (A) */
/* ================= A · ONE SCREEN (author, 2026-10-10) =================
   The roadmap fits one screen: the section is exactly the window height under the bar. Notes are hidden and
   unfold on hover (or keyboard focus, or a tap on touch screens); no click needed. Cards keep their own height
   and the notes open under the card, into the free space the section keeps below the cards. */
body.fit section.road { min-height: calc(100svh - var(--bar-h, 37px));   /* grows rather than overlapping the next section when the window is too short */
  display: flex; flex-direction: column; }
body.fit section.road .sh { padding: 16px 0 10px; margin-bottom: 10px; }
body.fit section.road .sh h2 { font-size: clamp(28px, 3vw, 44px); display: inline-block; margin-right: 18px; }
body.fit section.road .sh .bar { margin-top: 8px; }
body.fit section.road .sh .ghost { font-size: 110px; bottom: -22px; }
body.fit section.road .tl { grid-template-rows: auto auto; }
body.fit .yrblock.later .unit .notes { top: auto; bottom: calc(100% - 3px); border-top: 1px solid var(--line-2); border-bottom: 3px solid var(--acc); transform: translateY(-6px); }
body.fit .unit { position: relative; min-height: 0; outline: none; align-self: start; }
body.fit .unit .ops { flex: 1; min-height: 0; align-content: start; }
body.fit .unit .ops .pic { max-height: 17svh; }
body.fit .unit .notes { position: absolute; left: -1px; top: calc(100% - 3px); z-index: 5; width: max(calc(100% + 2px), 300px);
  padding: 12px 14px; background: var(--panel-head); border: 1px solid var(--line-2); border-top: 3px solid var(--acc);
  font-size: 14px; line-height: 1.5; opacity: 0; visibility: hidden; transform: translateY(6px);
  transition: opacity .15s, transform .15s, visibility 0s .15s; pointer-events: none; }
body.fit .unit.edge-r .notes { left: auto; right: -1px; }
body.fit .unit .notes::before { content: attr(data-head); display: block; font: 600 11px/1.3 var(--f-label); letter-spacing: .12em;
  color: var(--acc-ink); text-transform: uppercase; margin-bottom: 6px; }
body.fit .unit:hover .notes {   /* hover only: a click opens the row's PRTS page instead (author, 2026-10-12) */
  opacity: 1; visibility: visible; transform: none; transition: opacity .15s, transform .15s; }
body.fit .unit { z-index: 0; transition: z-index 0s .16s; }   /* stay above the other rows until the notes have faded out (a number, so the delay applies) */
body.fit .unit:hover { border-color: var(--line-2); z-index: 4; transition: none; }
body.fit .unit[data-prts] { cursor: pointer; }
body.fit .unit.has-notes::after { content: ""; position: absolute; right: 6px; top: 6px; width: 6px; height: 6px;
  background: var(--acc); transform: rotate(45deg); opacity: .8; }   /* diamond = there is more on hover */
body.fit .unit .foot { padding-top: 8px; }
body.fit .unit { container-type: inline-size; }
body.fit .unit .ops { flex: 0 0 auto; }
body.fit .unit .name { font-size: clamp(10px, 15cqi, 13px); overflow-wrap: normal; word-break: keep-all; }
body.fit .unit .verdict { font-size: clamp(11px, 15cqi, 14px); padding: 4px 6px; line-height: 1.25; }
body.fit .unit.empty { justify-content: flex-start; padding-top: 18px; }

/* ================= D · HORIZONTAL BANNERS (author, 2026-10-10) =================
   Same calendar, one screen, 2026 above 2027; each banner is a landscape tile like the in-game banner: the
   operators' art across the tile, names over a dark fade, the verdict in the corner, notes on hover.
   Wide art: the author's 1600x381 crops in operator/banners where they exist; otherwise the square portrait,
   cropped to the tile. */
body.d .unit { padding: 0; border: 0; background: #121212; min-height: 0; }
body.d .unit::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--acc); z-index: 2; }
body.d .unit .ops { position: relative; aspect-ratio: calc(var(--n, 1) * 3) / 2; display: grid; grid-auto-flow: column;
  grid-auto-columns: 1fr; grid-template-rows: 100%; gap: 0; padding: 0; overflow: hidden; }
body.d .unit .op { position: relative; min-width: 0; height: 100%; overflow: hidden; }
body.d .unit .op + .op { border-left: 1px solid rgba(0,0,0,.6); }
body.d .unit .ops .pic { width: 100%; height: 100%; max-height: none; aspect-ratio: auto; object-fit: cover; object-position: 50% 22%; }
body.d .unit .ops .pic.wide { object-position: 50% 50%; }
body.d .unit .op::after { content: ""; position: absolute; inset: 45% 0 0; background: linear-gradient(transparent, rgba(0,0,0,.92)); }
body.d .unit .op .name { position: absolute; left: 10px; right: 6px; bottom: 6px; z-index: 1; margin: 0;
  font: 600 clamp(11px, 8cqi, 18px)/1 var(--f-display); letter-spacing: .02em; text-transform: uppercase; text-shadow: 0 1px 4px #000; }
body.d .unit .foot { padding: 6px 6px 6px 10px; background: var(--panel); }
body.d .unit .foot:empty { display: none; }
body.d .unit .verdict { font-size: clamp(11px, 9cqi, 13px); padding: 3px 6px; }
body.d .unit.has-notes::after { top: 8px; right: 8px; z-index: 3; }
body.d .unit.empty { background: repeating-linear-gradient(135deg, transparent 0 10px, rgba(255,255,255,.035) 10px 11px), #121212;
  border: 1px dashed var(--line-2); padding-top: 0; justify-content: flex-start; align-items: stretch; min-height: 0; }
body.d .unit.empty .ops { display: grid; place-items: center; grid-auto-flow: row; }
body.d .unit.empty .tba { font-size: clamp(20px, 14cqi, 34px); }
body.d .unit.empty .ttl { position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; padding: 0 6px; font-size: 10px; }
body.d .unit .when { display: none; }

/* ================= D · HORIZONTAL BANNERS, the author's sketch (2026-10-10) =================
   One full-width banner per row, stacked under its year, 2026 above 2027. TBA months share one row. Each row:
   month numeral | names + verdict | the operators' 6:1 strips (the X index banner, shorter), fading in from the
   left. Row height (--sh) is set by the script so every row fits one screen; notes still open on hover. */
.info { display: none; }
body.e .yrblock > .tl { display: flex; flex-wrap: wrap; gap: 6px; }
body.e .mo { display: none; }
body.e .unit { grid-column: auto !important; grid-row: auto !important; flex: 1 1 100%; margin: 0; height: var(--sh, 64px);
  display: grid; grid-template-columns: calc(var(--sh, 64px) * 1.3) minmax(0, 1fr) auto; align-items: center;
  padding: 0; border: 0; background: #121212; container-type: normal; }
body.e .unit::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--acc); z-index: 2; }
body.e .unit .when { display: block; grid-column: 1; grid-row: 1; padding-left: 14px; font: 700 calc(var(--sh, 64px) * .62)/1 var(--f-num); color: var(--ink); }
body.e .unit .when small { display: none; }
body.e .unit .info { display: flex; flex-direction: column; justify-content: center; align-items: flex-start; grid-column: 2; grid-row: 1; gap: calc(var(--sh, 64px) * .07); min-width: 0; padding-right: 12px; z-index: 1; }   /* verdict under the name (author) */
body.e .unit .info .nm { font: 600 clamp(15px, calc(var(--sh, 64px) * .34), 32px)/1 var(--f-display); text-transform: uppercase; letter-spacing: .01em; white-space: nowrap; }
body.e .unit .info .nm { text-shadow: 0 0 2px #000, 0 0 4px #000, 0 0 10px rgba(0,0,0,.95), 0 0 22px rgba(0,0,0,.75); }   /* darker halo so names hold over light art (author, 2026-10-12) */
body.e .unit .info .nm .plus { font-weight: inherit; margin: 0 6px; }
body.e .unit .info .nm .ltag { display: inline-grid; place-items: center; margin: 0 0 0 6px; vertical-align: top;
  width: 1.05em; height: 1.05em; font: 800 .62em/1 'Google Sans', sans-serif; color: #15161a; text-shadow: none;
  background: linear-gradient(135deg, #e7a3b0, #e6c79a, #d3da9f, #a6d4b1, #9cc4dc, #b2a9e0, #d3a3d5);
  box-shadow: 0 0 0 1.5px #000000, 0 1px 4px rgba(0,0,0,.6); }   /* scales with the name; dark edge holds on any art */
body.e .unit .info .vt { display: flex; gap: 6px; }   /* no Thai line box around the chip: the name gets room from the strip's top edge (author, 2026-10-12) */
body.e .unit .info .verdict { font-size: clamp(11px, calc(var(--sh, 64px) * .2), 14px); padding: 2px 7px; line-height: 1.3; text-shadow: none; }   /* solid chip, no shadow (author) */
body.e .unit .foot { display: none; }
body.e .unit:not(.empty) .ttl { display: none; }
/* art from the row's left edge, under the text (author, 2026-10-10: "chars start right from the absolute left
   of the banner, while we keep minimal shadow behind texts"); it fades out at its right end into the row */
body.e .unit .ops { position: absolute; left: 0; right: 0; top: 0; bottom: 0; z-index: 0; display: flex; height: 100%; padding: 0; gap: 0; overflow: hidden;
}
/* the art fades out at its own right end, wherever that falls in the row (short rows end before the row does) */
body.e .unit .op:last-child { -webkit-mask-image: linear-gradient(to left, transparent, #000 calc(var(--sh, 64px) * 1.6));
  mask-image: linear-gradient(to left, transparent, #000 calc(var(--sh, 64px) * 1.6)); }
body.e .unit .op + .op:last-child { -webkit-mask-image: linear-gradient(to right, transparent, #000 var(--sh, 64px), #000 calc(100% - var(--sh, 64px) * 1.6), transparent);
  mask-image: linear-gradient(to right, transparent, #000 var(--sh, 64px), #000 calc(100% - var(--sh, 64px) * 1.6), transparent); }
body.e .unit:not(.empty) { grid-template-columns: calc(var(--sh, 64px) * 1.06) minmax(0, 1fr); }
/* the month stands against the name, so one digit or two leave the same gap (author, 2026-10-12: "the problem with
   uneven width is the lone month number"); the names stay in one line */
body.e .unit:not(.empty):not(.evrow):not(.filler) .when { text-align: right; padding-left: 0; padding-right: calc(var(--sh, 64px) * .245); }   /* gap after the month 50% less (author, 2026-10-12): 0.49 -> 0.245 row-heights after "10" */
body.e .unit:not(.empty) .when, body.e .unit:not(.empty) .info { position: relative; z-index: 1;
  text-shadow: 0 0 3px #000, 0 0 10px rgba(0,0,0,.85), 0 0 22px rgba(0,0,0,.55); }
/* width cap per operator, then the row is shared evenly (author, 2026-10-10): a pair's two get half the row
   each (plus the cross-fade overlap) but never more than their 11:1 crop; a solo gets the row, at most 21:1.
   When the box is narrower than the crop, it keeps the face point (0.68 across a pair crop, 1/3 across a solo). */
body.e .unit .op { flex: 0 0 auto; width: min(calc(var(--sh, 64px) * 11), calc(50% + var(--sh, 64px) / 2)); height: 100%; position: relative; }
body.e .unit .op .pic { object-position: 68% 50%; }
body.e .unit.solo .op { width: min(calc(var(--sh, 64px) * 21), 100%); }
body.e .unit.solo .op .pic { object-position: 33.3% 50%; }
/* pairs cross-fade over one strip-height (author, 2026-10-10: "fading joint"); a solo row is as wide as a pair,
   the character on the left (its 11:1 crop puts the face where the first of a pair sits) */
body.e .unit .op + .op { margin-left: calc(var(--sh, 64px) * -1); }
body.e .unit .op.gapl:not(:last-child) { -webkit-mask-image: linear-gradient(to right, transparent, #000 calc(var(--sh, 64px) * 1.2));
  mask-image: linear-gradient(to right, transparent, #000 calc(var(--sh, 64px) * 1.2)); }
body.e .unit .op.gapl:last-child { -webkit-mask-image: linear-gradient(to right, transparent, #000 calc(var(--sh, 64px) * 1.2), #000 calc(100% - var(--sh, 64px) * 1.6), transparent);
  mask-image: linear-gradient(to right, transparent, #000 calc(var(--sh, 64px) * 1.2), #000 calc(100% - var(--sh, 64px) * 1.6), transparent); }
body.e .unit .op .pic { width: 100%; height: 100%; max-height: none; aspect-ratio: auto; object-fit: cover; }
/* a row whose art starts right of its edge (Angelina2) fills the gap with a blurred copy of the same art
   (author, 2026-10-11: option C); the sharp art still fades in over it */
body.e .unit .ops .gapfill { position: absolute; left: 0; top: 0; bottom: 0; z-index: -1; pointer-events: none;
  background: var(--fill) left center / auto 160% no-repeat; filter: blur(14px) brightness(.55) saturate(1.1); transform: scale(1.15); transform-origin: left center;
  -webkit-mask-image: linear-gradient(to right, #000 60%, transparent); mask-image: linear-gradient(to right, #000 60%, transparent); }
body.e .unit .op .name { display: none; }
body.e .unit .skinops { position: absolute; right: 22px; top: 0; bottom: 0; z-index: 1; display: flex; align-items: center; gap: 4px; }
body.e .unit .skinops img { height: calc(var(--sh, 64px) * .78); aspect-ratio: 1; filter: drop-shadow(0 0 2px #000) drop-shadow(0 0 6px rgba(0,0,0,.85)); }
/* ?skeleton: the slots with nothing in them (author, 2026-10-30: "i want to see our skeletons"): every art box's real size and the face column */
body.skel .unit img, body.skel .gapfill { opacity: 0 !important; }
body.skel .unit .op { background: rgba(255,255,255,.1); outline: 1px dashed rgba(255,255,255,.45); outline-offset: -1px; -webkit-mask-image: none !important; mask-image: none !important; }
body.skel .unit .op::after { content: attr(data-w); position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font: 11px/1 var(--f-label); color: #b7b7b7; }
body.skel .unit.evrow { background: rgba(255,255,255,.1); outline: 1px dashed rgba(255,255,255,.45); outline-offset: -1px; }
body.skel .unit:not(.empty):not(.evrow) .ops::after { content: ""; position: absolute; top: 0; bottom: 0; left: var(--face-x); width: 1px; background: #18d1ff; z-index: 2; }
body.e .unit.has-notes::after { top: 8px; right: 8px; z-index: 3; }
body.e .unit .notes { left: calc(var(--sh, 64px) * 1.3); width: min(520px, 60%); }
body.e .unit.edge-r .notes { left: calc(var(--sh, 64px) * 1.3); right: auto; }
body.e .unit.evrow .notes { left: -1px; width: calc(100% + 2px); }   /* at least the event row's width (author, 2026-10-12) */
.notes .welf { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
.notes .welf img { width: 48px; height: 48px; flex: none; background: #313236; border: 1px solid var(--line-2); }
.notes .welf b { display: block; font-weight: 700; color: #fff; }
body.e .unit.up .notes { top: auto; bottom: calc(100% - 3px); border-top: 1px solid var(--line-2); border-bottom: 3px solid var(--acc); }
body.e .unit:not(.up) .notes { top: calc(100% - 3px); bottom: auto; border-top: 3px solid var(--acc); border-bottom: 1px solid var(--line-2); }
body.e .unit.empty { flex: 1 1 0; min-width: 0; min-height: 0; grid-template-columns: auto auto minmax(0, 1fr); gap: 8px; border: 1px dashed var(--line-2);
  background: repeating-linear-gradient(135deg, transparent 0 10px, rgba(255,255,255,.035) 10px 11px), #121212; }
body.e .unit.empty .when { font-size: calc(var(--sh, 64px) * .45); padding-left: 12px; }
body.e .unit.empty { grid-template-rows: minmax(0, 1fr); }   /* one full-height row: a 3-line title no longer pushes the month down (author, 2026-10-12) */
body.e .unit.empty .ops { position: static; grid-column: 2; grid-row: 1; -webkit-mask-image: none; mask-image: none; align-items: center; }
body.e .unit.empty .tba { font-size: calc(var(--sh, 64px) * .32); }
body.e .unit.empty .ttl { grid-column: 3; grid-row: 1; align-self: center; padding: 0 6px 0 0; font-size: 10px; text-align: left; line-height: 1.2; }
body.e .yrblock + .yrblock { margin-top: 12px; }
body.e section.road .sh { padding: 10px 0 8px; margin-bottom: 6px; }

/* ================= B · OPERATION LOG ================= */
body.b .unit, body.c .unit { grid-column: auto !important; grid-row: auto !important; }
body.b .tl-years { display: none; }
body.b .tl { display: flex; flex-direction: column; gap: 0; border-top: 1px solid var(--line-2); }
body.b .mo { display: none; }
body.b .unit { display: grid; grid-template-columns: 120px 260px minmax(0, 1fr) 180px; gap: 24px; align-items: center;
  padding: 18px 0; border-bottom: 1px solid var(--line); position: relative; }
body.b .unit::before { content: ""; position: absolute; left: 0; top: 18px; bottom: 18px; width: 3px; background: var(--acc); }
body.b .unit .when { padding-left: 18px; font: 700 64px/.9 var(--f-num); color: var(--ink); }
body.b .unit .when small { display: block; font: 600 11px/1 var(--f-label); letter-spacing: .2em; color: var(--muted); margin-top: 6px; }
body.b .unit .ops { display: grid; grid-auto-flow: column; grid-auto-columns: 120px; gap: 10px; }
body.b .unit .ttl { display: none; }
body.b .unit .notes { font-size: 15px; }
body.b .unit .notes p::before { content: "▪ "; color: var(--acc-ink); }
body.b .unit .foot { text-align: right; }

  const idx = el('div', 'idx'); idx.innerHTML = `<span>${String(n).padStart(2, '0')}</span> // ${String(total).padStart(2, '0')} &nbsp;#FUTURE`;
  const t = el('h2', p.sheet ? '' : 'ph', p.title);
  h.append(idx, t);
  if (thai) h.append(el('div', 'th', thai));
  h.append(el('div', 'bar'), el('div', 'ghost', p.ghost));
  return h;
}

// ---------- TIMELINE (sheet rows 2-12) ----------
function timeline() {
  const sec = el('section', 'road'), h = header(1, 6, 'timeline'); sec.append(h);
  // what the strips' colours mean (author, 2026-10-12), beside the yellow bar; limited banners keep the sheet's own colour each
  const key = el('div', 'rkey');
  // each label in its own colour (author, 2026-10-12): limited in the soft rainbow, collab in the tags' pink
  [[['#cc0000', '#317cbf', '#d76300'], 'Limited', 'lim'], [['#f25aa5'], 'Collab', 'col'], [['#fbbc04'], 'Standard', 'std'], [['#8a8d96'], 'Seasonal gamemode', 'ev']].forEach(([cs, t, c]) => {
    const k = el('span', 'k ' + c); cs.forEach(c => { const b = el('i'); b.style.background = c; k.append(b); }); k.append(el('span', '', t)); key.append(k);
  });
  h.append(key);
  const months = byRow[3].filter(c => c.ci >= 2);
  const years = byRow[2];
  const monthOf = ci => months.findIndex(m => ci >= m.ci && ci < m.ci + m.cs);
  // units: row-5 runs of the same fill (one banner can hold two operators), plus row-4 TBA cells with nothing in row 5
  const units = [];
  for (const c of byRow[4]) {
    const n5 = byRow[5].find(x => c.ci >= x.ci && c.ci < x.ci + x.cs);
    const bg = st(n5 || c).bg, mo = monthOf(c.ci), last = units.at(-1);
    const shared = last && [6,7,8,9,10,11,12].some(r => (byRow[r] || []).some(x => x.ci === last.start && x.ci + x.cs > c.ci));
    if (last && last.mo === mo && last.bg === bg && c.ci === last.end && shared) { last.cells.push(c); if (n5 && !last.n5s.includes(n5)) last.n5s.push(n5); last.end = c.ci + c.cs; continue; }
    units.push({ cells: [c], n5s: n5 ? [n5] : [], bg, mo, start: c.ci, end: c.ci + c.cs });
  }
  // one row per year, earliest on top (author, 2026-10-10: "2026 on top of 2027"). Both rows use the same
  // column scale (the widest year), so a month is as wide in either row as in the sheet.
  const W = Math.max(...years.map(y => y.cs));
  const rows = [...years].sort((p, q) => +p.text - +q.text).map((y, i) => {
    const blk = el('div', 'yrblock' + (i ? ' later' : '')), tl = el('div', 'tl');
    tl.style.setProperty('--cols', `repeat(${W}, minmax(0, 1fr))`);
    months.filter(m => m.ci >= y.ci && m.ci < y.ci + y.cs).forEach(m => {
      const d = el('div', 'mo', m.text); d.style.gridColumn = `${m.ci - y.ci + 1} / span ${m.cs}`; d.style.gridRow = 1; d.dataset.mi = months.indexOf(m); tl.append(d);
    });
    blk.append(el('div', 'yr', y.text), tl); sec.append(blk);
    return { y, tl };
  });
  for (const u of units) {
    const span = [u.start, Math.max(u.end, ...u.n5s.map(x => x.ci + x.cs))];
    const { y: yr, tl } = rows.find(r => span[0] >= r.y.ci && span[0] < r.y.ci + r.y.cs);
    const C0 = yr.ci, CN = yr.ci + W, colOf = ci => ci - C0 + 1;
    const node = el('article', 'unit'); setAcc(node, u.bg);
    const m0 = monthOf(span[0]), m1 = monthOf(span[1] - 1);
    node.style.gridColumn = `${colOf(span[0])} / ${colOf(span[1])}`;
    tl.querySelectorAll('.mo').forEach(mo => { const i = +mo.dataset.mi; if (i >= m0 && i <= m1) { mo.classList.add('has'); setAcc(mo, u.bg); } });
    const year = years.find(y => span[0] >= y.ci && span[0] < y.ci + y.cs);
    const when = el('div', 'when', months[m0].text + (m1 > m0 ? '–' + months[m1].text : '')); when.append(el('small', '', year ? year.text : ''));
    node.append(when);
    node.dataset.ym = [m0, m1].map(i => `${year ? year.text : ''}-${String(months[i].text).padStart(2, '0')}`).join(' ');
    const ops = el('div', 'ops');
    const isTba = u.cells.every(c => c.text === 'TBA');
    if (isTba) {
      node.classList.add('empty');
      ops.append(el('div', 'tba', 'TBA'));
    } else {
      for (const c of u.cells) {
        const n5 = byRow[5].find(x => x.ci === c.ci && x.cs <= 5);
        const im = pic(c, n5 && n5.text);
        if (n5 && ART[n5.text] && im.tagName === 'IMG') { im.dataset.sq = im.src; im.dataset.tile = `../img/tiles/${ART[n5.text]}.webp`; { const f = `${ART[n5.text]}_${u.cells.length === 1 ? 'solo' : 'pair'}.webp`, m = META[f];
          im.dataset.strip = `../img/strips/${f}` + (m ? `?v=${m.ratio}-${m.fx}` : ''); } }
        const op = el('div', 'op'); op.append(im, el('div', 'name', n5 ? n5.text : '')); ops.append(op);
      }
    }
    if (u.cells.length === 1 && !isTba) node.classList.add('solo');
    node.append(ops); node.style.setProperty('--n', (span[1] - span[0]) / 5);  // one 3:2 share per 5 sheet columns (one month)
    // a row-5 cell wider than the pictures is a banner title (W5 "CN's 2027 Half Anniversary")
    const ttl = u.n5s.find(x => x.cs > 5);
    // "CN's 2027 Half Anniversary" reads "CN 2027 X.5" (author, 2026-10-12): Global's April gets CN's X.5 from the
    // November before, X = the year - 2020 (CN opened May 2019; 6.5 came to Global in April 2026)
    if (ttl) node.append(el('div', 'ttl', ttl.text.replace(/^CN's (\d{4}) Half Anniversary$/i, (_, y) => `CN ${y} ${y - 2020}.5`)));
    const notes = el('div', 'notes');
    const hasVerdict = (byRow[12] || []).some(c => c.text && c.ci >= span[0] && c.ci < span[1]);
    let liftedVerdict = '';
    for (let r = 6; r <= 11; r++) for (const c of (byRow[r] || [])) if (c.ci >= span[0] && c.ci < span[1]) lines(c.text).forEach(l => {
      // all collab banners show their guarantee as a tag (author, 2026-10-11: Makoto's sits in his notes)
      if (!hasVerdict && !liftedVerdict && /^การันตีใน\s*\d+/.test(l)) { liftedVerdict = l; return; }
      notes.append(el('p', '', l));
    });
    if (isTba && notes.childElementCount) { node.append(el('div', 'ttl', notes.textContent)); }
    else if (notes.childElementCount) {
      notes.dataset.head = u.cells.map(c => (byRow[5].find(x => x.ci === c.ci && x.cs <= 5) || {}).text).filter(Boolean).join(' + ');
      node.append(notes); node.classList.add('has-notes');
      if (span[0] - C0 > (CN - C0) * 0.6) node.classList.add('edge-r');
    }
    const foot = el('div', 'foot');
    for (const c of (byRow[12] || [])) if (c.text && c.ci >= span[0] && c.ci < span[1]) foot.append(el('span', 'verdict', lines(c.text).join(' · ')));
    if (liftedVerdict) foot.append(el('span', 'verdict', liftedVerdict));
    node.append(foot);
    const info = el('div', 'info');
    if (!isTba) {
      // a mini rainbow tag after a limited operator's name (author, 2026-10-11): limited = a limited banner's hero
      // in the sheet (row 45 under the LIMITED cards: Angelina2, Kal'tsit2 ...)
      const limitedNames = new Set((byRow[45] || []).map(c => c.text).filter(Boolean));
      const nm = el('div', 'nm');
      u.cells.map(c => (byRow[5].find(x => x.ci === c.ci && x.cs <= 5) || {}).text).filter(Boolean).forEach((n, i) => {
        if (i) nm.append(el('b', 'plus', '&'));   // even room either side; & instead of + (author, 2026-10-12)
        nm.append(el('span', '', n));
        if (limitedNames.has(n)) nm.append(el('span', 'ltag', 'L'));   // author, 2026-10-11: "just L tag is fine"
      });
      info.append(nm);
    }
    const vt = el('div', 'vt'); foot.querySelectorAll('.verdict').forEach(v => vt.append(v.cloneNode(true)));
    if (vt.childElementCount) info.append(vt);
    node.append(info);
    tl.append(node);
  }
  events(sec);
  return sec;
}

// ---------- EVENTS ON THE ROADMAP (author, 2026-10-11: the sheet's side panel BU14-BZ33 moved here) ----------
// "Each entry one event": every side-panel item gets its own row, placed by date among the banner rows (a banner
// row counts from the 1st of its first month; TBA stays last). The date comes from future/data/schedule.json
// (check_schedule.py): CN start from PRTS + 5 months, or the real Global date once announced; a past or CN-only
// event has no row. The row's art is the sheet's own picture(s); the hover note says where the date comes from.
const SIDE = [
  { title: 'BU14', art: 'BU16', prts: '危机合约/涤墨作战', fy: '50%', cy: '63%' },
  { title: 'BU21', strip: '../img/strips/event_mlp.webp', full: '../img/src/kv_mlp.webp', prts: '魔法与友谊', fy: '21%', cy: '28%', skin: true },   // the event splash, main faces (author, 2026-10-11; build_event_art.py)
];
const MON = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
function events(sec) {
  const at = ref => G.cells.find(c => c.ref === ref);
  for (const s of SIDE) {
    const ev = SCHED.events.find(e => e.prts === s.prts);
    if (!ev) { console.warn(`schedule.json has no "${s.prts}": run future/tools/check_schedule.py`); continue; }
    if (ev.status === 'past' || ev.status === 'cn-only') continue;
    const [y, m, d] = ev.en.split('-');
    const blk = [...sec.querySelectorAll('.yrblock')].find(b => b.querySelector('.yr').textContent.trim() === y);
    if (!blk) { console.warn(`no ${y} row block for ${s.prts}`); continue; }
    const tl = blk.querySelector('.tl'), t = at(s.title);
    const node = el('article', 'unit evrow has-notes filler' + (s.skin ? ' skin' : '')); node.dataset.ym = `${y}-${m} ${y}-${m}`;
    if (s.skin) setAcc(node, '#ffd4e9');   // skin collabs: the collab pink (author, 2026-10-12)
    else { node.style.setProperty('--acc', '#8a8d96'); node.style.setProperty('--acc-ink', '#c9ccd4'); }
    const when = el('div', 'when', String(+m)); node.append(when);
    const ops = el('div', 'ops'), art = el('div', 'evart' + (s.strip ? ' strip' : ''));
    if (s.art) { const i = pic(at(s.art), t.text); i.loading = 'eager'; art.append(i); }
    if (s.strip) { const i = el('img', 'pic'); i.src = s.strip + '?v=' + Date.now(); i.alt = t.text; art.append(i); }   // mock: never a stale crop
    // fill switches (author, 2026-10-11: "ccb#5 and mlp dont fill"): A = the whole picture blurred behind the sharp
    // face band, B = the sharp picture across the row at the eyes' height (a face lower than the others drops out)
    const full = s.full || (art.querySelector('img') || {}).src;
    if (full) {
      const bg = el('div', 'evbg'); bg.style.setProperty('--bgimg', `url("${full}")`); bg.style.setProperty('--fy', s.fy); ops.prepend(bg);
      const w = el('img', 'pic evwide'); w.src = full; w.alt = ''; w.style.objectPosition = `50% ${s.fy}`; w.style.setProperty('--cy', s.cy || '50%'); ops.append(w);   // cy: the cell's height focus from the skin-colour count (trial)
    }
    ops.append(art); node.append(ops);
    const info = el('div', 'info'), nm = el('div', 'nm');
    nm.append(el('span', '', t.text));
    if (t.href) { const a = goArrow('a'); a.href = direct(t.href); a.target = '_blank'; a.rel = 'noopener'; a.title = 'video'; nm.append(a); }
    const est = ev.status === 'estimated';
    const vt = el('div', 'vt'); vt.append(el('span', 'verdict evtag', `${(ev.type || '').includes('crossover') ? 'COLLAB' : 'EVENT'} · ${est ? '~' : ''}${+d} ${MON[+m - 1]}`));
    info.append(nm, vt); node.append(info);
    const notes = el('div', 'notes'); notes.dataset.head = ev.cn_name;
    notes.append(el('p', '', `CN ${ev.cnstart}${ev.cnend ? ' – ' + ev.cnend : ''}`),
      el('p', '', est ? `Global ~${ev.en}: CN + 5 months (estimate)` : `Global ${ev.en}${ev.globalend ? ' – ' + ev.globalend : ''}${ev.status === 'ongoing' ? ' · now on' : ''}`));
    const kr = KAY.rows.find(x => x.kind === 'event' && x.cn_title.includes(s.prts.split('/').pop()));
    if (kr && kr.prts) node.dataset.prts = kr.prts;
    if (kr && kr.facts && kr.facts.skins) notes.append(el('p', '', `skins: ${kr.facts.skins.join(', ')} (Kay-chan read the notice)`));
    else if (kr && (kr.flags || []).some(f => f.startsWith('skins:'))) notes.append(el('p', '', 'skins: waiting for the announcement'));
    node.append(notes);
    // by date: before the first row that starts later (banner rows from the 1st of their month); TBA stays last
    const next = [...tl.querySelectorAll(':scope > .unit')].find(u => u.classList.contains('empty') || u.dataset.ym.split(' ')[0] + (u.classList.contains('evrow') ? '-' + u.dataset.d : '-01') > ev.en);
    node.dataset.d = d; node.dataset.cn = ev.cnstart;
    tl.insertBefore(node, next || null);
  }
  machine(sec);
  rerunEvents(sec);
  kayPatch(sec);
  rotate(sec);
  cnOrder(sec);
  groupFillers(sec);
  linkPrts(sec);
  welfareNotes(sec);
}

// A click on a roadmap row opens its PRTS page in a new tab (author, 2026-10-12: "make click on cn content in the
// roadmap directed to its announcement page on prts"): an event's official announcement page, a banner's PRTS
// banner page. Rows from the sheet take the page from Kay-chan's row with the same operators.
function linkPrts(sec) {
  const byOps = new Map(KAY.rows.filter(r => r.ops && r.ops.length && r.prts).map(r => [r.ops.map(o => o.name.toLowerCase().replace(/\?$/, '')).sort().join('+'), r.prts]));
  sec.querySelectorAll('.unit:not(.empty)').forEach(u => {
    if (!u.dataset.prts) {
      const names = [...u.querySelectorAll('.nm > span:not(.ltag)')].map(s => s.textContent.trim().toLowerCase());
      const key = names.join('  +  ').split(/\s+[+&]\s+/).map(x => x.trim()).filter(Boolean).sort().join('+');
      const hit = byOps.get(key) || [...byOps].find(([k]) => names.some(n => k.split('+').includes(n)))?.[1];
      if (hit) u.dataset.prts = hit;
    }
    if (!u.dataset.prts) return;
    u.title = 'Open on PRTS';
    u.addEventListener('click', e => {
      if (e.target.closest('a')) return;   // its own links (the MLP video) keep working
      window.open('https://prts.wiki/w/' + encodeURIComponent(u.dataset.prts).replace(/%2F/g, '/'), '_blank', 'noopener');
    });
  });
}

// Fillers indented under the main rows (author, 2026-10-12: "indent fillers except new banners and op collabs;
// skin collabs gain the same pink but indent too; a button that fold fillers"). Main rows = new-operator banners and
// operator collabs; fillers = reruns, game modes, CC, skin collabs. Consecutive fillers share one indented block.
// a switch keeps one width whichever label it shows (author, 2026-10-13: "boxes shouldn't resize when its text
// change"): both labels sit in one grid cell, the unused one invisible
function twoState(btn, off, on, isOn) {
  if (!btn.querySelector('.lbl')) btn.append(el('span', 'lbl off', off), el('span', 'lbl on', on));
  btn.querySelector('.lbl.off').style.visibility = isOn ? 'hidden' : 'visible';
  btn.querySelector('.lbl.on').style.visibility = isOn ? 'visible' : 'hidden';
}
function groupFillers(sec) {
  sec.querySelectorAll('.yrblock > .tl').forEach(tl => {
    let grp = null;
    for (const u of [...tl.children]) {
      if (u.classList.contains('filler')) {
        if (!grp) { grp = el('div', 'fillers'); tl.insertBefore(grp, u); }
        grp.append(u);
      } else grp = null;
    }
  });
  const btn = el('button', 'foldbtn');
  const set = folded => {
    document.body.classList.toggle('fold-fillers', folded);
    twoState(btn, 'Fold events & reruns', 'Show events & reruns', folded);
    btn.setAttribute('aria-pressed', String(folded));
    try { localStorage.setItem('future-fold-fillers', folded ? '1' : '0'); } catch (e) {}
    if (window.roadFit) requestAnimationFrame(window.roadFit);
  };
  let start = false;
  try { start = localStorage.getItem('future-fold-fillers') === '1'; } catch (e) {}
  btn.onclick = () => set(!document.body.classList.contains('fold-fillers'));
  const box = el('div', 'shbtns'); box.append(btn); const y0 = sec.querySelector('.yrblock'); y0.insertBefore(box, y0.firstChild);
  set(start);
}

// ---------- THE MACHINE (author, 2026-10-30: "juice machine where old banners gets auto rotate out and new ones auto
// in", "Build the mock") ----------
// Twelve months from today, generated at load. A banner comes from Kay-chan's rows; the sheet's row with the same
// operator lays its art, verdict and notes over it, wherever it lands. The sheet's month wins over her estimate (the
// difference shows on hover); a confirmed Global date wins over the sheet. A month past the last row is TBA.
const NOW = (() => { const q = new URLSearchParams(location.search).get('now'); const d = q ? new Date(q + '-15') : new Date(); return d.getFullYear() * 12 + d.getMonth(); })();
const monthIndex = ym => { const [y, m] = ym.split('-'); return +y * 12 + +m - 1; };
const monthName = i => { const n = MON[i % 12]; return `${n[0]}${n.slice(1).toLowerCase()} ${Math.floor(i / 12)}`; };
const dayName = s => { const [y, m, d] = s.split('-'); return `${+d} ${monthName(monthIndex(y + '-' + m))}`; };
const cleanName = n => n.toLowerCase().replace(/\?$/, '');
const unitNames = u => [...u.querySelectorAll('.nm > span:not(.ltag)')].map(s => cleanName(s.textContent.trim()));
const TONE = { celebration: '#cc0000', summer: '#317cbf', sui: '#d76300', collab: '#ffd4e9', standard: '#f5f5f5' };
function yearLine(sec, y) {
  const blocks = [...sec.querySelectorAll('.yrblock')];
  let blk = blocks.find(b => b.querySelector('.yr').textContent.trim() === y);
  if (!blk) {
    blk = el('div', 'yrblock later'); const tl = el('div', 'tl');
    tl.style.setProperty('--cols', blocks[0].querySelector('.tl').style.getPropertyValue('--cols'));
    blk.append(el('div', 'yr', y), tl);
    sec.insertBefore(blk, blocks.find(b => b.querySelector('.yr').textContent.trim() > y) || null);
  }
  return blk.querySelector('.tl');
}
function placeRow(sec, node, en) {
  const tl = yearLine(sec, en.slice(0, 4));
  const next = [...tl.querySelectorAll(':scope > .unit')].find(u => u.classList.contains('empty') || u.dataset.ym.split(' ')[0] + (u.classList.contains('evrow') ? '-' + u.dataset.d : '-01') > en);
  tl.insertBefore(node, next || null);
}
function noteOn(u, text) {
  let notes = u.querySelector(':scope > .notes');
  if (!notes) { notes = el('div', 'notes'); notes.dataset.head = unitNames(u).join(' + '); u.insertBefore(notes, u.querySelector(':scope > .foot')); u.classList.add('has-notes'); }
  notes.append(el('p', '', text));
}
function newBanner(r) {
  const [y, m, d] = r.en.split('-'), bare = r.pic_file && !r.ops.some(o => o.art);
  const node = el('article', 'unit has-notes kay' + (r.ops.length === 1 || bare ? ' solo' : '') + (bare ? ' bare' : '')); setAcc(node, TONE[r.tone] || '#f5f5f5');
  const when = el('div', 'when', String(+m)); when.append(el('small', '', y)); node.append(when);
  const ops = el('div', 'ops');
  if (bare) {   // no operator art yet: the banner's (or its event's) picture, one wide tile
    const op = el('div', 'op'), i = el('img', 'pic wide'); i.src = `../img/auto/${r.pic_file}`; i.alt = r.ops.map(o => o.name).join(' & '); if (r.pic_fy) i.style.objectPosition = `50% ${r.pic_fy}`; op.append(i); ops.append(op);
  } else for (const o of r.ops) {
    const op = el('div', 'op');
    if (o.art) { const i = el('img', 'pic wide'); const mm = META[o.art]; i.src = `../img/auto/${o.art}` + (mm ? `?v=${mm.ratio}-${mm.fx}` : ''); i.alt = o.name; op.append(i); }
    op.append(el('div', 'name', o.name)); ops.append(op);
  }
  node.append(ops); node.style.setProperty('--n', r.ops.length);
  const info = el('div', 'info'), nm = el('div', 'nm');
  r.ops.forEach((o, i) => { if (i) nm.append(el('b', 'plus', '&')); nm.append(el('span', '', o.name)); if (o.limited_tag) nm.append(el('span', 'ltag', 'L')); });
  info.append(nm);
  if (r.tags.length) { const vt = el('div', 'vt'); r.tags.forEach(t => vt.append(el('span', 'verdict', t))); info.append(vt); }
  node.append(info);
  const notes = el('div', 'notes'); notes.dataset.head = r.ops.map(o => o.name).join(' + ') + ' · added by Kay-chan';
  notes.append(el('p', '', `CN ${dayName(r.cn_start)} ${r.cn_title} → Global ${r.how === 'confirmed' ? '' : '~'}${dayName(r.en)}`));
  if (r.facts && r.facts.days) notes.append(el('p', '', `runs ${r.facts.days} days`));
  r.flags.forEach(f => notes.append(el('p', '', f)));
  node.append(notes);
  node.dataset.ym = `${y}-${m} ${y}-${m}`; node.dataset.d = d; node.dataset.cn = r.cn_start; if (r.prts) node.dataset.prts = r.prts;
  return node;
}
function tbaCell(i, label) {

  const node = el('article', 'unit empty');
  setAcc(node, /sui/i.test(label) ? '#d76300' : /summer/i.test(label) ? '#317cbf' : /CN/.test(label) ? '#cc0000' : '#f5f5f5');

  if (label) node.append(el('div', 'ttl', label));
  node.style.setProperty('--n', 1); node.dataset.ym = `${y}-${m} ${y}-${m}`;
  node.append(el('div', 'foot'), el('div', 'info'));
  return node;
}
function machine(sec) {
  sec.querySelectorAll('.unit.empty').forEach(u => u.remove());   // the sheet's TBA cells: the window below makes its own
  const used = new Set();
  sec.querySelectorAll('.unit:not(.evrow)').forEach(u => {
    const names = unitNames(u), r = KAY.rows.find(k => k.ops && k.ops.some(o => names.includes(cleanName(o.name))));
    if (!r) return;
    used.add(r);
    const was = monthIndex(u.dataset.ym.split(' ')[0]), is = monthIndex(r.en);
    if (was === is) return;
    if (r.how === 'confirmed') {   // a confirmed date beats the sheet, the row and its notes move
      const [y, m] = r.en.split('-'), when = u.querySelector('.when');
      when.firstChild.textContent = String(+m); when.querySelector('small').textContent = y;
      u.dataset.ym = `${y}-${m} ${y}-${m}`;
      noteOn(u, `Global confirmed ${dayName(r.en)}; the sheet says ${monthName(was)}`);
      placeRow(sec, u, r.en);
    } else noteOn(u, `Kay-chan's estimate: ${monthName(is)}; the sheet's month stays`);
  });
  for (const r of KAY.rows) {
    if (r.kind === 'event' || used.has(r) || (r.kind === 'standard' && /复刻/.test(r.cn_title))) continue;
    placeRow(sec, newBanner(r), r.en);
  }
  const rowMonths = [...sec.querySelectorAll('.unit')].map(u => monthIndex(u.dataset.ym.split(' ')[1]));
  const last = Math.max(NOW - 1, ...rowMonths, ...KAY.rows.map(r => monthIndex(r.en)));
  for (let i = last + 1; i < NOW + 12; i++) {
    const ym = `${Math.floor(i / 12)}-${String(i % 12 + 1).padStart(2, '0')}`, t = (KAY.tba || []).find(x => x.month === ym);
    yearLine(sec, ym.slice(0, 4)).append(tbaCell(i, t ? t.label : ''));
  }
}
// old out, too far ahead out: a row leaves on the 1st of the month after it ends
function rotate(sec) {
  sec.querySelectorAll('.unit').forEach(u => {
    const [a, b] = u.dataset.ym.split(' ').map(monthIndex);
    if (b < NOW || a >= NOW + 12) u.remove();

// ---------- KAY-CHAN FILLS THE GAPS (author, 2026-10-12: "we patch whats missing from our road map; leave log in
// events; include solo banner reruns, seasonal gamemodes") ----------
// From her forecast (future/data/roadmap_auto.json, future/tools/auto_roadmap.py at full power): temporary game
// modes become picture cells like the side-panel events, and solo standard reruns whose operator is not already on
// the sheet become banner rows with her avatar-matched art. Log-in events never come in (she reads them as
// "rewards"); everything the sheet has stays as it is. Each added row says so on hover.
let KAY = { rows: [] };
function kayPatch(sec) {
  const onSheet = new Set([...sec.querySelectorAll('.unit:not(.evrow) .nm > span:not(.ltag)')].map(s => s.textContent.trim().toLowerCase()));
  for (const r of KAY.rows) {

    const mode = (r.kind === 'event' && r.tone === 'game mode') || skin;
    const rerun = r.kind === 'standard' && /复刻/.test(r.cn_title);
    if (!mode && !rerun) continue;
    if (rerun && r.ops.some(o => onSheet.has(o.name.toLowerCase()))) continue;
    // reruns keep CN's banner order, no predicted date (author, 2026-10-12: "no prediction, adhere to banner
    // sequence"): the row joins the month of the banner it followed in CN, right after that banner's block
    const anchor = rerun ? cnAnchor(sec, r.cn_start) : null;
    if (rerun && !anchor) continue;
    let [y, m, d] = r.en.split('-');
    if (anchor) { [y, m] = anchor.dataset.ym.split(' ')[0].split('-'); d = '01'; }
    const blk = anchor ? anchor.closest('.yrblock') : [...sec.querySelectorAll('.yrblock')].find(b => b.querySelector('.yr').textContent.trim() === y);
    if (!blk) continue;
    const tl = blk.querySelector('.tl');
    let node;

      node = el('article', 'unit evrow has-notes kay filler' + (skin ? ' skin' : ''));

      else { node.style.setProperty('--acc', '#8a8d96'); node.style.setProperty('--acc-ink', '#c9ccd4'); }
      node.append(el('div', 'when', String(+m)));
      const ops = el('div', 'ops');
      if (r.pic_file) { const i = el('img', 'pic evwide'); i.src = `../img/auto/${r.pic_file}`; i.alt = r.name; ops.append(i); }
      node.append(ops);
      const info = el('div', 'info'); info.append(el('div', 'nm', r.name)); node.append(info);
      if (r.facts && r.facts.skin_avatars) {   // the collab's skins on the cell (author, 2026-10-30: "op portraits pls")
        const row = el('div', 'skinops');
        r.facts.skin_avatars.forEach((a, n) => {
          const i = el('img'); i.src = `https://lemonwait.github.io/operator/avatars/${encodeURIComponent(a)}.png`; i.alt = i.title = r.facts.skins[n] || '';
          i.onerror = () => { i.onerror = null; i.src = `https://lemonwait.github.io/operator/avatars/${a.split('_').slice(0, 3).join('_')}.png`; };   // a skin not on the site yet: the operator
          row.append(i);
        });
        node.append(row);
      }
    } else {
      node = el('article', 'unit has-notes kay filler' + (r.ops.length === 1 || (r.pic_file && !r.ops.some(o => o.art)) ? ' solo' : '')); setAcc(node, '#ffffff');
      const when = el('div', 'when', String(+m)); when.append(el('small', '', y)); node.append(when);
      const ops = el('div', 'ops');
      if (r.pic_file && !r.ops.some(o => o.art)) {   // no operator art yet: the banner's (or its event's) picture, one wide tile
        const op = el('div', 'op'), i = el('img', 'pic wide'); i.src = `../img/auto/${r.pic_file}`; i.alt = r.ops.map(o => o.name).join(' & '); if (r.pic_fy) i.style.objectPosition = `50% ${r.pic_fy}`; op.append(i); ops.append(op);
      } else

        if (o.art) { const i = el('img', 'pic wide'); const mm = META[o.art]; i.src = `../img/auto/${o.art}` + (mm ? `?v=${mm.ratio}-${mm.fx}` : ''); i.alt = o.name; op.append(i); }
        op.append(el('div', 'name', o.name)); ops.append(op);
      }
      node.append(ops);
      const info = el('div', 'info'), nm = el('div', 'nm'); nm.append(el('span', '', r.ops.map(o => o.name).join(' & ')));
      const vt = el('div', 'vt'); vt.append(el('span', 'verdict', 'RERUN')); info.append(nm, vt); node.append(info);
    }
    node.dataset.ym = `${y}-${m} ${y}-${m}`; node.dataset.d = d; node.dataset.cn = r.cn_start; if (r.prts) node.dataset.prts = r.prts;
    const notes = el('div', 'notes'); notes.dataset.head = (r.name || r.ops.map(o => o.name).join(' + ')) + ' · added by Kay-chan';

    if (r.facts && r.facts.days) notes.append(el('p', '', `runs ${r.facts.days} days`));
    if (r.facts && r.facts.skins) notes.append(el('p', '', `skins: ${r.facts.skins.join(', ')}`));

    tl.insertBefore(node, next || null);

// Inside a month the rows keep CN's order (author, 2026-10-12): the month comes from each row's own start, the order
// from CN's start dates (MLP, CN 07-03, sits above Aphrissa, CN 07-10, in December). Banner rows take their CN start
// from Kay-chan's row with the same operators; a month with a row of unknown CN start keeps its date order.
function cnOrder(sec) {
  const byOps = new Map(KAY.rows.filter(r => r.ops && r.ops.length && r.cn_start).map(r => [r.ops.map(o => o.name.toLowerCase().replace(/\?$/, '')).sort().join('+'), r.cn_start]));
  sec.querySelectorAll('.unit:not(.empty):not(.evrow):not(.filler)').forEach(u => {
    const key = [...u.querySelectorAll('.nm > span:not(.ltag)')].map(x => x.textContent.trim().toLowerCase()).sort().join('+');
    if (byOps.has(key)) u.dataset.cn = byOps.get(key);
  });
  sec.querySelectorAll('.yrblock > .tl').forEach(tl => {
    const rows = [...tl.querySelectorAll(':scope > .unit:not(.empty)')];
    for (const ym of new Set(rows.map(u => u.dataset.ym.split(' ')[0]))) {
      const grp = rows.filter(u => u.dataset.ym.split(' ')[0] === ym);
      if (grp.length < 2 || grp.some(u => !u.dataset.cn)) continue;
      const after = grp[grp.length - 1].nextSibling;
      [...grp].sort((a, b) => a.dataset.cn.localeCompare(b.dataset.cn)).forEach(u => tl.insertBefore(u, after));
    }
  });
}

// the roadmap's banner row (from the sheet) that started last in CN on or before a date: CN starts come from
// Kay-chan's rows with the same operators
function cnAnchor(sec, cn) {
  const byOps = new Map(KAY.rows.filter(r => r.ops && r.ops.length && r.cn_start).map(r => [r.ops.map(o => o.name.toLowerCase().replace(/\?$/, '')).sort().join('+'), r.cn_start]));

// Chance of getting one given operator at least once in N pulls on one limited banner, exact (no simulation):
// walk every pity state (pulls since the last 6*) pull by pull. Arknights pity: 2%, +2% per pull after 50
// without a 6*; counts start at 0 on each limited banner (sheet T41). per6 = that operator's share of a 6*.
function firstHit(N, per6) {
  let st = new Map([[0, 1]]), hit = 0;
  for (let n = 0; n < N; n++) {
    const nx = new Map();
    for (const [k, pr] of st) {
      const r = Math.min(1, 0.02 + Math.max(0, k - 49) * 0.02);
      hit += pr * r * per6;
      nx.set(0, (nx.get(0) || 0) + pr * r * (1 - per6));
      nx.set(k + 1, (nx.get(k + 1) || 0) + pr * (1 - r));
    }
    st = nx;
  }
  return hit;
}
// The SA2 spook table (author, 2026-10-11): how likely SA2 comes back as off-rate on later limited banners,
// at 200 and 300 pulls a banner; every number shows its working on hover (or keyboard focus).
function spookTable(x5Text, normText) {
  const x5 = parseFloat(x5Text) / 100, nm = parseFloat(normText) / 100;
  const P = v => (v * 100).toFixed(1) + '%';
  const rows = [
    { label: 'One x5 banner', f: (a) => a, math: (N, a) =>
      `${N} pulls on one banner, ${x5Text} per 6★ (x5)\nexact sum over every pity path:\nP(at least one SA2) = ${P(a)}` },
    { label: 'All three x5 banners', f: (a) => 1 - (1 - a) ** 3, math: (N, a) =>
      `three banners, ${N} pulls each\n1 − (1 − ${P(a)})³\n= 1 − ${(1 - a).toFixed(3)}³ = ${P(1 - (1 - a) ** 3)}` },
    { label: 'One banner at normal rate', f: (a, c) => c, math: (N, a, c) =>
      `${N} pulls on one banner, ${normText} per 6★ (x5 over)\nexact sum over every pity path:\nP(at least one SA2) = ${P(c)}` },
    { label: 'A year at normal rate (4 banners)', f: (a, c) => 1 - (1 - c) ** 4, math: (N, a, c) =>
      `four banners, ${N} pulls each\n1 − (1 − ${P(c)})⁴ = ${P(1 - (1 - c) ** 4)}` },
    { label: 'Three x5 banners, then 2 years normal', f: (a, c) => 1 - (1 - a) ** 3 * (1 - c) ** 8, math: (N, a, c) =>
      `3 banners at x5 + 8 at normal, ${N} pulls each\n1 − (1 − ${P(a)})³ × (1 − ${P(c)})⁸\n= ${P(1 - (1 - a) ** 3 * (1 - c) ** 8)}` },
  ];
  const t = el('div', 'rt-odds');
  t.append(el('div', 'h ph', 'Chance SA2 comes back as off-rate'), el('div', 'h', '200 pulls / banner'), el('div', 'h', '300 pulls / banner'));
  const A = { 200: firstHit(200, x5), 300: firstHit(300, x5) }, C = { 200: firstHit(200, nm), 300: firstHit(300, nm) };
  for (const r of rows) {
    t.append(el('div', 'lab ph', r.label));
    for (const N of [200, 300]) {
      const d = el('div', 'v'); d.tabIndex = 0;
      d.append(el('b', '', P(r.f(A[N], C[N]))), el('div', 'math', r.math(N, A[N], C[N])));
      t.append(d);
    }
  }
  t.append(el('div', 'foot', 'Exact, not simulated. Pity: 2%, +2% per pull after 50 without a 6★; counts reset each banner.'));
  return t;
}


// SA2 example, read from the sheet's table (rows 121-131): years down (X123 / X127 / X131), the two limited months
// across (AB121 / AG121). A picture = x5 that banner; text with ปกติ = normal rate; other text = no chance (debut,
// not a year yet). Per-banner chance from firstHit(); the running total = 1 - product of (1 - each).
function sa2Slots(x5Text, normText) {
  const cell = ref => G.cells.find(c => c.ref === ref) || {};
  const x5 = parseFloat(x5Text) / 100, nm = parseFloat(normText) / 100;
  const A = { 200: firstHit(200, x5), 300: firstHit(300, x5) }, C = { 200: firstHit(200, nm), 300: firstHit(300, nm) };
  const months = [cell('AB121').text, cell('AG121').text].map(t => lines_(t));
  const slots = [];
  for (const [y, a, b] of [['X123', 'AB123', 'AG123'], ['X127', 'AB127', 'AG127'], ['X131', 'AB131', 'AG131']]) {
    [a, b].forEach((r, i) => {
      const c = cell(r);
      const kind = c.img ? 'x5' : /ปกติ/.test(c.text || '') ? 'norm' : (i === 0 && cell(y).text === cell('X123').text ? 'debut' : 'none');
      slots.push({ year: cell(y).text, month: months[i], c, kind, text: c.img ? '' : lines_(c.text),
        p: { 200: kind === 'x5' ? A[200] : kind === 'norm' ? C[200] : 0, 300: kind === 'x5' ? A[300] : kind === 'norm' ? C[300] : 0 } });
    });
  }
  let r200 = 1, r300 = 1;
  slots.forEach(s => { r200 *= 1 - s.p[200]; r300 *= 1 - s.p[300]; s.cum = { 200: 1 - r200, 300: 1 - r300 }; });
  return { slots, x5Text, normText };
}
const PCT = v => (v * 100).toFixed(1) + '%';
function sa2Track(data, avatar) {

    svg.append(pl);

// Suggested view of a card's lines: groups of sheet rows shown as one row; 'strike' = repeats something shown
// elsewhere (kept visible, faded, with the reason); 'merge' = could become one line with its neighbour.
function sugList(groups, hl) {
  const ul = el('ul', 'lines sug');
  for (const g of groups) {

}

// data baked next to the page (future/tools/bake_page.py), so it works opened as a file and on the site; the

const BAKED = window.FUTURE_DATA;
(BAKED ? Promise.resolve(['grid', 'images', 'meta', 'sched', 'kay', 'kaymeta', 'welfare'].map(k => BAKED[k] || {}))
  : Promise.all(['../../design/grid/FUTURE.json', '../docs/images-draft.json', '../img/strips/meta.json', '../data/schedule.json', '../data/roadmap_auto.json', '../img/auto/meta.json', '../data/welfare.json'].map(u => fetch(u + '?t=' + Date.now()).then(r => r.ok ? r.json() : {})))).then(([g, im, meta, sched, kay, kaymeta, welf]) => {
  WELF = welf || {};
  KAY = kay.rows ? kay : { rows: [] }; for (const k in kaymeta) if (!(k in meta)) meta[k] = kaymeta[k];   // Kay-chan's forecast and her crops' meta
  G = g; IM = im; META = meta; SCHED = sched;
  for (const c of G.cells) { cellAt[`${c.row}:${c.ci}`] = c; (byRow[c.row] ||= []).push(c); }
  for (const r in byRow) byRow[r].sort((a, b) => a.ci - b.ci);
  const page = document.getElementById('page');
  const road = timeline(); road.append(notes());
  page.append(road, limited(), standard(), pledge(), rates(), collab());
  const fit = () => {
    // the page may be zoomed on wide screens (CSS zoom on main); measure in page px so everything written back to
    // CSS is in the same unit (author, 2026-10-12: "kinda tiny on desktop i have to use like 125% zoom")
    // the roadmap itself is drawn as at a 175% zoom, or as large as the width allows (author, 2026-10-12: "i have
    // to use desktop zoom 175% to achieve p1 roadmap stripe size i love"); its rows stop at 1010 roadmap px
    const PZ = parseFloat(getComputedStyle(document.getElementById('page')).zoom) || 1, road = document.querySelector('section.road');
    road.style.zoom = '';
    const RZ = document.body.classList.contains('e') ? Math.max(1, Math.min(1.75, road.getBoundingClientRect().width / 1010) / PZ) : 1;
    road.style.zoom = RZ;
    const Z = PZ * RZ;
    const R = e => { const q = e.getBoundingClientRect(); return { top: q.top / Z, bottom: q.bottom / Z, left: q.left / Z, right: q.right / Z, width: q.width / Z, height: q.height / Z }; };
    const bh = document.getElementById('bar').offsetHeight; document.documentElement.style.setProperty('--bar-h', bh + 'px');
    const r = document.querySelector('section.road'), top = R(r).top;
    if (document.body.classList.contains('e')) {
      // strips: one row per banner, TBA months share a row; the strip height is what the screen has left
      r.style.removeProperty('--road-w');   // measure the art at full length; a trimmed row would cap it (the rows only ever shrank)
      r.style.setProperty('--sh', '64px');
      const rows = new Set([...r.querySelectorAll('.unit')].map(u => Math.round(R(u).top))).size;   // lines, not units: cells share one
      const used = Math.max(...[...r.querySelectorAll('.yrblock')].map(b => R(b).bottom)) - top - rows * 64;
      r.style.setProperty('--sh', Math.max(44, Math.min(130, Math.floor(((innerHeight / Z) - bh - used - 16) / rows))) + 'px');
      r.querySelectorAll('.unit').forEach(u => { const q = R(u); u.classList.toggle('up', q.top + q.height / 2 > (innerHeight / Z) * 0.55); });
      // faces clear the text at any window size (author, 2026-10-10: faces went under the names when rows got
      // taller): the first operator's face lands just past the row's text; the art still starts at the left edge
      // (the shift is never positive), so with short text the face simply sits further right.
      // One face column for every row (author, 2026-10-10: Orchid2, Aphrissa, Makoto, Clementia should sit where
      // Yato2 does): the column is just past the longest text; a shift to the right leaves the splash a left gap.
      const sh = parseFloat(r.style.getPropertyValue('--sh'));
      // the L tag's top on the top of the name's capitals (author, 2026-10-11), measured from the font itself
      const cv = document.createElement('canvas').getContext('2d');
      r.querySelectorAll('.nm .ltag').forEach(tag => {
        tag.style.transform = '';
        const name = tag.previousElementSibling, cs = getComputedStyle(name.parentElement);
        cv.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
        const m = cv.measureText('A'), fm = cv.measureText('Ag');
        const rect = R(name);
        const asc = fm.fontBoundingBoxAscent, desc = fm.fontBoundingBoxDescent;
        const baseline = rect.top + (rect.height - (asc + desc)) / 2 + asc;
        const capTop = baseline - m.actualBoundingBoxAscent;
        tag.style.transform = `translateY(${(capTop - R(tag).top).toFixed(1)}px)`;
      });
      const strips = [...r.querySelectorAll('.unit:not(.empty):not(.evrow)')];
      const col = Math.max(...strips.map(u => {
        const ul = R(u).left;
        return Math.max(...[...u.querySelector('.info').children].map(c => R(c).right)) - ul;
      })) + sh * 0.9;
      r.style.setProperty('--face-x', Math.round(col) + 'px');
      // event rows: their art starts at the face column, or past their own text when that is longer
      r.querySelectorAll('.evrow').forEach(u => {
        const ul = R(u).left;
        const end = Math.max(...[...u.querySelector('.info').children].map(c => R(c).right)) - ul;
        u.style.setProperty('--ev-x', Math.round(Math.max(col - sh * 1.2, end + sh * 0.3)) + 'px');
      });
      // one skeleton for every banner row (author, 2026-10-30: "one fixed width", "0--0"): the art ends at the same
      // x on every row, past the first face by SOLO_R row-heights (Yato2's crop has no more); a pair's second face comes
      // PAIR_GAP row-heights after the first, the joint halfway between them. Each picture slides inside its box, so
      // its face lands on its spot and the crop runs on to the box's edges.
      const SOLO_R = 4.9, PAIR_GAP = 2.1;
      const main = strips.find(u => !u.classList.contains('filler')), endX = R(main).left + col + SOLO_R * sh;
      strips.forEach(u => {
        const end = endX - R(u).left, ops = [...u.querySelectorAll('.op')], img = u.querySelector('.op .pic');
        if (!img) return;
        const metaOf = o => META[(o.querySelector('.pic').getAttribute('src') || '').split('/').pop().split('?')[0]];
        ops.forEach((o, i) => {
          const p = o.querySelector('.pic'), m = metaOf(o), last = i === ops.length - 1, face = col + i * PAIR_GAP * sh;
          if (!m) { o.style.width = Math.round(end) + 'px'; o.style.marginLeft = '0px'; return; }   // a banner picture with no crop data
          const W = m.ratio * sh, fw = m.fx * W;
          const left = i ? face - (PAIR_GAP + 1) * sh / 2 : Math.max(0, col - fw);
          const right = last ? Math.min(end, face + W - fw) : face + (PAIR_GAP + 1) * sh / 2;
          const w = right - left, q = W - w > 1 ? (fw - (face - left)) / (W - w) : 0.5;
          o.style.width = Math.round(w) + 'px';
          o.style.marginLeft = (i ? -sh : Math.round(left)) + 'px';
          p.style.objectPosition = (Math.max(0, Math.min(1, q)) * 100).toFixed(2) + '% 50%';
        });
        const op = img.closest('.op'), ml = parseFloat(op.style.marginLeft) || 0;
        op.classList.toggle('gapl', ml > 0);   // starts right of the row's edge: fade its left side in (author: Ange2 hard edge)
        let gf = u.querySelector('.ops .gapfill');
        if (ml > 0 && GAPFILL.some(n => u.querySelector('.nm').textContent.startsWith(n))) {   // Yato2's gap is fine as it is (author)
          if (!gf) { gf = el('div', 'gapfill'); img.closest('.ops').prepend(gf); }
          gf.style.setProperty('--fill', `url("${img.currentSrc || img.src}")`);
          gf.style.width = Math.round(ml + sh * 1.4) + 'px';
        } else if (gf) gf.remove();
      });
      // the rows end where the longest art ends, no blank right side (author, 2026-10-12: "could we cut these blank
      // roadmap right side out?")
      const artEnd = Math.max(...strips.map(u => Math.max(...[...u.querySelectorAll('.op')].map(o => R(o).right)) - R(u).left));
      // and never narrower than two event cells side by side (5.5 row-heights each, 6 gap, 34 indent)
      if (artEnd > 0) r.style.setProperty('--road-w', Math.ceil(Math.max(artEnd, 11 * sh + 40)) + 'px');
    }
    // the key: its middle on the yellow bar's middle, and its colour bars whole screen pixels wide so the three
    // limited bars come out even (author, 2026-10-12: "the 3 bars aren't even")
    const key = r.querySelector('.rkey'), bar = r.querySelector('.sh .bar');
    if (key && bar && getComputedStyle(key).position === 'absolute') {
      const px = Z * (devicePixelRatio || 1), snap = v => Math.max(1, Math.round(v * px)) / px;
      key.style.setProperty('--kw', snap(4) + 'px'); key.style.setProperty('--kg', snap(3) + 'px');
      key.style.bottom = 'auto'; key.style.top = '0px';
      const b = R(bar), k = R(key);
      key.style.top = ((b.top + b.height / 2) - (k.top + k.height / 2)).toFixed(2) + 'px';
      key.style.marginLeft = '0px';   // and the bars start on a whole pixel, so no edge is blurred
      const x = key.querySelector('i').getBoundingClientRect().left * (devicePixelRatio || 1);

      const rw = parseFloat(r.style.getPropertyValue('--road-w')) || 1010, free = R(r).width - rw - 40;

    }

    document.getElementById('fitinfo').textContent = `roadmap needs ${need} px, screen has ${have} px: ${need <= have ? 'fits' : 'DOES NOT FIT'}`;
  };
  // one pass can measure a layout that is still settling (author, 2026-10-12: after resizing the window and back, the
  // notes sat 1070 px too low and the rows ran long), so run again until nothing it writes changes (at most 4 passes)
  const road0 = document.querySelector('section.road');
  const state = () => road0.style.cssText + '|' + [...road0.querySelectorAll('.road-notes, .rkey')].map(e => e.className + e.style.cssText).join('|');
  const passes = () => { for (let n = 0; n < 4; n++) { const before = state(); fit(); if (state() === before) break; } };
  let queued = false;

  document.querySelectorAll('.road img').forEach(i => i.addEventListener('load', settle));
