name: Sync Arknights assets

on:
  # Every Monday at 09:00 Bangkok time (UTC+7) = 02:00 UTC.
  # cron is ALWAYS in UTC. Change the "2" if you move timezones.
  schedule:
    - cron: "0 2 * * 1"
  # Lets you run it on demand from the repo's Actions tab.
  workflow_dispatch:

permissions:
  contents: write        # needed so the job can push commits back

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Download missing assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          OWNER="PuppiizSunniiz"      # source repo owner (note: ...nniiz)
          REPO="Arknight-Images"      # source repo

          # Folders to sync, as  SOURCE_FOLDER:DEST_FOLDER
          # (DEST is relative to THIS repo). Add more lines anytime.
          PAIRS=(
            "avatars:operator/avatars"
            "skills:operator/skills"
          )

          # 1) Source repo's default branch (main vs master)
          BRANCH=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$OWNER/$REPO" | jq -r '.default_branch')
          echo "Source branch: $BRANCH"

          # 2) Pull the whole file tree once, reuse it for every folder
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$OWNER/$REPO/git/trees/$BRANCH?recursive=1" > tree.json

          total_new=0; total_fail=0

          for pair in "${PAIRS[@]}"; do
            SRC="${pair%%:*}"
            DEST="${pair##*:}"
            mkdir -p "$DEST"

            # keep only  SRC/*.png , plus a URL-encoded path (handles '#', spaces)
            jq -r --arg p "$SRC/" '
              .tree[]
              | select(.type=="blob")
              | select(.path | startswith($p))
              | select(.path | endswith(".png"))
              | [.path, (.path | split("/") | map(@uri) | join("/"))]
              | @tsv
            ' tree.json > remote.tsv

            echo "[$SRC] source has $(wc -l < remote.tsv) file(s)  ->  $DEST"

            new=0; fail=0
            while IFS=$'\t' read -r path encpath; do
              fname=$(basename "$path")
              dst="$DEST/$fname"
              [ -f "$dst" ] && continue
              url="https://raw.githubusercontent.com/$OWNER/$REPO/$BRANCH/$encpath"
              if curl -fsSL "$url" -o "$dst"; then
                new=$((new+1))
              else
                echo "::warning::skipped $SRC/$fname"
                rm -f "$dst"
                fail=$((fail+1))
              fi
            done < remote.tsv
            rm -f remote.tsv

            echo "[$SRC] downloaded $new, failed $fail"
            total_new=$((total_new+new))
            total_fail=$((total_fail+fail))
          done

          rm -f tree.json
          echo "TOTAL downloaded $total_new new file(s). Failed: $total_fail."
          echo "NEW_COUNT=$total_new" >> "$GITHUB_ENV"

      - name: Commit and push if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add operator
          if git diff --cached --quiet; then
            echo "Nothing new - nothing to commit."
          else
            git commit -m "Sync Arknights assets ($(date +%F)) - ${NEW_COUNT} new"
            git push
            echo "Committed and pushed."
          fi
