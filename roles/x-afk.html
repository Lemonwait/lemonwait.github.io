<!-- fonts: the self-hosted copies, as on the card pages (X audit, 2026-10-22: it loaded Google Fonts) -->

<style>
/* AFK page, card U (author, 2026-11-13: "implement them"): each unit drawn by afk-card.js on the author's editor layout
   (proto/afk-editor.html, exported to afk-layout.js). A filter bar on top shows only the units with every chosen chip. */
:root{--bg:#121212;--panel:#313236;--text:#e6e8f0;--dim:#b7b7b7;--sq:#515461;--cyan:#18d1ff}   /* cyan: the loader (AUTHOR-DECISIONS #24) */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Google Sans","Sarabun",sans-serif;padding:32px 16px}
/* back to the landing, the index and the Simple page (author, 2026-10-12) */
.top{max-width:1340px;margin:0 auto 6px;font-family:"Bebas Neue";font-size:14px;letter-spacing:.18em;color:#b7b7b7}
.top a{color:inherit;text-decoration:none}.top a:hover{color:#e6e8f0}
h1{font-family:"Bebas Neue";font-weight:400;font-size:44px;letter-spacing:.02em;margin:0 auto 10px;max-width:1340px}
/* damage-type colours (author, 2026-10-06) */
.dt-phys{color:rgb(255,225,0)}.dt-arts{color:rgb(255,132,193)}.dt-true{color:#fff}
.dt-necrosis{color:rgb(170,157,210)}.dt-burn{color:rgb(255,104,56)}.dt-nervous{color:rgb(0,168,195)}.dt-corrosion{color:rgb(148,194,255)}
/* filter bar */
.filters{max-width:1340px;margin:0 auto 22px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filters .lb{font-family:"Bebas Neue";font-size:16px;color:var(--dim);margin-right:4px;letter-spacing:.03em}
.filters button{font-family:"Bebas Neue";font-size:15px;letter-spacing:.03em;line-height:1;padding:5px 9px 4px;
  background:transparent;color:var(--dim);border:1.5px solid var(--sq);cursor:pointer}
.filters button.on{background:var(--text);color:#000;border-color:var(--text)}
.filters .count{margin-left:auto;font-size:13px;color:var(--dim)}
.filters .note{flex-basis:100%;font-size:12px;color:var(--dim)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,320px);gap:24px 20px;max-width:1340px;margin:0 auto;justify-content:center}
.grid .tile.hide{display:none}
/* full desktop: the whole page drawn larger, so a 1920px screen needs no browser zoom (author, 2026-11-14: "pls make it bigger
   for full desktop so i dont have to zoom in"; they read it at 125%). Only the page's own blocks: the pop-up and the loader sit
   outside them and keep reading the pointer in screen pixels. */
@media (min-width:1700px){.top,h1,.filters,.grid{zoom:1.25}}
@media (min-width:2300px){.top,h1,.filters,.grid{zoom:1.6}}
/* the tiles themselves: card U (author's editor layout, 2026-11-07 to 13; afk-card.css / afk-card.js / afk-layout.js) */
/* the loading screen, only when slow, the role pages' one over the tiles (author, 2026-10-27: "if afk page wants it we
   shall grant its loading screen"; first: "Yes, add the cards-only loader to every role page"; mockup
   roles/proto/role-loader-destealth.html). It is in the first frame but see-through; it fades in only if the page
   is not ready after 300ms, so a quick load never shows it. Same look as the X index's (cyan bar and number). It covers only the cards: from the top of the list to
   the bottom of the window, the list's width (author: "just the green area right, since headers always instant?"). */
.ld{position:absolute;z-index:999;background:var(--bg);display:grid;place-items:start center;opacity:0;pointer-events:none;visibility:hidden;
}
.ld.on{animation:ldin .25s ease forwards}
@keyframes ldin{to{opacity:1;pointer-events:auto}}
.ld.done{animation:none;pointer-events:none}
.ld .box{width:min(320px,70vw);display:grid;gap:7.8px;position:sticky;top:calc(50vh - 15px)}
.ld .bar{height:6px;background:#ffffff14;position:relative;overflow:hidden}
.ld .bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--cyan);transition:width .3s ease}
.ld .row{display:flex;justify-content:space-between;font-family:"Bebas Neue";font-size:15px;letter-spacing:.2em;
  color:#8a8a8a;opacity:0;transition:opacity .2s ease}
.ld.f .row{opacity:1}
.ld .row b{font-weight:400;color:var(--cyan);display:inline-block;min-width:4ch;text-align:right}
</style>

<div class="ld" aria-hidden="true"><div class="box"><div class="bar"><i id="lf"></i></div>
  <div class="row"><span>LOADING // <span id="ln"></span></span><b><span id="lp">0</span> %</b></div></div></div>
<script>
// the loading screen: ready = fonts + the page drawn (its markup and cards) + the pictures on the first screen; a picture that
// never answers is let go after 4s. Ready within 300ms: the screen is never seen and is simply removed.
(function () {
  const ld = document.querySelector('.ld'), lp = document.getElementById('lp'), lf = document.getElementById('lf');
  document.getElementById('ln').textContent = document.title.replace(/^X /, '').toUpperCase();
  const t0 = performance.now(), CAP = 4000, SLOW = +(new URLSearchParams(location.search).get('slow') || 0);   // ?slow=1500 holds it, to see it
  let done = 0; const steps = 3;
  const tick = () => { done++; const p = Math.round(done / steps * 100); lp.textContent = p; lf.style.width = p + '%'; };
  const fonts = document.fonts.ready.then(() => ld.classList.add('f'));
  const dom = new Promise(r => addEventListener('DOMContentLoaded', r, { once: true }));
  // over the tiles only, once the header above it is drawn
  // at 300ms: cards already on screen -> the loader never comes up over them (late pictures just appear); none yet -> it
  // fades in (author, 2026-10-28: "so when f5 it goes into p1 then p2 then back to p1?")
  // ?slow: shown at once and fully, the way a real slow load looks (nothing drawn yet), never over drawn cards
  if (SLOW) { ld.classList.add('on'); ld.style.animation = 'none'; ld.style.opacity = 1; ld.style.pointerEvents = 'auto'; }
  else setTimeout(() => { if (document.getElementById('grid')?.children.length) ld.remove(); else ld.classList.add('on'); }, 300);
  // placed the moment the list exists (a script right after it), before any card can be painted, and again once drawn
  // (author, 2026-10-28: "now it's p1 into p2 then into p3")
  ld.place = () => {
    const l = document.getElementById('grid').getBoundingClientRect();
    Object.assign(ld.style, { left: l.left + scrollX + 'px', top: l.top + scrollY + 'px', width: l.width + 'px',
      height: Math.max(240, innerHeight - l.top, l.height) + 'px', visibility: 'visible' });
    // the whole list stays covered while scrolling; the box starts mid-window and follows the scroll
    // (author, 2026-10-28: "shouldn't dark loading screen covers the whole scroll beneath it?")
    const b = ld.firstElementChild; b.style.marginTop = Math.max(0, (Math.max(240, innerHeight - l.top) - b.offsetHeight) / 2) + 'px'; };
  dom.then(ld.place);
  const imgs = dom.then(() => Promise.race([Promise.all([...document.images].filter(i => i.getBoundingClientRect().top < innerHeight)
      .map(i => i.complete ? 0 : new Promise(r => { i.addEventListener('load', r, { once: true }); i.addEventListener('error', r, { once: true }); }))),
    new Promise(r => setTimeout(r, CAP))]));
  [fonts, dom, imgs].forEach(p => p.then(tick));
  Promise.all([fonts, dom, imgs]).then(() => setTimeout(() => {
    if (performance.now() - t0 < 300) { ld.remove(); return; }
    // fade out from wherever the fade-in got to
    const o = +getComputedStyle(ld).opacity; ld.getAnimations().forEach(a => a.cancel()); ld.classList.add('done');
    ld.animate([{ opacity: o }, { opacity: 0 }], { duration: 500 * o, easing: 'ease', fill: 'forwards' }).finished.then(() => ld.remove());
  }, Math.max(0, SLOW - (performance.now() - t0))));
})();
</script>

// the 12 points for one card: block, tank, heal, DPS, AOE, ramp-up, hits / DoT, reveal, damage type, DP, range, ignores
function filterFacts(c) {
  const a = c.author.afk || {}, f = a.facts || {}, role = new Set((f.role || '').split(' ').filter(Boolean));
  const m = c.module, st = m && m.stages[((m.recommended || [])[0] || 1) - 1];
  const cost = c.base.cost + (c.pot_bonus.cost || 0) + ((st && st.stats.cost) || 0);
  const melee = a.position === 'MELEE', block = melee ? c.base.block + (f.blk || 0) : 0;
  const [sec, how] = f.ramp || [null, ''], [cut1, cut2] = a.ramp_cut || [10, 30];
  const ramp = sec == null ? '' : sec <= cut1 ? 'none' : sec <= cut2 ? 'short' : 'long';
  const dts = (f.dt || '').split(' ').filter(Boolean);
  const heal = role.has('gheal') ? 'gheal' : role.has('heal') ? 'heal' : '';
  return {block, cost, ramp, sec, how, dts, heal, role, ign: f.ign || '', known: !!a.facts,
          range: c.skill.range || c.range,
          keys: new Set([...role, heal && 'anyheal', block > 0 && 'blocker', ramp && 'ramp-' + ramp,
                         f.ign && 'ign', ...dts.map(d => 'dt-' + d)].filter(Boolean))};
}
const melee = c => (c.author.afk || {}).position === 'MELEE';
// filters: every chosen one must match (AND)
const FILTERS = [['blocker', 'BLOCKER'], ['tank', 'TANK'], ['anyheal', 'HEAL'], ['gheal', 'GROUND HEAL'], ['dps', 'DPS'],
  ['aoe', 'AOE'], ['ramp-none', 'NO RAMP'], ['ramp-short', 'SHORT RAMP'], ['ramp-long', 'LONG RAMP'], ['hits', 'MULTI-HIT'],
  ['dot', 'DOT'], ['reveal', 'REVEAL'], ['ign', 'IGNORES DODGE / DR'], ['dt-phys', 'PHYS'], ['dt-arts', 'ARTS'],
  ['dt-necrosis', 'NECROSIS'], ['dt-burn', 'BURN'], ['dt-nervous', 'NERVOUS']];
const chosen = new Set();
const ALL = (CARDS || []).map(c => ({c, F: filterFacts(c)}));
document.getElementById('ttl').textContent = document.title;
document.getElementById('filters').innerHTML = '<span class="lb">SHOW</span>' +
  FILTERS.filter(([k]) => ALL.some(x => x.F.keys.has(k)))
         .map(([k, l]) => `<button data-k="${k}">${l}</button>`).join('') +
  '<span class="count" id="count"></span>' +
  '<div class="note">Chips are Claude\'s reading of each kit in its AFK skill, not yet approved. Ramp-up: up to 10s none, up to 30s short, longer long. Hover a chip for its reason.</div>';
// the tiles: card U, drawn once the fonts are in (its sizes are measured from the drawn type)
document.getElementById('grid').innerHTML = ALL.map((x, i) => `<div class="tile" data-i="${i}"></div>`).join('');
// content sets the size (AUTHOR-DECISIONS #16): a tile grows to hold all its notes, the layout's height a minimum
const fitNotes = el => { const n = el.querySelector('.part[data-k="notes"]'); if (!n) return; const ul = n.querySelector('.p-notes');
  const need = ul ? ul.scrollHeight : 0; if (need > n.clientHeight) { n.style.height = need + 'px'; el.style.height = Math.max(L.H, n.offsetTop + need + 6) + 'px'; } };
const drawAll = () => document.querySelectorAll('#grid .tile').forEach(el => { drawTile(el, ALL[+el.dataset.i].c, false); fitNotes(el); });
drawAll(); document.fonts.ready.then(drawAll);
function apply() {
  let n = 0;
  document.querySelectorAll('.tile').forEach(el => {
    const F = ALL[+el.dataset.i].F, ok = [...chosen].every(k => F.keys.has(k));
    el.classList.toggle('hide', !ok); n += ok;
  });
  document.getElementById('count').textContent = `${n} / ${ALL.length} units`;
}
document.getElementById('filters').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  chosen.has(b.dataset.k) ? chosen.delete(b.dataset.k) : chosen.add(b.dataset.k);
  b.classList.toggle('on', chosen.has(b.dataset.k));
  apply();
});
apply();
</script>
<script src="afk-guides.js"></script>
</body>
</html>
