*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Google Sans",sans-serif}
a{color:inherit}
.wrap{max-width:1640px;margin:0 auto;padding:20px 16px 60px}
.sh-top{font:400 15px/1 "Bebas Neue";letter-spacing:.06em;color:var(--dim)}

h1{font:400 44px/1 "Bebas Neue";letter-spacing:.03em;margin:14px 0 4px}
h1 .vs{color:var(--gold-rule);margin:0 .25em}

h1 .vs::after{content:"\200B"}
.sub{color:var(--dim);font-size:14px;margin:0 0 18px}
.rule{height:2px;background:var(--gold-rule);opacity:.8;margin:0 0 18px}
.cols{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:20px}
@media (max-width:1180px){.cols{grid-template-columns:1fr 1fr}}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.op{background:#313236;border:1px solid var(--line);padding:16px}
/* no sideways scroll on a phone (X audit, 2026-10-22: section.op 410 / 499 px at 375): the cards and their grids may
   shrink below their content's width; the four-figure grids go two by two */
.cols>*{min-width:0}
.figs,.sumtop{grid-template-columns:repeat(4,minmax(0,1fr))!important}

.head{display:flex;gap:12px;align-items:center}
.head img{width:64px;height:64px;object-fit:cover;background:var(--band)}
.nm{font:400 30px/1 "Bebas Neue";letter-spacing:.03em}
.meta{color:var(--dim);font-size:13px;margin-top:4px}
.ctl{margin-top:14px;display:grid;grid-template-columns:76px 1fr;gap:10px 10px;align-items:center;align-content:start}
.lab{font:400 16px/1 "Bebas Neue";letter-spacing:.06em;color:var(--dim)}
.lv{display:flex;gap:10px;align-items:center}
.lv input[type=range]{flex:1;accent-color:var(--gold-rule)}
.lv output{font:400 22px/1 "Bebas Neue";min-width:2.4em;text-align:right;color:var(--gold-stat)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{font:400 16px/1 "Bebas Neue";letter-spacing:.04em;color:var(--text);background:var(--band);border:0;padding:6px 10px;cursor:pointer}

.skname{grid-column:2;color:var(--dim);font-size:13px;margin-top:-4px}

.fig{background:#313236;padding:8px 10px}
.fig .k{font:400 14px/1 "Bebas Neue";letter-spacing:.06em;color:var(--dim)}
.fig .v{font:400 28px/1.1 "Bebas Neue";color:var(--gold-stat);margin-top:4px}

.head .preset:hover{background:var(--on)}

.sumtop>div{background:#313236;padding:6px 8px;display:flex;flex-direction:column}
.sumtop>div .v{margin-top:auto;padding-top:4px}   /* the values on one line whatever their label's length (author: "equalize row") */

.figs.dmgx .fig .v{color:var(--arts)}
.fig .u{font-size:12px;color:var(--dim)}
h2{font:400 22px/1 "Bebas Neue";letter-spacing:.05em;margin:20px 0 8px;color:var(--gold-rule)}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}

    <div class="fig"><div class="k">HP</div><div class="v">${fmt(r.hp)}</div><div class="u">${r.regen ? `+${fmt(r.regen)} HP a second (S2)` : 'Max HP'}</div></div>
    <div class="fig"><div class="k">DEF</div><div class="v">${fmt(r.df)}</div><div class="u">${fmt(r.def0)} + ${Math.round(r.pct * 100)}%${r.passive || !r.on ? '' : ` · ${fmt(r.dfOff)} off skill`}</div></div>
    <div class="fig"><div class="k">BLOCK</div><div class="v">${r.block}</div><div class="u">enemies</div></div>
    <div class="fig"><div class="k">DODGE</div><div class="v">${r.dodge ? Math.round(r.dodge * 100) + '%' : '—'}</div><div class="u">${r.dodge ? 'no damage, on average' : 'none'}</div></div>
    ${EATK.map((a, j) => `<div class="fig"><div class="k">eHP · ${a} ATK</div><div class="v">${fmt(r.eR[j])}</div><div class="u">${fmt2(r.hitsR[j])} hits</div></div>`).join('')}
    <div class="fig"><div class="k">SKILL IN 60s</div><div class="v">${Math.round(r.on)}s</div><div class="u">${r.passive ? 'passive: always on' : r.on ? `on from ${r.first}s` : 'not in time'}${r.thorns ? ` · Thorns ${fmt(r.thorns)} Physical back a hit taken` : ''}</div></div>` : r.gen ? `
    <div class="fig"><div class="k">ATK</div><div class="v">${fmt(r.fin)}</div><div class="u">${fmt(r.atk)} + skill</div></div>
    <div class="fig"><div class="k">INTERVAL</div><div class="v">${r.ivl.toFixed(2)}</div><div class="u">s · ASPD ${r.aspd}</div></div>
    <div class="fig"><div class="k">DAMAGE</div><div class="v${c}">${o.phys ? 'PHYS' : 'ARTS'}</div><div class="u">${r.cond || 'one target'}</div></div>
    <div class="fig"><div class="k">SP</div><div class="v">${r.L.sp[0]}/${r.L.sp[1]}</div><div class="u">initial / cost</div></div>
    <div class="fig"><div class="k">OFF-SKILL DPS</div><div class="v${c}">${span(...r.off)}</div><div class="u">no skill</div></div>
    <div class="fig"><div class="k">DPH</div><div class="v${c}">${span(...r.dph)}</div><div class="u">${r.u.dph || 'a hit'}</div></div>
    <div class="fig"><div class="k">DPS</div><div class="v${c}">${span(...r.dps)}</div><div class="u">${r.u.dps || (once ? 'over the SP cycle' : 'one target')}</div></div>
    <div class="fig"><div class="k">SKILL TOTAL</div><div class="v${c}">${r.total ? span(...r.total) : '—'}</div>
      <div class="u">${r.u.tot || (once ? 'one cast' : r.total ? 'one target' : 'no end: DPS only')}</div></div>` : r.heal ? `
    <div class="fig"><div class="k">ATK</div><div class="v">${fmt(r.fin)}</div><div class="u">${fmt(r.atk)} + skill</div></div>
    <div class="fig"><div class="k">INTERVAL</div><div class="v">${r.ivl.toFixed(2)}</div><div class="u">s · ASPD ${r.aspd}</div></div>
    <div class="fig"><div class="k">PATIENTS</div><div class="v">${span(...r.tg)}</div><div class="u">${r.splash ? 'allies (splash aoe)' : 'healed a hit'}</div></div>
    <div class="fig"><div class="k">SP</div><div class="v">${r.L.sp[0]}/${r.L.sp[1]}</div><div class="u">initial / cost</div></div>
    <div class="fig"><div class="k">OFF-SKILL HPS</div><div class="v heal">${span(...r.off)}</div><div class="u">one ally, no skill</div></div>
    <div class="fig"><div class="k">HPH</div><div class="v heal">${fmt(r.hph[0])}</div><div class="u">${r.splash ? 'an ally, a hit (splash aoe)' : 'a patient, a hit'}</div></div>
    <div class="fig"><div class="k">HPS</div><div class="v heal">${span(...r.dps)}</div><div class="u">${r.splash ? '1 ~ 3 allies (splash aoe)' : r.tg[1] > 1 ? `${r.tg[0]} ~ ${r.tg[1]} patients` : 'one ally'}</div></div>
    <div class="fig"><div class="k">SKILL TOTAL</div><div class="v heal">${r.total ? span(...r.total) : '—'}</div>
      <div class="u">${r.total ? (r.rounds ? `${r.rounds} rounds, ${r.time.toFixed(1)}s${r.splash ? ', 1 ~ 3 allies (splash aoe)' : ''}` : `over ${r.time}s`) : 'no end: HPS only'}</div></div>` : `
    <div class="fig"><div class="k">ATK</div><div class="v">${fmt(r.fin)}</div><div class="u">${fmt(r.atk)} + skill</div></div>
    <div class="fig"><div class="k">INTERVAL</div><div class="v">${r.ivl.toFixed(2)}</div><div class="u">s · ASPD ${r.aspd}</div></div>
    ${r.lord ? `<div class="fig"><div class="k">HIT</div><div class="v">${r.s2 ? '100%' : Math.round(o.trait.atk_scale * 100) + '~100%'}</div><div class="u">${r.s2 ? 'Arts, ranged at full ATK' : 'ranged ~ melee'}</div></div>`
      : `<div class="fig"><div class="k">DRONES</div><div class="v">${span(...r.drones)}</div><div class="u">${r.own ? '+ her own hits' : r.aura ? '+ aura' : 'on the target'}</div></div>`}
    <div class="fig"><div class="k">SP</div><div class="v">${r.L.sp[0]}/${r.L.sp[1]}</div><div class="u">initial / cost</div></div>
    <div class="fig"><div class="k">OFF-SKILL DPS</div><div class="v arts">${span(...r.off)}</div><div class="u">${r.lord ? 'ranged ~ melee, no skill' : `${span(...r.offD)} Drone${r.offD[1] > 1 ? 's' : ''}, no skill`}</div></div>
    <div class="fig"><div class="k">DPH</div><div class="v arts">${span(...r.dph)}</div><div class="u">${r.lord ? (r.s2 ? 'one target (S2 hits 2)' : 'ranged ~ melee') : 'Drone hit at its peak'}</div></div>
    <div class="fig"><div class="k">DPS</div><div class="v arts">${span(...r.dps)}</div><div class="u">${r.lord ? 'one target' : r.own ? 'Drone at its peak + her hits' : r.aura ? 'Drones at their peak + aura' : 'every Drone at its peak'}</div></div>
    <div class="fig"><div class="k">SKILL TOTAL</div><div class="v arts">${r.total ? span(...r.total) : '—'}</div>
      <div class="u">${r.total ? (r.lord ? 'one target' : 'build-up counted') : 'no end: DPS only'}</div></div>`;
  el.querySelector('.spl').textContent = r.splash ? 'Splash AoE: no target cap around the target, main target included' : '';
  const dx = el.querySelector('.figs.dmgx');
  if (dx) dx.innerHTML = `
    <div class="fig"><div class="k">DAMAGE</div><div class="v" style="color:var(--dim)">${r.dmg ? 'TRUE' : '—'}</div><div class="u">${r.dmg ? `S2: ${Math.round(r.dmg.scale * 100)}% ATK to every enemy around the target` : 'this skill deals none'}</div></div>
    <div class="fig"><div class="k">DPH</div><div class="v">${r.dmg ? fmt(r.dmg.dph) : '—'}</div><div class="u">an enemy, a round (splash aoe)</div></div>
    <div class="fig"><div class="k">DPS</div><div class="v">${r.dmg ? fmt(r.dmg.dps) : '—'}</div><div class="u">an enemy (splash aoe)</div></div>
    <div class="fig"><div class="k">SKILL TOTAL</div><div class="v">${r.dmg && r.dmg.total ? fmt(r.dmg.total) : '—'}</div><div class="u">${r.dmg && r.rounds ? r.rounds + ' rounds, an enemy (splash aoe)' : ''}</div></div>`;
  const have = srcItems().out, rows = cost(o, st), s = settle(rows, have);
  const N_ = x => Math.round(x).toLocaleString('en-US');
  el.querySelector('.sumtop').innerHTML = `<div><div class="k">BEFORE FREEBIES</div><div class="v">${N_(s.before)}</div></div>` +
    `<div><div class="k">ACTUAL SANITY NEEDED</div><div class="v t">${N_(s.need)}</div></div>` +
    `<div><div class="k">FREE SANITY FROM ACCOUNT LEVELS (2-${doc})${ON.has('opsan') ? ' + ORIGINITE PRIME' : ''}</div><div class="v">${N_(s.fs)}</div></div>` +
    `<div><div class="k">AFTER FREE SANITY</div><div class="v t">${N_(s.after)}</div></div>`;
  el.querySelector('th.what').textContent = `E0 1 → E${st.e} ${st.lv} · skill ${st.sl > 7 ? '7, M' + (st.sl - 7) : '1 → ' + st.sl}${modOn(o, st) ? ' · ' + o.mod.code + ' ' + st.mod : ''}`;
  el.querySelector('tbody').innerHTML = s.rows.map(x =>
    `<tr class="${x.got ? (x.got >= x.n ? 'got all' : 'got') : ''}"><td>${x.k} <span class="src">${D.sources[x.k] || ''}</span></td>
      <td>${fmt2(x.n)}</td><td>${x.got ? fmt2(x.got) : ''}</td><td>${x.left == null ? '—' : x.left.toFixed(1)}</td></tr>`).join('') +
    `<tr class="sub"><td>Before freebies</td><td></td><td></td><td>${Math.round(s.before).toLocaleString('en-US')}</td></tr>
     <tr class="total"><td>ACTUAL SANITY NEEDED</td><td></td><td></td><td>${Math.round(s.need).toLocaleString('en-US')}</td></tr>
     <tr class="sub"><td>Free sanity from account levels (2-${doc})${ON.has('opsan') ? ' + Originite Prime' : ''}</td><td></td><td></td><td>${Math.round(s.fs).toLocaleString('en-US')}</td></tr>
     <tr class="total"><td>AFTER FREE SANITY</td><td></td><td></td><td>${Math.round(s.after).toLocaleString('en-US')}</td></tr>`;
  // how many of this operator give Lappland2's power, and that many times the bill (author: "power different scaled as
  // cost since lower rarities need multiple units to tame a 6*")
  const mt = el.querySelector('.match');
  const ref = powerOf(calc(D.ops[REF], state[REF])), mine = powerOf(r);
  const pname = D.page.mode === 'tank' ? {dps: 'eHP · 500 ATK', total: 'eHP · 1000 ATK', off: 'eHP · 2000 ATK'}[power]
    : {dps: 'SKILL ' + PW, total: 'SKILL TOTAL', off: 'OFF-SKILL ' + PW}[power];
  if (i === REF) { mt.innerHTML = `<div class="mk">THE REFERENCE · ${pname} ${ref ? fmt(ref) : '—'}</div>`; return; }
  if (D.page.mode === 'tank') {     // defenders do not stack on one tile: the ratio only (author, 2026-10-24)
    mt.innerHTML = `<div class="mk">AGAINST ${D.page.ref.toUpperCase()} · ${pname}</div>
      <div class="mrow"><span><b>×${(mine / ref).toFixed(2)}</b> ${D.page.ref}'s</span><span>${fmt(mine)} vs ${fmt(ref)}</span></div>`;
    return;
  }
  if (!ref || !mine) { mt.innerHTML = `<div class="mk">TO MATCH ${D.page.ref.toUpperCase()} · ${pname}: —</div><div class="mu">no figure to compare</div>`; return; }
  const u = ref / mine, sc = settle(rows.map(x => ({k: x.k, n: x.n * u})), have);
  mt.innerHTML = `<div class="mk">TO MATCH ${D.page.ref.toUpperCase()} · ${pname} ${fmt(ref)}</div>
    <div class="mrow"><span><b>×${u.toFixed(2)}</b> ${o.short}</span><span>before freebies <b>${Math.round(sc.before).toLocaleString('en-US')}</b></span>
    <span>actual needed <b>${Math.round(sc.need).toLocaleString('en-US')}</b></span>
    <span>after free sanity <b>${Math.round(sc.after).toLocaleString('en-US')}</b></span></div>`;
}
// open a tab: its operators, figures, bill and notes in place of the last; the freebie choices and MATCH BY stay
function show(key) {
  const t = TABS.find(x => x.key === key) || TABS[0], P = t.D.page, esc = x => x.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  D = t.D; HEAL = P.mode === 'heal'; PW = HEAL ? 'HPS' : 'DPS';
  state = D.ops.map(o => ({e: 1, lv: o.phases[1].max, s: o.skills.filter(s => s.e <= 1).length - 1, sl: 7, mod: 0}));
  document.title = P.tab;
  document.getElementById('h1').innerHTML = P.title.map(esc).join('<span class="vs">//</span>');
  document.getElementById('sub').textContent = P.sub;
  document.getElementById('cols').style.setProperty('--n', D.ops.length);
  const TANK = P.mode === 'tank';
  document.querySelector('#power [data-v=dps]').textContent = TANK ? 'eHP · 500 ATK' : 'SKILL ' + PW;
  document.querySelector('#power [data-v=total]').textContent = TANK ? 'eHP · 1000 ATK' : 'SKILL TOTAL';
  document.querySelector('#power [data-v=off]').textContent = TANK ? 'eHP · 2000 ATK' : 'OFF-SKILL ' + PW;
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === t.key));
  try { history.replaceState(null, '', '#' + t.key); } catch (e) {}     // a link can open a tab (from disk too)
  build(); buildFree();
}
document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (b) show(b.dataset.v); });
document.getElementById('power').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; power = b.dataset.v; updateAll(); });
show(location.hash.slice(1));
</script>
</body>
</html>
