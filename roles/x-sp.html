     DEFENSIVE Blemishine's hair, INITIAL SP Bagpipe's hair (sampled from their portraits: the median of the lit
     blonde strands, of the ginger strands), ACTIVE the author's chart orange, AMMO Claude's grey.
     Text black unless set: WCAG contrast 14.5 / 5.9 light / 13.9; INITIAL SP white (author: 3.5:1).
     CRIT WOUNDED: a faded grey barely off the page, for a mechanic nobody remembers (author), text 5.0:1 */
  --s-natural:var(--sp);--s-active:#ffc384;--s-initial:#d06f50;--s-ammo:#c9ccd4;--s-offensive:var(--chip-manual);--s-defensive:#e6c79a;
  --t-offensive:var(--text);--t-initial:#fff;--s-critwound:#4a4c52;--t-critwound:#c9ccd4}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:"Google Sans",sans-serif;padding:48px 16px}
.page{max-width:1114px;margin:0 auto}
.sh-top{font-family:"Bebas Neue";font-size:14.67px;letter-spacing:.18em;color:var(--dim);border-bottom:1px solid var(--band);padding-bottom:6px}
.sh-top a{color:inherit;text-decoration:none}.sh-top a:hover{color:var(--text)}   /* back to the index */
.sh-title{display:flex;align-items:flex-end;gap:14px;margin:20px 0 16px}
.sh-title h1{margin:0;font-size:96px;line-height:.78;font-weight:700;letter-spacing:-.02em}
.sh-idx{font-family:"Bebas Neue";font-size:18.67px;line-height:1;letter-spacing:.12em;color:var(--gold-num)}
/* the role tags, as on the role pages (links to their drafts), SP marked */
.sh-tags{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 14px}
.sh-tags a{font-family:"Bebas Neue";font-size:16px;line-height:1;letter-spacing:.06em;text-decoration:none;padding:6px 9px 4px;border:1px solid var(--band);color:var(--dim)}
.sh-tags a:hover{color:var(--text);border-color:var(--dim)}
.sh-tags a:focus-visible{outline:1.5px solid var(--orange)}
.sh-tags a[aria-current=page]{background:var(--gold-rule);border-color:var(--gold-rule);color:var(--bg)}
.who{display:flex;gap:4px}
.who button{all:unset;cursor:pointer;font-family:"Bebas Neue";font-size:22px;letter-spacing:.06em;padding:8px 18px 5px;background:var(--band);color:var(--text)}
.who button[aria-pressed=true]{background:var(--gold-rule);color:var(--bg)}
.who button:focus-visible{outline:1.5px solid var(--orange)}
.ctl{display:flex;align-items:center;gap:10px;margin:14px 0 28px;padding:10px 0;border-bottom:1px solid var(--gold-num);
  position:sticky;top:0;z-index:5;background:var(--bg);box-shadow:0 0 0 100vmax var(--bg);clip-path:inset(0 -100vmax)}
.ctl input{flex:1;min-width:0;font:inherit;font-size:14.67px;color:var(--text);background:var(--band);border:0;height:32px;padding:0 10px}
.ctl input::placeholder{color:var(--dim)}
.ctl input:focus-visible{outline:1.5px solid var(--orange)}
.ctl .count{font-family:"Bebas Neue";font-size:14.67px;letter-spacing:.12em;color:var(--gold-num);white-space:nowrap}
/* a section: its name in a coloured column, its cards beside it */
.sec{display:grid;grid-template-columns:40px 1fr;gap:16px;margin-bottom:24px}
.lab{display:flex;align-items:center;justify-content:center;color:#000;font-family:"Bebas Neue";font-size:17px;line-height:1.02;
  text-align:center;padding:14px 0;word-break:break-all;white-space:pre-line}
.lab small{display:block;font-size:11px;margin-top:6px;letter-spacing:.02em;white-space:normal;word-break:normal;padding:0 2px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:18px 12px;align-content:start}
.op{text-align:center;min-width:0;cursor:help;outline:none}
.op:focus-visible .pic{outline:1.5px solid var(--orange)}
.op .pic{width:96px;height:96px;margin:0 auto;overflow:hidden;position:relative}
.op .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.op .nm{font-weight:700;font-size:15px;line-height:1.2;margin-top:6px}
.op .cap{font-size:13px;line-height:1.3;color:var(--dim);margin-top:4px}
.empty{color:var(--dim);font-size:14px}
/* conditions in a caption (author, 2026-10-07): who (class, faction), on kill, game mode only */
.c-who{color:var(--gold-rule);font-weight:700}.c-kill{color:var(--orange);font-weight:700}.c-mode{color:#8ab4ff;font-weight:700}
/* hover popup, as on the X cards: one block per source (skill, talent, trait, module stage) */
.pop{position:absolute;z-index:20;max-width:380px;background:#121212;border:1px solid var(--band);border-top:3px solid var(--gold-rule);
  padding:10px 12px;font-size:13.33px;line-height:1.45;color:var(--text);pointer-events:none;opacity:0;transition:opacity .12s;text-align:left}
.pop.on{opacity:1}.pop.pinned{pointer-events:auto}
.pop .blk + .blk{border-top:1px solid var(--band);margin-top:10px;padding-top:10px}
.pop h4{margin:0 0 4px;font-family:"Bebas Neue";font-weight:400;font-size:16px;letter-spacing:.04em;color:#fff}
.pop p{margin:0 0 6px}.pop p:last-child{margin:0}
.pop .v{color:var(--gold-stat);font-weight:700}.pop .rem,.pop .dim{color:var(--dim)}.pop .pot{color:var(--orange);font-weight:700}
.pop .flag{color:var(--orange)}
.pop .spline{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.pop .spline .iv{display:inline-flex;align-items:center;margin-left:-4px}.pop .spline .ic{margin-right:-2px}
.pop .spline .ic svg{width:13px;height:13px;display:block}.pop .spline .sp2{margin-left:10px}.pop .spline .spc{color:var(--sp);font-weight:700}
.pop .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{display:inline-flex;flex-direction:column;align-items:flex-start}
.tag .tn{background:var(--bg);color:var(--text);font-size:10.67px;line-height:1;padding:2px 4px}
.tag .tv2{font-family:"Bebas Neue";font-size:14.67px;line-height:1;padding:3px 8px 2px}
.tag.auto .tv2{background:var(--chip-auto);color:var(--bg)}.tag.manual .tv2{background:var(--chip-manual);color:var(--text)}
.tag.passive .tv2{background:var(--chip-passive);color:var(--bg)}.tag.offensive .tv2{background:var(--chip-offensive);color:var(--bg)}
.tag.plain .tv2{background:var(--stage);color:var(--text)}
.key{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:13px;color:var(--dim)}
@media (max-width:640px){.sh-title h1{font-size:64px}.sec{grid-template-columns:28px 1fr;gap:10px}.lab{font-size:14px}
  .cards{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}.op .pic{width:80px;height:80px}}
