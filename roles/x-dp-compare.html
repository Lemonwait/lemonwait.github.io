  }
  // the stage bar folds away once the page has scrolled past it (author, 2026-10-19: "auto fold this when no mouse at
  // the top edge"): it floats over the page (a placeholder keeps its room, so nothing below moves) as one slim summary
  // line; the mouse at the top edge, or on the bar, or a slider being dragged opens it; on a touch screen, tap the line
  function autoFold(bar) {
    const ph = document.createElement('div'), sum = document.createElement('div');
    bar.before(ph); sum.className = 'fold-sum'; sum.hidden = true; document.body.appendChild(sum);
    let y = -1, drag = false, tapped = false, natural = 0;
    const text = () => {
      const s = state;
      sum.innerHTML = `<span>START <b>${s.start}</b> DP</span><span>NATURAL <b>${s.rate}</b><span class="sx">/s</span></span><span>SP DOWN <b>${s.spDown ? '−' + s.spDown + '%' : '0'}</b></span>` +
        `<span>COST <b>×${[1, 1.5, 2][s.layers]}</b></span><span>TEAM COST <b>×${[1, 1.5, 2][s.teamLayers]}</b></span><span>RETURN <b>${s.penalty ? 'AFTER EACH SKILL' : 'NEVER'}</b></span>` +
        `<span>RETREAT FOR 12TH <b>${s.lastRetreat ? 'ON' : 'OFF'}</b></span>` +
        // Closure's switches too (author, 2026-10-24: "same setting got me differently now": they were missing here)
        `<span>CLOSURE S2 <b>${s.helperDP ? 'ON' : 'OFF'}</b></span><span>HOLD OPS <b>${s.helperDP && s.hold ? 'ON' : 'OFF'}</b></span><span>DP LOWER LIMIT <b>${s.debt ? '−' + s.debt : '0'}</b></span>` +
        `<span>TIME <b>${sec(s.horizon)}</b></span>` +
        (s.team.some(m => m.first) ? `<span>FIRST <b>${s.team.filter(m => m.first).map(m => m.name).join(', ')}</b></span>` +
          (s.vBefore ? `<span>RACERS <b>BEFORE THE PICKS</b></span>` : '') : '') + `<i>▾</i>`;
    };
    const update = () => {
      const r = ph.getBoundingClientRect(), stuck = r.top < 0;
      if (!stuck) { bar.classList.remove('fixed', 'folded'); bar.style.left = bar.style.width = ''; ph.style.height = '0px'; sum.hidden = true; return; }
      if (!bar.classList.contains('fixed')) { natural = bar.offsetHeight; ph.style.height = natural + 'px'; }
      bar.classList.add('fixed');
      for (const el of [bar, sum]) { el.style.left = r.left + 'px'; el.style.width = r.width + 'px'; }
      const open = drag || tapped || (y >= 0 && y <= (bar.classList.contains('folded') ? 30 : bar.offsetHeight + 8));
      bar.classList.toggle('folded', !open); sum.hidden = open;
    };
    addEventListener('scroll', update, {passive: true}); addEventListener('resize', update);
    addEventListener('mousemove', e => { y = e.clientY; update(); });
    document.addEventListener('mouseleave', () => { y = -1; update(); });
    bar.addEventListener('pointerdown', () => { drag = true; });
    addEventListener('pointerup', () => { drag = false; setTimeout(update, 0); });
    sum.addEventListener('click', () => { tapped = true; update(); });
    document.addEventListener('click', e => { if (tapped && !bar.contains(e.target) && !sum.contains(e.target)) { tapped = false; update(); } });
    on(() => { text(); requestAnimationFrame(update); }); text(); update();
  }
  // the left vanguard's picker (author, 2026-10-24: "add 5* flags as selectable competitors when clicked on saileach
  // portraits"): a row of Saileach and the 5* Standard Bearers on her name line, always showing ("here for portraits no
  // need to fold"); a pick takes her place, at E2, S1, M3, P1 (welfare P6)
  let pickOpen = false;
  function pickerHTML() {
    // mini icons, no name or rarity (author, 2026-10-24); the name on hover
    return `<div class="pick">${LEFT.map((o, k) => `<button type="button" data-left="${k}" aria-pressed="${o.id === OPS[0].id}" title="${o.short}" aria-label="${o.short}">
      <img src="${AV(o.id)}" alt=""></button>`).join('')}</div>`;
  }
  function pickLeft(k) {
    const o = LEFT[k];
    OPS[0] = o; state.ops[0] = {e: 2, s: 0, sl: 10, mod: modE2(o), pot: o.pot};
    pickOpen = false; fire('click');
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-left]');
    if (b) { pickLeft(+b.dataset.left); return; }
    if (e.target.closest('[data-pickleft]')) { pickOpen = !pickOpen; fire('click'); }
  });
  return {OPS, COL, LEFT, pickerHTML, clock, vcost, baseCost, redeployOf, AV, autoFold, ord, flag, winFlag, landings, paintFlags, state, on, fire, results, figures, steps, table, popups, stageControls, opControls, teamControls, teamOptions, bind, tips,
          n0, sec, secT, lvName, first};
})();
</script>
<script>
const {OPS, COL, state} = UI;
const HEX = ['#e5b066', '#9ccc84'];
function controls() {
  document.getElementById('stage').innerHTML = UI.stageControls();
  document.getElementById('who').innerHTML = OPS.map((o, i) => `<div style="color:${COL[o.short]}">
    <div class="who"><img class="ava" src="${UI.AV(o.id)}" alt=""><div><div class="nmrow"><div class="nm"><span>${o.name.toUpperCase()}</span>${i ? '' : `<span class="nmroot" aria-hidden="true">${UI.LEFT[0].name.toUpperCase()}</span>`}</div>${i ? '' : UI.pickerHTML()}</div>
      <div class="meta">${'★'.repeat(o.rarity)} · P${state.ops[i].pot} · cost ${UI.vcost(i)}${state.layers ? ` (${UI.baseCost(i)} ×${[1, 1.5, 2][state.layers]})` : ''} · redeploy ${UI.redeployOf(i)}s</div></div></div>
    <div class="opctl">${UI.opControls(i)}</div></div>`).join('');
  // the title and the line under it follow whoever stands on the left
  document.querySelector('h1 .s').textContent = OPS[0].short.toUpperCase();
  document.querySelector('.sub').textContent = `${OPS[0].short} (P${OPS[0].pot} by default) · Myrtle P6 · the same team of 12 · DP from the stage, the skills and retreats`;
  document.title = `${OPS[0].short}, Myrtle · DP`;
  document.getElementById('team').innerHTML = UI.teamControls();
  document.getElementById('teamopt').innerHTML = UI.teamOptions();
}
function heads(R) {
  R.forEach((r, i) => {
    const f = UI.figures(r);
    document.getElementById('hn' + i).innerHTML = [['12TH LANDS', 'fieldAll', UI.clock(f.fieldAll)], ['FIRST SKILL', 'firstCast', UI.clock(f.firstCast)],
      ['SKILLS', 'before', f.before.length], ['SKILL DP', 'skillDP', UI.n0(f.skillDP)], ['DP SHE ADDS', 'net', UI.n0(f.net)]]
      .map(([k, key, v]) => `<div data-step="${i}:${key}"><div class="k">${k}</div><div class="v" style="color:${HEX[i]}">${v}</div></div>`).join('');
  });
}
function sheet(R) {
  const H = state.horizon, N = H, max = 99;   // one strip, every second (author: "like horizontal scroll")
  const fmt = x => Math.abs(x - Math.round(x)) < 1e-9 ? String(Math.round(x)) : (+x.toFixed(2)).toString();
  const vCell = (r, i, s) => {
    if (s.deployed) return `<div class="c dep" title="deployed: ${s.deployed} DP">−${s.deployed}</div>`;
    if (s.refund) return `<div class="c ref" title="${s.lastRetreat ? 'retreats so the 12th can land: refund' : 'retreat refund'} +${s.refund}${s.skill ? `, skill +${fmt(s.skill)} that second` : ''}">↩+${s.refund}</div>`;
    if (s.inSkill) return `<div class="c sk" style="background:${HEX[i]}" title="skill: +${fmt(s.skill)} DP">${s.skill ? '+' + fmt(s.skill) : ''}</div>`;
    if (s.gone) return '<div class="c off" title="retreated">–</div>';
    if (s.off != null) return `<div class="c off" title="redeploy in ${s.off}s">${s.off ? '↻' + s.off : '↻'}</div>`;
    // the sheet counts the seconds charging (1, 2 ... 11 for Saileach's first S1); the game's SP in the tooltip
    if (s.sp != null) return `<div class="c sp" title="SP ${fmt(s.sp)} / ${r.L.sp}">${fmt(s.charged)}</div>`;
    return '<div class="c"></div>';
  };
  // Closure, the 2nd vanguard: her SP count, her S2's DP (filled grey-blue), the 40% back shown in the TEAM cell
  const hCell = s => s.hpIn ? `<div class="c sk hp" title="Closure S2${state.helperDP ? `: +${fmt(s.hpSkill)} DP` : ''}${state.helperDP ? ' · 40% back on deployments' : ''}">${state.helperDP && s.hpSkill ? '+' + fmt(s.hpSkill) : ''}</div>`
    : s.hpSp != null ? `<div class="c sp" title="Closure SP">${fmt(s.hpSp)}</div>` : '<div class="c"></div>';
  // every face, overlapped from three on (author, 2026-10-24: "no op after hoshi deployed?": only two were drawn)
  const tCell = s => s.team.length ? `<div class="c tm${s.team.length > 2 ? ' many' : ''}" title="${s.team.map(e => `${UI.ord(e.slot)} ${state.team[e.slot - 1].name}: −${e.n}`).join(' · ')}">${
    s.team.map(e => `<img src="${UI.AV(state.team[e.slot - 1].id)}" alt="">`).join('')}<b>−${s.team.reduce((a, e) => a + e.n, 0)}${s.team.some(e => e.boost) ? `<span class="bk">↩${s.team.reduce((a, e) => a + (e.boost || 0), 0)}</span>` : ''}</b></div>` : '<div class="c"></div>';
  const dCell = (s, i, r) => `<div class="c dp${r.fieldAll === s.t ? ' all' : ''}" style="color:${r.fieldAll === s.t ? HEX[i] : ''}" title="${fmt(s.dp).replace('-', '−')} DP${s.dp < -1e-9 ? ' · in debt: natural DP at half speed' : ''}${r.fieldAll === s.t ? ' · the 12th lands' : ''}">${String(Math.floor(s.dp + 1e-9)).replace('-', '−')}</div>`;
  let out = '';
  for (let a = 1; a <= H; a += N) {
    const T = []; for (let t = a; t < a + N && t <= H; t++) T.push(t);
    const row = (label, color, cells) => `<div class="c h" style="color:${color || ''}">${label}</div>${cells}`;
    out += `<div class="strip" style="grid-template-columns:78px repeat(${N},38px)">` +
      row('TIME', '', T.map(t => `<div class="c t${t % 10 === 0 ? ' ten' : ''}">${t}</div>`).join('')) +
      R.map((r, i) => {
        const S = T.map(t => r.secs[t - 1]);
        // mirrored round the middle (author, 2026-10-19: "dp row position should be mirrored": time, team, dp,
        // saileach / myrtle, dp, team): the two skill rows meet in the middle
        const rows = [row('TEAM', '', S.map(tCell).join('')),
                      ...(r.cfg.helper && state.helperDP ? [row('CLOSURE', '', S.map(hCell).join(''))] : []),
                      row('DP', '', S.map(s => dCell(s, i, r)).join('')),
                      row(r.o.short.toUpperCase(), HEX[i], S.map(s => vCell(r, i, s)).join(''))];
        return (i ? rows.reverse() : rows).join('');
      }).join('<div class="split"></div>') +            // a band between the two (author: "some horizontal gap between saileach and myrtle pls")
      row('VS', '', T.map(t => { const d = Math.floor(R[0].secs[t - 1].dp + 1e-9) - Math.floor(R[1].secs[t - 1].dp + 1e-9);
        return `<div class="c vs" style="color:${d > 0 ? HEX[0] : d < 0 ? HEX[1] : 'var(--grey)'}">${d > 0 ? '+' + d : d}</div>`; }).join('')) +
      '</div>';
  }
  const box = document.getElementById('sheet'), x = box.scrollLeft;
  box.innerHTML = out; box.scrollLeft = x;                    // a setting change keeps the place you scrolled to
}
function render(kind) {
  if (kind !== 'input') controls();
  const R = UI.results();
  queueMicrotask(() => UI.paintFlags(R));
  heads(R); sheet(R);
}

document.getElementById('notes').innerHTML = `<b>Rules (PRTS).</b> Natural DP 1 a second unless the stage changes it; DP stops at 99.
  Each departure adds a redeploy penalty layer: the 2nd deployment costs ×1.5, the 3rd on ×2.0 (floored); THEIR DEPLOY COST starts them already ×1.5 or ×2.0. A retreat refunds
  half of what that deployment cost (floored). Saileach E2 T2: the next Operator after her costs −2 DP. Closure in the squad lowers
  the DP lower limit (E2 talent −3, TAC-X 2 −4, TAC-X 3 −5, one more at P3): DP may go below 0, and natural DP comes in at half speed until it is back to 0.
  <b>Click a figure</b> for its Step | Value table.`;
// the mouse wheel scrolls the sheet sideways while the pointer is over it (author, 2026-10-19: "i need to be able to mouse
// wheel scrolling horizontally when hover over the race too"); never the page, even at either end ("no vertical scroll
// even when race scroll hits its horizontal edge on either end")
document.getElementById('sheet').addEventListener('wheel', e => {
  const b = e.currentTarget, d = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : 0;
  if (!d) return;                                              // a sideways swipe scrolls by itself
  e.preventDefault();
  b.scrollLeft += d * (e.deltaMode === 1 ? 38 : 1);           // a line-based wheel: one second a notch
}, {passive: false});
UI.bind(document.getElementById('root')); UI.popups(document.getElementById('root')); UI.tips();
UI.on(render); render('click');
UI.autoFold(document.getElementById('stage'));
</script>
</body>
</html>
