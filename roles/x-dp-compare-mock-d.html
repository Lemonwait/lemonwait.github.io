<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saileach, Myrtle · DP</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<link rel="stylesheet" href="x-dp-compare.css">
<!-- MOCK D · SHEET (author, 2026-10-19: "try horizontal dp bars highlighting their active skills", "for D", then "like my
     sheet design but horizontal"): the DP sheet turned on its side. Was: The sheet's
     rows turned into bars: one row a second, down the middle; each vanguard's DP on hand as a horizontal bar, Saileach's
     growing left, Myrtle's right (mirrored, AUTHOR-DECISIONS #17: equal areas); a second her skill is running is filled
     in her colour, the rest grey. A team member landing that second shows its icon at the bar's end. Hover a row for
     that second. -->
<style>
.wrap{max-width:1180px}
.stagebar{background:rgba(32,33,36,.96);border-bottom:1px solid var(--line);
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 18px;padding:10px 0;margin-bottom:16px}
.stagebar label.ctl{display:grid;grid-template-columns:1fr auto}
.stagebar label.ctl input{grid-column:1/-1}
.stagebar .ctl{flex-direction:column;align-items:stretch;gap:6px}
@media (max-width:900px){.stagebar{grid-template-columns:repeat(2,minmax(0,1fr));position:static}}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media (max-width:760px){.duo{grid-template-columns:minmax(0,1fr)}}
.who{display:flex;gap:12px;align-items:center;padding-bottom:8px;border-bottom:2px solid currentColor}
.who .nm{font:400 32px/1 "Bebas Neue";letter-spacing:.03em}
.who .meta{color:var(--dim);font-size:13px;margin-top:3px}
.duo>div:last-child .who{flex-direction:row-reverse;text-align:right}
.duo>div:last-child .opctl .ctl{flex-direction:row-reverse}
.duo>div:last-child .opctl .seg{justify-content:flex-end}
.opctl{display:grid;gap:7px;margin-top:10px;color:var(--text)}
.hn{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px}
/* the figures on a grey tint (author, 2026-10-19: "some tint for this section"; DUEL's survival panel: white 5.5%, no line) */
.duo.hns{background:rgba(255,255,255,.055);padding:10px 12px 12px;margin-top:12px}
.duo.hns .hn{margin-top:0}
.duo>div:last-child.hn{direction:rtl}
.hn>div{direction:ltr;display:flex;flex-direction:column}
/* one line for both rows of figures, every number on the same bottom edge (author: "equalize rows") */
.hn .v{margin-top:auto;padding-top:3px}
.duo>div:last-child.hn>div{text-align:right}
.hn .k{font:400 13px/1 "Bebas Neue";letter-spacing:.06em;color:var(--dim)}
.hn .v{font:400 34px/1 "Bebas Neue"}
h2{font:400 22px/1 "Bebas Neue";letter-spacing:.05em;margin:26px 0 4px;color:var(--gold-rule)}
.def{color:var(--dim);font-size:13px;margin:0 0 8px}
.key{display:flex;gap:16px;flex-wrap:wrap;color:var(--dim);font-size:12px;margin:0 0 10px}
.key i{display:inline-block;width:18px;height:8px;margin-right:5px;vertical-align:middle}
/* the sheet, turned on its side (author, 2026-10-19: "like my sheet design but horizontal"): a strip of seconds, each
   vanguard's three sheet rows under it (her SP or skill DP, the team's costs, DP), then VS; strips wrap, no sideways scroll */
.strip{display:grid;margin:0;font-size:12px;width:max-content}
/* the sheet scrolls sideways inside its box; the row names stay pinned on the left */
#sheet{overflow-x:auto;scrollbar-color:var(--gold-num) var(--band)}
.strip .c.h{position:sticky;left:0;z-index:2;background:var(--bg)}
/* no lines between cells (author, 2026-10-19: "pls no micro frames"): space and tone only */
.strip .c{height:24px;display:flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;position:relative}
.strip .h{font:400 13px/1 "Bebas Neue";letter-spacing:.05em;color:var(--dim);justify-content:flex-start;padding-left:6px}
.strip .t{font:400 14px/1 "Bebas Neue";color:var(--grey)}
.strip .t.ten{color:var(--text)}
.strip .sp{color:#8a8a8a}
.strip .dep{color:var(--text);font-weight:700}
.strip .sk{color:#121212;font-weight:700}
.strip .off{color:#6a6d74;font-size:10.5px}
.strip .ref{color:var(--gold-stat)}
.strip .tm img{width:18px;height:18px;object-fit:cover}
.strip .tm b{font-weight:700;font-size:10.5px;margin-left:1px}
.strip .dp{color:var(--text)}
.strip .vs{font-weight:700}
.strip .gap{height:6px;border:0}
.strip .split{grid-column:1/-1;height:12px}
.strip .hp{background:#8aa3c4}
.strip .bk{color:#8aa3c4;margin-left:2px}
.strip .c.tm{overflow:visible;justify-content:flex-start;padding-left:2px;z-index:1}   /* a cost and its 40% back spill into the next cell */
.strip .all{box-shadow:inset 0 -3px 0 currentColor}
</style>
</head>
<body>
<div class="wrap" id="root">
  <div class="sh-top"><a href="../redalurks-handbook-landing_30.html">REDALURK'S HANDBOOK</a> // <a href="x-index.html">ROLES</a> // DP</div>
  <h1><span class="s">SAILEACH</span><span class="vs">//</span><span class="m">MYRTLE</span></h1>
  <p class="sub">Saileach (P1 by default) · Myrtle P6 · the same team of 12 · DP from the stage, the skills and retreats</p>
  <div class="mockbar">MOCK <a href="x-dp-compare-mock-a.html">A · RACE</a><a href="x-dp-compare-mock-b.html">B · LANES</a><a href="x-dp-compare-mock-c.html">C · LEDGER</a><a class="cur" href="x-dp-compare-mock-d.html">D · SHEET</a></div>
  <div class="stagebar" id="stage"></div>
  <div class="duo" id="who"></div>
  <div class="duo hns"><div class="hn" id="hn0"></div><div class="hn" id="hn1"></div></div>
  <h2>SECOND BY SECOND</h2>
  <div id="sheet"></div>
  <section class="teamsec"><h2>THE TEAM OF 12</h2><div id="team"></div></section>
  <div class="notes" id="notes"></div>
</div>
<script src="x-dp-compare-data.js"></script>
<script src="x-dp-compare-sim.js"></script>
<script src="x-dp-compare-ui.js"></script>
<script>
const {OPS, COL, state} = UI;
const HEX = ['#e5b066', '#9ccc84'];
function controls() {
  document.getElementById('stage').innerHTML = UI.stageControls();
  document.getElementById('who').innerHTML = OPS.map((o, i) => `<div style="color:${COL[o.short]}">
    <div class="who"><img class="ava" src="${UI.AV(o.id)}" alt=""><div><div class="nm">${o.name.toUpperCase()}</div>
      <div class="meta">${'★'.repeat(o.rarity)} · P${state.ops[i].pot} · cost ${UI.vcost(i)}${state.layers ? ` (${UI.baseCost(i)} ×${[1, 1.5, 2][state.layers]})` : ''} · redeploy ${UI.redeployOf(i)}s</div></div></div>
    <div class="opctl">${UI.opControls(i)}</div></div>`).join('');
  document.getElementById('team').innerHTML = UI.teamControls();
}
function heads(R) {
  R.forEach((r, i) => {
    const f = UI.figures(r);
    document.getElementById('hn' + i).innerHTML = [['12TH LANDS', 'fieldAll', UI.clock(f.fieldAll)], ['FIRST SKILL', 'firstCast', UI.clock(f.firstCast)],
      ['SKILLS', 'before', f.before.length], ['SKILL DP', 'skillDP', UI.n0(f.skillDP)], ['DP SHE ADDS', 'net', UI.n0(f.net)]]
      .map(([k, key, v]) => `<div data-step="${i}:${key}"><div class="k">${k}</div><div class="v" style="color:${HEX[i]}">${v}</div></div>`).join('');
  });
}
function sheet(R) {
  const H = state.horizon, N = H, max = 99;   // one strip, every second (author: "like horizontal scroll")
  const fmt = x => Math.abs(x - Math.round(x)) < 1e-9 ? String(Math.round(x)) : (+x.toFixed(2)).toString();
  const vCell = (r, i, s) => {
    if (s.deployed) return `<div class="c dep" title="deployed: ${s.deployed} DP">−${s.deployed}</div>`;
    if (s.refund) return `<div class="c ref" title="${s.lastRetreat ? 'retreats so the 12th can land: refund' : 'retreat refund'} +${s.refund}${s.skill ? `, skill +${fmt(s.skill)} that second` : ''}">↩+${s.refund}</div>`;
    if (s.inSkill) return `<div class="c sk" style="background:${HEX[i]}" title="skill: +${fmt(s.skill)} DP">${s.skill ? '+' + fmt(s.skill) : ''}</div>`;
    if (s.gone) return '<div class="c off" title="retreated">–</div>';
    if (s.off != null) return `<div class="c off" title="redeploy in ${s.off}s">${s.off ? '↻' + s.off : '↻'}</div>`;
    // the sheet counts the seconds charging (1, 2 ... 11 for Saileach's first S1); the game's SP in the tooltip
    if (s.sp != null) return `<div class="c sp" title="SP ${fmt(s.sp)} / ${r.L.sp}">${fmt(s.charged)}</div>`;
    return '<div class="c"></div>';
  };
  // Closure, the 2nd vanguard: her SP count, her S2's DP (filled grey-blue), the 40% back shown in the TEAM cell
  const hCell = s => s.hpIn ? `<div class="c sk hp" title="Closure S2${state.helperDP ? `: +${fmt(s.hpSkill)} DP` : ''}${state.helperRefund ? ' · 40% back on deployments' : ''}">${state.helperDP && s.hpSkill ? '+' + fmt(s.hpSkill) : ''}</div>`
    : s.hpSp != null ? `<div class="c sp" title="Closure SP">${fmt(s.hpSp)}</div>` : '<div class="c"></div>';
  const tCell = s => s.team.length ? `<div class="c tm" title="${s.team.map(e => `${UI.ord(e.slot)} ${state.team[e.slot - 1].name}: −${e.n}`).join(' · ')}">${
    s.team.slice(0, 2).map(e => `<img src="${UI.AV(state.team[e.slot - 1].id)}" alt="">`).join('')}<b>−${s.team.reduce((a, e) => a + e.n, 0)}${s.team.some(e => e.boost) ? `<span class="bk">↩${s.team.reduce((a, e) => a + (e.boost || 0), 0)}</span>` : ''}</b></div>` : '<div class="c"></div>';
  const dCell = (s, i, r) => `<div class="c dp${r.fieldAll === s.t ? ' all' : ''}" style="color:${r.fieldAll === s.t ? HEX[i] : ''}" title="${fmt(s.dp)} DP${r.fieldAll === s.t ? ' · the 12th lands' : ''}">${Math.floor(s.dp + 1e-9)}</div>`;
  let out = '';
  for (let a = 1; a <= H; a += N) {
    const T = []; for (let t = a; t < a + N && t <= H; t++) T.push(t);
    const row = (label, color, cells) => `<div class="c h" style="color:${color || ''}">${label}</div>${cells}`;
    out += `<div class="strip" style="grid-template-columns:78px repeat(${N},38px)">` +
      row('TIME', '', T.map(t => `<div class="c t${t % 10 === 0 ? ' ten' : ''}">${t}</div>`).join('')) +
      R.map((r, i) => {
        const S = T.map(t => r.secs[t - 1]);
        // mirrored round the middle (author, 2026-10-19: "dp row position should be mirrored": time, team, dp,
        // saileach / myrtle, dp, team): the two skill rows meet in the middle
        const rows = [row('TEAM', '', S.map(tCell).join('')),
                      ...(r.cfg.helper && (state.helperDP || state.helperRefund) ? [row('CLOSURE', '', S.map(hCell).join(''))] : []),
                      row('DP', '', S.map(s => dCell(s, i, r)).join('')),
                      row(r.o.short.toUpperCase(), HEX[i], S.map(s => vCell(r, i, s)).join(''))];
        return (i ? rows.reverse() : rows).join('');
      }).join('<div class="split"></div>') +            // a band between the two (author: "some horizontal gap between saileach and myrtle pls")
      row('VS', '', T.map(t => { const d = Math.floor(R[0].secs[t - 1].dp + 1e-9) - Math.floor(R[1].secs[t - 1].dp + 1e-9);
        return `<div class="c vs" style="color:${d > 0 ? HEX[0] : d < 0 ? HEX[1] : 'var(--grey)'}">${d > 0 ? '+' + d : d}</div>`; }).join('')) +
      '</div>';
  }
  const box = document.getElementById('sheet'), x = box.scrollLeft;
  box.innerHTML = out; box.scrollLeft = x;                    // a setting change keeps the place you scrolled to
}
function render(kind) {
  if (kind !== 'input') controls();
  const R = UI.results();
  queueMicrotask(() => UI.paintFlags(R));
  heads(R); sheet(R);
}

document.getElementById('notes').innerHTML = `<b>Rules (PRTS).</b> Natural DP 1 a second unless the stage changes it; DP stops at 99.
  Each departure adds a redeploy penalty layer: the 2nd deployment costs ×1.5, the 3rd on ×2.0 (floored); THEIR DEPLOY COST starts them already ×1.5 or ×2.0. A retreat refunds
  half of what that deployment cost (floored). Saileach E2 T2: the next Operator after her costs −2 DP.
  <b>Click a figure</b> for its Step | Value table.`;
// the mouse wheel scrolls the sheet sideways while the pointer is over it (author, 2026-10-19: "i need to be able to mouse
// wheel scrolling horizontally when hover over the race too"); never the page, even at either end ("no vertical scroll
// even when race scroll hits its horizontal edge on either end")
document.getElementById('sheet').addEventListener('wheel', e => {
  const b = e.currentTarget, d = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : 0;
  if (!d) return;                                              // a sideways swipe scrolls by itself
  e.preventDefault();
  b.scrollLeft += d * (e.deltaMode === 1 ? 38 : 1);           // a line-based wheel: one second a notch
}, {passive: false});
UI.bind(document.getElementById('root')); UI.popups(document.getElementById('root'));
UI.on(render); render('click');
UI.autoFold(document.getElementById('stage'));
</script>
</body>
</html>
