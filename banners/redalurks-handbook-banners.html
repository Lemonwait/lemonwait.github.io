  /* ---- phone ---- */

  html.phone .tag { font: 400 12px 'Bebas Neue', 'Bebas Neue Fallback'; letter-spacing: 2.5px; color: #8a8a8a; }/* author: WHEN, FEATURED, PITY, GUARANTEE all one design, a solid tag in the category colour */
  html.phone .tag.key, html.phone .tag.k-when, html.phone .tag.k-featured { display: inline-block; padding: 2px 7px 1px; color: #121212; background: var(--fc); }/* author: the marks in one colour, the category's: WHEN, FEATURED, the banner square, the verdict dot */
  html.phone .th-label { display: block; font-size: 12.5px; color: rgba(230, 232, 240, .8); }/* author: 20 % dimmer than the white *//* author: WHEN, FEATURED, GUARANTEE text a bit bigger (12 px before); the colour box hugs each word */
  html.phone .fr .tag.key, html.phone .fr .tag.k-when, html.phone .fr .tag.k-featured { display: block; width: fit-content; font-size: 14px; line-height: 1;
      letter-spacing: 2px; padding: 2px 2px 1px 4px; margin: 0 0 4px auto; }/* author: the colour hugs the word */

<body>
<div id="desk-root">
<div class="track" id="track">
  <section class="intro">
    <div class="idx">REDALURK'S HANDBOOK //</div>
    <h1>BANNERS</h1>
    <nav id="nav"></nav>
    <div class="hint">SCROLL <svg class="arr" viewBox="0 0 33 14" aria-hidden="true"><path d="M0 7H30M23.9 1.6l8.1 5.4-8.1 5.4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"/></svg></div>
  </section>
  <div class="rail" id="rail"></div>
</div>
<div class="meter"><span id="pos">01 // 05</span><span class="bar"><i id="prog"></i></span><span>BANNERS</span></div>
</div>
<div id="out"></div>
<script>
function deskPage() {
const { EDITS, LABELS, TAGS, adjust, bannerImg, categoryColour, html, layoutField, lit, load, makeLook, tone } = window.BannersLib;

const { families, labels } = load();
const track = document.getElementById('track');
const KEYS = ['when', 'featured', 'pity', 'guarantee'], KEY = ['pity', 'guarantee'];

const { render } = makeLook(families);
document.body.classList.add('glow-' + (new URLSearchParams(location.search).get('glow') || 'wash')); // author: "try wash"

document.getElementById('rail').innerHTML = '<div></div><div></div><div></div>' +
  KEYS.map(k => `<div class="k-${k}${KEY.includes(k) ? ' key' : ''}"><b>${TAGS[k]}</b>${labels[k]}</div>`).join('') + `<div class="k-verdict key"><b>${TAGS.verdict}</b>${labels.verdict}</div>`;
document.body.classList.add('hov-' + (new URLSearchParams(location.search).get('hov') || 'glow'));
const LAB = new URLSearchParams(location.search).get('lab') || 'ruler'; // author: tried A (CN rail), now trying C (ruler, 'the rhodes one')
if (LAB) {
  document.body.classList.add('lab-' + LAB);
  const rail = document.getElementById('rail');
  [...rail.children].forEach((d, i) => { if (i >= 3) { d.classList.add('k'); d.insertAdjacentHTML('afterbegin', `<i>${String(i - 2).padStart(2, '0')}</i>`); } });
  rail.insertAdjacentHTML('beforeend', '<span class="deco"></span><span class="top" id="railTop"></span>');
}
const railTop = (i, id) => { const t = document.getElementById('railTop'); if (!t) return;
  t.innerHTML = LAB === 'rail' ? `<span class="big">${String(i + 1).padStart(2, '0')}</span><span class="of">// OF 05</span><span class="v">${id}</span>`
              : LAB === 'ruler' ? `RHODES ISLAND //<b>${id}</b>` : ''; };
document.getElementById('nav').innerHTML = families.map((f, i) =>
  `<a href="#${f.en}"><i style="background:${f.color}"></i>${String(i + 1).padStart(2, '0')} ${f.en} <span>${f.th}</span></a>`).join('');
families.forEach((f, fi) => {
  const n = f.banners.length, cols = `repeat(${n}, var(--col))`, fc = categoryColour(fi);
  const sec = document.createElement('section'); sec.className = 'fam'; sec.id = f.en; sec.style.setProperty('--fc', fc);
  let h = `<div class="fh"><span class="n">${String(fi + 1).padStart(2, '0')}</span><h2>${f.en}</h2><span class="th">${f.th}</span></div>`;
  h += `<div class="imgs" style="grid-template-columns:${cols}">${f.banners.map(b => `<div class="img">${bannerImg(b)}</div>`).join('')}</div>`;
  h += `<div class="names" style="grid-template-columns:${cols}">${f.banners.map(b => `<div class="name" style="--st:${tone(b.stripe)}"><span class="en">${b.en}</span><span class="th">${b.th}</span>${b.note ? `<span class="note">${b.note}</span>` : ''}</div>`).join('')}</div>`;
  [...KEYS, 'verdict'].forEach((k, ki) => {
    const { items, rows } = layoutField(f, k), filled = new Set();
    let band = `<div class="band${KEY.includes(k) ? ' key' : ''}" data-k="${k}" style="grid-row:${ki + 4};grid-column:1;grid-template-columns:${cols};grid-template-rows:${k === 'guarantee' ? `repeat(${rows}, 2.32em);align-content:start` : `repeat(${rows}, minmax(0, 1fr))`}">`;
    for (const it of items) {
      const cls = k === 'verdict' ? 'c verdict' : 'c' + (it.cell.hl ? ' hl' : '');
      const body = render(it.cell, fc, KEY.includes(k), html);
      band += `<div class="${cls}" style="grid-column:${it.col + 1} / span ${it.span};grid-row:${it.row + 1} / span ${it.rowSpan};--vc:${tone(it.cell.of[0].verdictColor)}">${body}</div>`;
      for (let c = it.col; c < it.col + it.span; c++) for (let q = it.row; q < it.row + it.rowSpan; q++) filled.add(c + ':' + q);
    }
    for (let c = 0; c < n; c++) for (let q = 0; q < rows; q++) if (!filled.has(c + ':' + q)) band += `<div class="c empty" style="grid-column:${c + 1};grid-row:${q + 1}"></div>`;
    h += band + '</div>';
  });
  for (const k of KEY) h += `<div class="kw" data-k="${k}" style="grid-row:${KEYS.indexOf(k) + 4}"><span>${TAGS[k]}</span></div>`;
  h += '<div class="colhl"></div>';
  sec.innerHTML = h; track.appendChild(sec);
  // Column under the mouse: one light per category, moved to the banner column the pointer is over.
  const hl = sec.querySelector('.colhl'), colStart = () => sec.querySelector('.imgs').offsetLeft;
  const place = i => { hl.style.left = (colStart() + i * (291 + 28)) + 'px'; hl.style.top = sec.querySelector('.names').offsetTop + 'px'; // from the name down: the banner art is not lit (author)
    sec.querySelectorAll('.img').forEach((m, j) => m.classList.toggle('hot', j === i)); };
  sec.addEventListener('mousemove', e => {
    const x = e.clientX - sec.querySelector('.imgs').getBoundingClientRect().left, i = Math.floor(x / (291 + 28));
    if (i < 0 || i >= n || x - i * 319 > 291) { hl.classList.remove('on'); sec.classList.remove('hovering'); return; }
    if (hl.dataset.i != i || !hl.classList.contains('on')) { hl.classList.remove('on'); void hl.offsetWidth; place(i); hl.dataset.i = i; hl.classList.add('on'); sec.classList.add('hovering'); }
  });
  sec.addEventListener('mouseleave', () => { hl.classList.remove('on'); sec.classList.remove('hovering'); });
});

// The wheel moves the track sideways; the category links scroll to their category.
// The wheel glides (author: smooth scroll, then mock 2 "purrrfect"): each notch moves a target by its full distance,
// the rail eases 10 % of the way there each frame, and 50 ms after it comes to rest it glides on to the nearest ideal
// place: a banner column 14 px from the label column, or either end.
let glideTo = null, gliding = false, settleTimer = null;
const glide = () => {
  if (glideTo === null) return; // a click or key stopped the glide
  // The track moves in whole pixels: a step under one pixel is lost, so finish there, and also when a step does not
  // move it (author: the rail got pinned near a fractional target and could not reach RECOLLECTION).
  const d = glideTo - track.scrollLeft, was = track.scrollLeft;
  const done = () => { track.scrollLeft = glideTo; gliding = false; glideTo = null; settle(); };
  if (Math.abs(d) < 1) return done();
  track.scrollLeft += d * .1;
  if (track.scrollLeft === was) return done();
  requestAnimationFrame(glide);
};
const glideTowards = to => {
  glideTo = Math.round(Math.max(0, Math.min(track.scrollWidth - track.clientWidth, to)));
  if (!gliding) { gliding = true; requestAnimationFrame(glide); }
};
const settle = () => {
  clearTimeout(settleTimer);
  settleTimer = setTimeout(() => {
    if (gliding) return;
    const at = track.scrollLeft, to = idealPoints().reduce((a, b) => Math.abs(b - at) < Math.abs(a - at) ? b : a);
    if (Math.abs(to - at) >= 1) glideTowards(to);
  }, 50);
};
track.addEventListener('wheel', e => {
  if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
  e.preventDefault(); clearTimeout(settleTimer);
  glideTowards((glideTo ?? track.scrollLeft) + (e.deltaMode === 1 ? e.deltaY * 40 : e.deltaY));
}, { passive: false });
['pointerdown', 'keydown'].forEach(t => addEventListener(t, () => { glideTo = null; gliding = false; clearTimeout(settleTimer); }));
const railW = () => document.getElementById('rail').offsetWidth + 24;
// The ideal places: each banner column 14 px right of the label column, and both ends of the rail.
const idealPoints = () => {
  // Measured from where the label column sits once pinned (at the start it stands further right, after the title).
  const max = track.scrollWidth - track.clientWidth, edge = track.getBoundingClientRect().left + document.getElementById('rail').offsetWidth + 14;
  const pts = [...document.querySelectorAll('.names .name')].map(n => Math.round(track.scrollLeft + n.getBoundingClientRect().left - edge));
  return [...new Set([0, ...pts.filter(p => p > 0 && p < max), max])].sort((a, b) => a - b);
};
const toCat = (id, behavior) => { const sec = document.getElementById(id);
  if (sec) track.scrollTo({ left: sec.offsetLeft - railW(), behavior }); };
document.getElementById('nav').addEventListener('click', e => {
  const a = e.target.closest('a'); if (!a) return; e.preventDefault();
  toCat(a.hash.slice(1), 'smooth');
});
const secs = [...document.querySelectorAll('.fam')];
// Room after the last category, so RECOLLECTION can scroll right up to the label column like the others (author).
const tail = () => { const last = secs[secs.length - 1]; last.style.marginRight = '0px';
  last.style.marginRight = Math.max(0, track.clientWidth - railW() - last.offsetWidth) + 'px'; }; // same stop as a category link
tail(); document.fonts.ready.then(tail); addEventListener('resize', tail);
// An address with a category (redalurks-handbook-banners.html#KERNEL) opens at it, at the same stop as its link; the
// browser's own jump would leave it at the right edge. After tail(), or the last categories cannot reach their stop.
const hashCat = () => decodeURIComponent(location.hash.slice(1));
if (hashCat()) document.fonts.ready.then(() => toCat(hashCat(), 'instant'));
addEventListener('hashchange', () => toCat(hashCat(), 'smooth'));
const at = new URLSearchParams(location.search).get('at');
if (at) document.fonts.ready.then(() => { track.scrollLeft = document.getElementById(at).offsetLeft - railW(); track.dispatchEvent(new Event('scroll')); });
track.addEventListener('scroll', () => {
  // The label column names the category beside it, as long as any of it is left there (author: on a wide screen the
  // middle of the screen named the next one; then "close but not yet" with one banner column switching early). The
  // next one takes over when it reaches the label column: the stop its link scrolls to.
  const x = track.scrollLeft + railW();
  // At the very end the last category may not reach that point, so the end counts as the last one (author: the
  // label column still said KERNEL with RECOLLECTION in full view).
  const atEnd = track.scrollLeft >= track.scrollWidth - track.clientWidth - 2;
  const i = atEnd ? secs.length - 1 : Math.max(0, secs.findLastIndex(s => s.offsetLeft <= x));
  document.getElementById('rail').style.setProperty('--fc', secs[i].style.getPropertyValue('--fc'));
  railTop(i, secs[i].id);
  document.getElementById('pos').textContent = `${String(i + 1).padStart(2, '0')} // ${String(secs.length).padStart(2, '0')} ${secs[i].id}`;
  document.getElementById('prog').style.width = (100 * track.scrollLeft / (track.scrollWidth - track.clientWidth)) + '%';
  document.getElementById('prog').style.setProperty('--mc', secs[i].style.getPropertyValue('--fc'));
});
track.dispatchEvent(new Event('scroll'));
// The label left of the bar keeps the width of its longest text, so the bar and its marks never move when the
// category changes (author: the bar shifted between "01 // 05 STANDARD" and "02 // 05 LIMITED").
const posWidth = () => { const pos = document.getElementById('pos'), was = pos.textContent; pos.style.minWidth = '';
  let w = 0; for (const [i, s] of secs.entries()) { pos.textContent = `${String(i + 1).padStart(2, '0')} // ${String(secs.length).padStart(2, '0')} ${s.id}`; w = Math.max(w, pos.getBoundingClientRect().width); }
  pos.textContent = was; pos.style.minWidth = Math.ceil(w) + 'px'; marks(); };
// The bottom bar: a mark where each category's stop is, a click glides there, a drag moves the rail with the pointer;
// either way the rail then settles on the nearest ideal place.
const bar = document.querySelector('.meter .bar');
const marks = () => {
  bar.querySelectorAll('b').forEach(b => b.remove());
  const max = track.scrollWidth - track.clientWidth;
  for (const sec of secs) bar.insertAdjacentHTML('beforeend',
    `<b style="left:${100 * Math.min(1, Math.max(0, (sec.offsetLeft - railW()) / max))}%;--c:${sec.style.getPropertyValue('--fc')}"></b>`);
};
marks(); posWidth(); document.fonts.ready.then(posWidth); addEventListener('resize', marks);
const barAt = e => { const r = bar.getBoundingClientRect();
  return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * (track.scrollWidth - track.clientWidth); };
let barDrag = null;
bar.addEventListener('pointerdown', e => { barDrag = { x: e.clientX, moved: false }; bar.setPointerCapture(e.pointerId); });
bar.addEventListener('pointermove', e => {
  if (!barDrag) return;
  if (Math.abs(e.clientX - barDrag.x) > 3) { barDrag.moved = true; bar.classList.add('drag'); }
  if (barDrag.moved) track.scrollLeft = barAt(e);
});
const barUp = e => {
  if (!barDrag) return;
  const moved = barDrag.moved; barDrag = null; bar.classList.remove('drag');
  moved ? settle() : glideTowards(barAt(e));
};
bar.addEventListener('pointerup', barUp); bar.addEventListener('pointercancel', () => { barDrag = null; bar.classList.remove('drag'); settle(); });
// A banner name whose Thai drops to a second line loses its divider (author: "fix pls").
const markWrapped = () => document.querySelectorAll('.name').forEach(n => {
  n.classList.remove('wrapped');
  const en = n.querySelector('.en'), th = n.querySelector('.th');
  if (th && th.getBoundingClientRect().top - en.getBoundingClientRect().top > 6) n.classList.add('wrapped');
});
document.fonts.ready.then(markWrapped); addEventListener('resize', markWrapped);
// Where each pity stripe's text ends, for its light wash.
const markText = () => document.querySelectorAll('.band[data-k=pity] .c:not(.empty)').forEach(c => {
  const t = c.firstElementChild; if (t) c.style.setProperty('--tw', Math.round(t.getBoundingClientRect().right - c.getBoundingClientRect().left) + 'px');
});
// Measured once the fonts are in (measuring the stand-in font gave a wash that jumped: the loading rule); until then
// the stripe shows no wash, and the fonts load with the text (font-display: block), so both appear together.
document.fonts.ready.then(markText); addEventListener('resize', markText);

}

function phonePage() {
const { EDITS, LABELS, TAGS, adjust, bannerImg, categoryColour, html, layoutField, lit, load, makeLook, tone } = window.BannersLib;

const { families, labels } = load();
const { render } = makeLook(families);
const P = new URLSearchParams(location.search), mode = P.get('m') || 'grid';
const FIELDS = ['when', 'featured', 'pity', 'guarantee'], BIG = ['pity', 'guarantee'];
const out = document.getElementById('out');

const titleHTML = `<div class="idx">REDALURK'S HANDBOOK //</div><h1>BANNERS</h1><nav>${families.map((f, i) =>
  `<a href="#${f.en}"><i style="background:${f.color}"></i>${String(i + 1).padStart(2, '0')} ${f.en} <span>${f.th}</span></a>`).join('')}</nav>`;
const catHead = (f, fi, of = '') => `<div class="ch"><span class="n">${String(fi + 1).padStart(2, '0')}</span><h2>${f.en}</h2><span class="th">${f.th}</span>${of}</div>`;
const val = (c, fc, big) => `<div class="${c.hl ? 'hl' : ''}">${render(c, fc, big, html)}</div>`;
const label = k => `<div class="lab"><span class="tag k-${k}${BIG.includes(k) ? ' key' : ''}">${TAGS[k]}</span><span class="th-label">${labels[k]}</span></div>`;
// Phone-only line breaks the author placed (the desktop stripes are wide enough for one line).
// Each entry: the rendered text a new line starts at (a space before it is dropped).
const BREAKS = {
  B11: ['แชร์แค่ตู้'],                          // STANDARD pity: "แชร์แค่ตู้ STANDARD 4 ประเภทนี้" starts the third line
  N11: ['Pity (ออก', '<span class="num">~60-70'], // LIMITED pity: the reset rule, then the rate, then the counts
};
const breaks = (c, h) => (BREAKS[c.ref] || []).reduce((t, at) => {
  const i = t.indexOf(at); if (i < 0) return t;
  const cut = t[i - 1] === ' ' ? i - 1 : i;
  return t.slice(0, cut) + '<br>' + t.slice(i);
}, h);
// One field as the look draws it: PITY as the coloured row, GUARANTEE with its faint keyword, the rest as rows.
function field(k, cells, fc) {
  if (!cells.length) return '';
  if (k === 'pity') return `<div class="pity"><span class="kw">PITY</span><span class="wash"></span><div class="txt">${cells.map(c => breaks(c, render(c, fc, true, html))).join('<br>')}</div></div>`;
  const vals = `<div class="vals">${cells.map(c => val(c, fc, BIG.includes(k))).join('')}</div>`;
  if (k === 'guarantee') return `<div class="fr guar">${label(k)}${vals}<span class="kw">GUARANTEE</span></div>`;
  return `<div class="fr">${label(k)}${vals}</div>`;
}
const nameHTML = b => `<div class="name" style="--st:${tone(b.stripe)}"><span class="en">${b.en}</span><span class="th">${b.th}</span>${b.note ? `<span class="note">${b.note}</span>` : ''}</div>`;
const verdictHTML = b => b.verdict.map(c => `<div class="verdict" style="--vc:${tone(b.verdictColor)}">${render(c, '', false, html)}</div>`).join('');

if (mode === 'stack') {
  let h = `<div class="stack"><section class="title">${titleHTML}</section>`;
  families.forEach((f, fi) => {
    const n = f.banners.length, fc = categoryColour(fi);
    const shared = c => n > 1 && c.of.filter(o => o.fam === f).length === n;
    h += `<section class="cat" id="${f.en}" style="--fc:${fc}">${catHead(f, fi)}`;
    // The rules every banner of this category shares, once.
    const all = FIELDS.map(k => {
      const seen = new Set(), cells = [];
      for (const b of f.banners) for (const c of b[k]) if (shared(c) && !seen.has(c.ref)) { seen.add(c.ref); cells.push(c); }
      return field(k, cells, fc);
    }).join('');
    if (all) h += `<div class="all"><span class="tag">ALL ${n}</span>${all}</div>`;
    // Then each banner: only what is its own.
    for (const b of f.banners) {
      h += `<article class="card"><div class="head"><div class="img">${bannerImg(b)}</div><div>${nameHTML(b)}${verdictHTML(b)}</div></div>`;
      h += FIELDS.map(k => field(k, b[k].filter(c => !shared(c)), fc)).join('');
      h += '</article>';
    }
    h += '</section>';
  });
  out.innerHTML = h + '</div>';
  const at = P.get('at'); if (at) document.getElementById(at).scrollIntoView();
} else if (mode === 'grid') {
  let h = `<div class="vp" id="vp"><div class="stage anim" id="stage"><div class="row"><div class="strip anim"><section class="page title">${titleHTML}<div class="hint">SCROLL ↓ CATEGORIES · SWIPE → BANNERS</div></section></div></div>`;
  families.forEach((f, fi) => {
    const fc = categoryColour(fi), n = f.banners.length;
    h += `<div class="row" id="${f.en}" style="--fc:${fc}"><div class="strip anim">`;
    f.banners.forEach((b, bi) => {
      const dots = `<span class="of">${f.banners.map((_, j) => `<i class="${j === bi ? 'on' : ''}"></i>`).join('')} ${bi + 1} / ${n}</span>`;
      h += `<section class="page">` + catHead(f, fi, dots) + `<div class="img">${bannerImg(b)}</div>${nameHTML(b)}${verdictHTML(b)}`
        + FIELDS.map(k => field(k, b[k], fc)).join('') + '</section>';
    });
    h += '</div></div>';
  });
  out.innerHTML = h + '</div></div><div class="meter"><span id="pos"></span><span class="bar"><i id="prog"></i></span><span>BANNERS</span></div>';
  const vp = document.getElementById('vp'), stage = document.getElementById('stage');
  const rows = [...stage.children], strips = rows.map(r => r.firstElementChild);
  rows.forEach((row, i) => row.style.top = (i * 100) + '%');
  const state = { r: 0, p: rows.map(() => 0) };
  const W = () => vp.clientWidth, H = () => vp.clientHeight;
  const count = r => strips[r].children.length;

  // Draw: the stage moves rows up and down, each strip moves its pages sideways. dx / dy: a finger's drag.
  function draw(dx = 0, dy = 0, animate = true) {
    stage.classList.toggle('anim', animate); strips.forEach(s => s.classList.toggle('anim', animate));
    stage.style.transform = `translate3d(0, ${-state.r * H() + dy}px, 0)`;
    strips.forEach((s, i) => s.style.transform = `translate3d(${-state.p[i] * W() + (i === state.r ? dx : 0)}px, 0, 0)`);
    const r = state.r, n = count(r);
    document.getElementById('pos').textContent = r ? `${String(r).padStart(2, '0')} ${rows[r].id} · ${state.p[r] + 1} / ${n}` : 'BANNERS';
    // The bar glides: it measures how far you are through all 14 banners, and follows a finger's drag.
    const before = rows.slice(1, r).reduce((t, _, i) => t + count(i + 1), 0), total = rows.slice(1).reduce((t, _, i) => t + count(i + 1), 0);
    const drag = dx ? -dx / W() : dy ? -dy / H() * (dy < 0 ? n : count(Math.max(1, r - 1))) : 0;
    const bar = document.getElementById('prog');
    bar.style.setProperty('--mc', r ? rows[r].style.getPropertyValue('--fc') : '');
    bar.classList.toggle('drag', !animate);
    bar.style.width = (100 * Math.max(0, Math.min(1, (r ? before + state.p[r] : 0) / (total - 1) + drag / (total - 1)))) + '%';
  }
  const LOCK = 220, WHEEL_GAP = 85; // ms; the turn itself is .65 s (CSS)
  let busy = false;
  // `dur` (seconds) overrides the .65 s turn for one move: a finger release finishes faster (see `end`).
  const moving = () => [stage, ...strips, document.getElementById('prog')];
  // The tuned slide always plays, also when the system asks for reduced motion (AUTHOR-DECISIONS #14).
  const setDur = dur => moving().forEach(el => el.style.transitionDuration = dur ? dur + 's' : '');
  function go(dr, dp, dur) {
    const r = Math.max(0, Math.min(rows.length - 1, state.r + dr));
    const p = Math.max(0, Math.min(count(r) - 1, dr ? state.p[r] : state.p[r] + dp));
    const moved = r !== state.r || p !== state.p[r];
    setDur(moved ? dur : 0);
    state.r = r; state.p[r] = p; draw();
    if (moved) { busy = true; setTimeout(() => busy = false, LOCK); }
    return moved;
  }

  // Wheel and trackpad: one gesture = one page. A gesture ends after WHEEL_GAP ms without wheel events, so a trackpad's
  // momentum tail never turns one flick into two pages.
  let wheelQuiet, wheelUsed = false;
  vp.addEventListener('wheel', e => {
    e.preventDefault();
    clearTimeout(wheelQuiet); wheelQuiet = setTimeout(() => wheelUsed = false, WHEEL_GAP);
    if (wheelUsed || busy) return;
    const sideways = Math.abs(e.deltaX) > Math.abs(e.deltaY) || e.shiftKey, d = sideways ? (e.deltaX || e.deltaY) : e.deltaY;
    if (Math.abs(d) < 4) return;
    wheelUsed = true;
    sideways ? go(0, Math.sign(d)) : go(Math.sign(d), 0);
  }, { passive: false });

  // Touch and mouse drag: the page follows the finger on the axis it first moved along; on release a flick
  // (fast) or a drag past 20 % moves a page, anything less springs back. Light resistance at the ends.
  let drag = null;
  vp.addEventListener('pointerdown', e => {
    if (e.target.closest('a')) return;
    drag = { x: e.clientX, y: e.clientY, t: performance.now(), axis: null };
    vp.setPointerCapture(e.pointerId);
  });
  vp.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.axis && Math.hypot(dx, dy) > 8) drag.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    if (!drag.axis) return;
    const r = state.r;
    const edge = drag.axis === 'x' ? (state.p[r] === 0 && dx > 0) || (state.p[r] === count(r) - 1 && dx < 0)
                                   : (r === 0 && dy > 0) || (r === rows.length - 1 && dy < 0);
    const k = edge ? .3 : 1;
    drag.axis === 'x' ? draw(dx * k, 0, false) : draw(0, dy * k, false);
  });
  const end = e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y, dt = performance.now() - drag.t, axis = drag.axis;
    drag = null;
    if (!axis) return draw();
    const dist = axis === 'x' ? dx : dy, size = axis === 'x' ? W() : H(), v = Math.abs(dist) / Math.max(dt, 1);
    const flick = v > .45 && Math.abs(dist) > 24;
    // Finish from where the finger let go: time the remaining distance from the finger's speed (x2), never longer
    // than the remaining share of .65 s, never under .18 s. A quick flick lands in about .35 s.
    const finish = left => Math.max(.18, Math.min(.65 * left / size, 2 * left / Math.max(v, .3) / 1000));
    if ((flick || Math.abs(dist) > size * .2) && (axis === 'x' ? go(0, -Math.sign(dist), finish(size - Math.abs(dist))) : go(-Math.sign(dist), 0, finish(size - Math.abs(dist))))) return;
    setDur(finish(Math.abs(dist))); draw();
  };
  vp.addEventListener('pointerup', end); vp.addEventListener('pointercancel', end);

  addEventListener('keydown', e => {
    const k = { ArrowDown: [1, 0], ArrowUp: [-1, 0], ArrowRight: [0, 1], ArrowLeft: [0, -1], PageDown: [1, 0], PageUp: [-1, 0] }[e.key];
    if (k && !busy) { e.preventDefault(); go(...k); }
  });
  document.querySelector('.title nav').addEventListener('click', e => {
    const a = e.target.closest('a'); if (!a) return; e.preventDefault();
    go(rows.indexOf(document.getElementById(a.hash.slice(1))) - state.r, 0);
  });

  // Every page must fit one screen: shrink a page's text in small steps until it does.
  const fit = () => strips.forEach(s => [...s.children].forEach(pg => {
    pg.style.fontSize = '';
    for (let fs = 14; pg.scrollHeight > pg.clientHeight && fs > 11; fs -= .25) pg.style.fontSize = fs + 'px';
  }));
  addEventListener('resize', () => { fit(); draw(0, 0, false); });
  // ?r=2&p=1 opens at a row and page (for screenshots).
  state.r = +P.get('r') || 0; if (state.r) state.p[state.r] = +P.get('p') || 0;
  // An address with a category (#KERNEL) opens at that category's row.
  const hashRow = () => rows.indexOf(document.getElementById(decodeURIComponent(location.hash.slice(1))));
  // The browser's own jump scrolls the frame itself; the pager moves the rows instead, so the frame stays put.
  if (hashRow() > 0) { state.r = hashRow(); vp.scrollTop = vp.scrollLeft = 0; }
  addEventListener('hashchange', () => { vp.scrollTop = vp.scrollLeft = 0; if (hashRow() > 0) go(hashRow() - state.r, 0); });
  setDur(0);
  draw(0, 0, false);
  document.fonts.ready.then(() => { fit(); draw(0, 0, false); });
} else {
  let h = `<div class="snap" id="snap"><section class="page title">${titleHTML}<div class="hint">SWIPE →</div></section>`;
  families.forEach((f, fi) => {
    const fc = categoryColour(fi);
    f.banners.forEach((b, bi) => {
      h += `<section class="page" ${bi ? '' : `id="${f.en}"`} style="--fc:${fc}">`
        + catHead(f, fi, `<span class="of">${bi + 1} / ${f.banners.length}</span>`)
        + `<div class="img">${bannerImg(b)}</div>${nameHTML(b)}${verdictHTML(b)}`
        + FIELDS.map(k => field(k, b[k], fc)).join('') + '</section>';
    });
  });
  out.innerHTML = h + '</div><div class="meter"><span id="pos"></span><span class="bar"><i id="prog"></i></span><span>BANNERS</span></div>';
  const snap = document.getElementById('snap'), pages = [...snap.children];
  document.querySelector('.title nav').addEventListener('click', e => {
    const a = e.target.closest('a'); if (!a) return; e.preventDefault();
    snap.scrollTo({ left: document.getElementById(a.hash.slice(1)).offsetLeft, behavior: 'smooth' });
  });
  const hashPage = () => document.getElementById(decodeURIComponent(location.hash.slice(1)));
  if (hashPage()) snap.scrollLeft = hashPage().offsetLeft;
  addEventListener('hashchange', () => { if (hashPage()) snap.scrollTo({ left: hashPage().offsetLeft, behavior: 'smooth' }); });
  const upd = () => {
    const i = Math.round(snap.scrollLeft / snap.clientWidth);
    document.getElementById('pos').textContent = `${String(i).padStart(2, '0')} // ${pages.length - 1}`;
    document.getElementById('prog').style.width = (100 * snap.scrollLeft / (snap.scrollWidth - snap.clientWidth)) + '%';
  };
  snap.addEventListener('scroll', upd);
  const p = +P.get('p'); if (p) snap.scrollLeft = p * snap.clientWidth;
  upd();
}
// A banner name whose Thai drops to a second line loses its divider (author: "fix pls").
const markWrapped = () => document.querySelectorAll('.name').forEach(n => {
  n.classList.remove('wrapped');
  const en = n.querySelector('.en'), th = n.querySelector('.th');
  if (th && th.getBoundingClientRect().top - en.getBoundingClientRect().top > 6) n.classList.add('wrapped');
});
document.fonts.ready.then(markWrapped); addEventListener('resize', markWrapped);

}

const phoneMode = document.documentElement.classList.contains('phone');
if (phoneMode) { document.getElementById('desk-root').remove(); phonePage(); } else deskPage();
// Crossing the width line (a turned tablet, a resized window) rebuilds in the other mode.
matchMedia('(max-width: 700px)').addEventListener('change', () => location.reload());
// ?shiftcheck=1: the loading rule's test (AUTHOR-DECISIONS #7). Adds up every layout shift for 4 s after load and
// writes the total into the title, so a headless browser can read it (python banners/build_page.py --check).
if (new URLSearchParams(location.search).get('shiftcheck')) {
  let cls = 0, n = 0; const src = [];
  new PerformanceObserver(l => l.getEntries().forEach(e => { cls += e.value; n++; src.push(...(e.sources || []).map(x => x.node && (x.node.className || x.node.nodeName) + ':' + Math.round(x.previousRect.x) + ',' + Math.round(x.previousRect.y) + '>' + Math.round(x.currentRect.x) + ',' + Math.round(x.currentRect.y))); })).observe({ type: 'layout-shift', buffered: true });
  setTimeout(() => document.title = 'SHIFT ' + cls.toFixed(4) + ' / ' + n + ' ' + src.join(' ; '), 4000);
}
</script>
